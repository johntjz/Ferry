<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Ferry Live Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6">

    <div class="w-full max-w-2xl bg-[#1e293b] rounded-2xl shadow-2xl overflow-hidden flex flex-col mb-6 ring-1 ring-white/10">
        <!-- Top Status Bar -->
        <div class="bg-[#0f172a] px-4 py-3 flex justify-between items-center border-b border-white/5">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-[#2dd4bf] animate-pulse"></div>
                <span class="text-xs font-medium text-[#2dd4bf] uppercase tracking-wider">Live System</span>
            </div>
            <div id="liveClock" class="text-sm font-medium text-gray-300">
                --:--
            </div>
        </div>

        <!-- Header / Controls -->
        <div class="p-5 sm:p-6 space-y-4">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white mb-2">Ferry Departures</h1>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Route Select -->
                <div class="space-y-1.5">
                    <label for="routeSelect" class="text-xs font-medium text-gray-400 uppercase tracking-wide">Route</label>
                    <div class="relative">
                        <select id="routeSelect" class="w-full appearance-none bg-[#0f172a] border border-white/10 text-white rounded-xl px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-[#2dd4bf] focus:border-transparent transition-all shadow-inner">
                            <!-- Populated by JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Pier Select -->
                <div class="space-y-1.5">
                    <label for="pierSelect" class="text-xs font-medium text-gray-400 uppercase tracking-wide">Departing From</label>
                    <div class="relative">
                        <select id="pierSelect" class="w-full appearance-none bg-[#0f172a] border border-white/10 text-white rounded-xl px-4 py-3 pr-10 focus:outline-none focus:ring-2 focus:ring-[#2dd4bf] focus:border-transparent transition-all shadow-inner">
                            <!-- Populated by JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Schedule Container -->
    <div id="scheduleContainer" class="w-full max-w-2xl space-y-4 pb-12">
        <!-- Cards will be injected here by JS -->
        <div class="text-center text-gray-500 py-10">Loading schedule...</div>
    </div>

    <script>
        // Data Structure prioritizing flexibility. 
        // Skipped stops are handled natively by omitting them from the trip array.
        const scheduleData = {
            "inter-islands": {
                name: "Inter-Islands", // Operator name excluded per requirement
                piers: {
                    "PC": "Peng Chau",
                    "MW": "Mui Wo",
                    "CMW": "Chi Ma Wan",
                    "CC": "Cheung Chau"
                },
                trips: [
                    // Peng Chau to Cheung Chau (Southbound variants)
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "06:15" }, { p: "MW", t: "06:45" }, { p: "CMW", t: "07:05" }, { p: "CC", t: "07:25" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "08:20" }, { p: "MW", t: "08:50" }, { p: "CMW", t: "09:10" }, { p: "CC", t: "09:30" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "10:20" }, { p: "MW", t: "10:50" }, { p: "CMW", t: "11:10" }, { p: "CC", t: "11:30" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "12:45" }, { p: "MW", t: "13:15" }, { p: "CMW", t: "13:35" }, { p: "CC", t: "13:55" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "15:40" }, { p: "MW", t: "16:10" }, { p: "CMW", t: "16:30" }, { p: "CC", t: "16:50" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "17:45" }, { p: "MW", t: "18:15" }, { p: "CMW", t: "18:35" }, { p: "CC", t: "18:55" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "20:00" }, { p: "MW", t: "20:30" }, { p: "CMW", t: "20:50" }, { p: "CC", t: "21:10" } ] },
                    
                    // Crucial requirement: Trip skipping Chi Ma Wan
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "21:50" }, { p: "MW", t: "22:20" }, { p: "CC", t: "22:50" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "PC", t: "23:45" }, { p: "MW", t: "00:15" } ] },

                    // Cheung Chau to Peng Chau (Northbound variants)
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "06:00" }, { p: "CMW", t: "06:20" }, { p: "MW", t: "06:40" }, { p: "PC", t: "07:10" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "07:45" }, { p: "CMW", t: "08:05" }, { p: "MW", t: "08:25" }, { p: "PC", t: "08:55" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "09:45" }, { p: "CMW", t: "10:05" }, { p: "MW", t: "10:25" }, { p: "PC", t: "10:55" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "11:45" }, { p: "CMW", t: "12:05" }, { p: "MW", t: "12:25" }, { p: "PC", t: "12:55" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "14:15" }, { p: "CMW", t: "14:35" }, { p: "MW", t: "14:55" }, { p: "PC", t: "15:25" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "17:00" }, { p: "CMW", t: "17:20" }, { p: "MW", t: "17:40" }, { p: "PC", t: "18:10" } ] },
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "19:15" }, { p: "CMW", t: "19:35" }, { p: "MW", t: "19:55" }, { p: "PC", t: "20:25" } ] },
                    
                    // Northbound trip skipping Chi Ma Wan
                    { operator: "Sun Ferry", stops: [ { p: "CC", t: "21:30" }, { p: "MW", t: "22:00" }, { p: "PC", t: "22:30" } ] }
                ]
            }
        };

        // DOM Elements
        const routeSelect = document.getElementById('routeSelect');
        const pierSelect = document.getElementById('pierSelect');
        const scheduleContainer = document.getElementById('scheduleContainer');
        const liveClock = document.getElementById('liveClock');

        let intervalId;

        function init() {
            populateRoutes();
            updateLiveClock();
            
            // Set intervals for live updates
            setInterval(updateLiveClock, 1000);
            
            // Event Listeners
            routeSelect.addEventListener('change', () => {
                populatePiers();
                renderSchedule();
            });
            pierSelect.addEventListener('change', renderSchedule);

            // Initial render
            populatePiers();
            renderSchedule();
            
            // Check for departures changes every 30 seconds to update countdowns smoothly
            intervalId = setInterval(renderSchedule, 30000);
        }

        function updateLiveClock() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            liveClock.textContent = now.toLocaleDateString('en-GB', options);
        }

        function populateRoutes() {
            routeSelect.innerHTML = '';
            for (const [key, route] of Object.entries(scheduleData)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = route.name;
                routeSelect.appendChild(option);
            }
        }

        function populatePiers() {
            const currentRouteKey = routeSelect.value;
            const piers = scheduleData[currentRouteKey].piers;
            
            pierSelect.innerHTML = '';
            for (const [key, name] of Object.entries(piers)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = name;
                pierSelect.appendChild(option);
            }
        }

        function parseTimeToDate(timeStr) {
            const now = new Date();
            const [hours, minutes] = timeStr.split(':').map(Number);
            let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);

            // Time Wrap-around logic:
            // If the calculated time is heavily in the past (e.g., more than 6 hours),
            // it means it's a schedule for tomorrow morning.
            if (now.getTime() - targetDate.getTime() > 6 * 60 * 60 * 1000) {
                targetDate.setDate(targetDate.getDate() + 1);
            } 
            // If it's vastly in the future (e.g., checking at 01:00 for a 23:50 ferry),
            // it means it was a ferry from the previous day.
            else if (targetDate.getTime() - now.getTime() > 18 * 60 * 60 * 1000) {
                 targetDate.setDate(targetDate.getDate() - 1);
            }

            return targetDate;
        }

        function getDepartures(routeKey, pierKey) {
            const route = scheduleData[routeKey];
            const trips = route.trips;
            const piersMapping = route.piers;
            
            const departures = [];
            const now = new Date();

            trips.forEach(trip => {
                const stops = trip.stops;
                // Find if the selected pier is in this trip
                const pierIndex = stops.findIndex(stop => stop.p === pierKey);
                
                // If the pier is in the trip and it is NOT the last stop (meaning it will depart somewhere)
                if (pierIndex !== -1 && pierIndex < stops.length - 1) {
                    const departureStop = stops[pierIndex];
                    const nextStop = stops[pierIndex + 1];
                    const finalStop = stops[stops.length - 1];
                    
                    const departureDate = parseTimeToDate(departureStop.t);
                    const diffMinutes = Math.floor((departureDate.getTime() - now.getTime()) / 60000);

                    // Only show upcoming ferries or those that departed less than 5 minutes ago
                    if (diffMinutes >= -5 && diffMinutes < 1440) {
                        
                        // Construct the clean itinerary array from the selected pier to the final stop
                        const itinerary = stops.slice(pierIndex).map(s => ({
                            name: piersMapping[s.p],
                            time: s.t
                        }));

                        departures.push({
                            operator: trip.operator,
                            departureTime: departureStop.t,
                            departureDate: departureDate,
                            nextStop: piersMapping[nextStop.p],
                            destination: piersMapping[finalStop.p],
                            etaDestination: finalStop.t,
                            countdownMins: diffMinutes,
                            itinerary: itinerary
                        });
                    }
                }
            });

            // Sort sequentially by next upcoming departure
            return departures.sort((a, b) => a.departureDate - b.departureDate);
        }

        function renderSchedule() {
            const routeKey = routeSelect.value;
            const pierKey = pierSelect.value;
            
            const departures = getDepartures(routeKey, pierKey);
            
            scheduleContainer.innerHTML = '';

            if (departures.length === 0) {
                scheduleContainer.innerHTML = `<div class="text-center text-gray-500 py-10 fade-in">No upcoming departures found for today.</div>`;
                return;
            }

            departures.forEach((dep, index) => {
                // Calculate display format for countdown
                let countdownDisplay = '';
                let countdownColorClass = '';
                
                if (dep.countdownMins < 0) {
                    countdownDisplay = 'Departed';
                    countdownColorClass = 'bg-gray-700/50 text-gray-400 border-gray-600';
                } else if (dep.countdownMins === 0) {
                    countdownDisplay = 'Boarding';
                    countdownColorClass = 'bg-red-500/20 text-red-400 border-red-500/30 animate-pulse';
                } else {
                    const hrs = Math.floor(dep.countdownMins / 60);
                    const mins = dep.countdownMins % 60;
                    countdownDisplay = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
                    countdownColorClass = dep.countdownMins <= 15 ? 'bg-orange-500/20 text-orange-400 border-orange-500/30' : 'bg-[#2dd4bf]/10 text-[#2dd4bf] border-[#2dd4bf]/30';
                }

                // Build elegant itinerary HTML
                let itineraryHtml = '';
                dep.itinerary.forEach((stop, i) => {
                    const isFirst = i === 0;
                    const isLast = i === dep.itinerary.length - 1;
                    
                    itineraryHtml += `
                        <div class="flex flex-col items-center min-w-[60px]">
                            <span class="text-[10px] sm:text-xs text-gray-400 mb-1 font-medium whitespace-nowrap">${stop.name}</span>
                            <div class="flex items-center w-full justify-center relative">
                                <!-- Connector line -->
                                ${!isFirst ? `<div class="absolute right-[50%] top-1/2 -translate-y-1/2 w-full h-[2px] bg-gradient-to-r from-gray-700 to-[#2dd4bf]/40"></div>` : ''}
                                <!-- Stop Dot -->
                                <div class="w-2.5 h-2.5 rounded-full z-10 ${isFirst || isLast ? 'bg-[#2dd4bf] ring-2 ring-[#0f172a]' : 'bg-gray-400 ring-2 ring-[#0f172a]'}"></div>
                            </div>
                            <span class="text-xs ${isFirst ? 'text-[#2dd4bf]' : 'text-gray-300'} mt-1 font-semibold">${stop.time}</span>
                        </div>
                    `;
                });

                const cardHtml = `
                    <div class="bg-[#1e293b] rounded-2xl p-5 shadow-lg border border-white/5 fade-in hover:border-white/10 transition-colors" style="animation-delay: ${index * 0.05}s">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <div class="flex items-baseline space-x-3">
                                    <h2 class="text-3xl sm:text-4xl font-bold text-[#2dd4bf] tracking-tight">${dep.departureTime}</h2>
                                    <span class="text-lg text-white font-medium">to ${dep.destination}</span>
                                </div>
                                <div class="mt-1 flex items-center space-x-2">
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded bg-gray-800 text-gray-400 tracking-wider uppercase">${dep.operator}</span>
                                    <span class="text-sm text-gray-400">Next stop: <span class="text-gray-200">${dep.nextStop}</span></span>
                                </div>
                            </div>
                            <div class="flex flex-col items-end">
                                <div class="px-3 py-1.5 rounded-lg border text-sm font-bold shadow-sm ${countdownColorClass}">
                                    ${countdownDisplay}
                                </div>
                                <div class="text-xs text-gray-500 mt-2 font-medium">
                                    ETA ${dep.destination}: <span class="text-gray-300">${dep.etaDestination}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Elegant Route Itinerary -->
                        <div class="mt-6 pt-4 border-t border-white/5">
                            <div class="flex justify-between items-center w-full overflow-x-auto pb-2 hide-scrollbar">
                                ${itineraryHtml}
                            </div>
                        </div>
                    </div>
                `;
                scheduleContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // Style helper for the hidden scrollbar in the itinerary timeline
        const style = document.createElement('style');
        style.textContent = `
            .hide-scrollbar::-webkit-scrollbar { display: none; }
            .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        `;
        document.head.appendChild(style);

        // Start App
        window.onload = init;
    </script>
</body>
</html>
