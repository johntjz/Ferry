<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HK Ferry Live Schedule</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --red: #ef4444;
            --yellow: #f59e0b;
            --green: #10b981;
            --border: #334155;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .status-badge {
            font-size: 11px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .holiday-banner {
            background: rgba(239, 68, 68, 0.15);
            border-left: 4px solid var(--red);
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
            line-height: 1.4;
        }

        .select-group {
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 14px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            appearance: none;
            outline: none;
        }
        
        select:focus {
            border-color: var(--accent);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .time-large {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .countdown {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .destination {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .itinerary {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        .load-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .load-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .people-icons {
            display: flex;
            gap: 2px;
        }

        .person-icon {
            width: 12px;
            height: 12px;
            fill: var(--border);
        }

        .person-icon.active-green { fill: var(--green); }
        .person-icon.active-yellow { fill: var(--yellow); }
        .person-icon.active-red { fill: var(--red); }

        .operator-badge {
            font-size: 11px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            background: var(--card-bg);
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="status-badge">● LIVE CLIENT ENGINE</div>
        <div id="clock" style="font-size: 14px; color: var(--text-muted); font-variant-numeric: tabular-nums;">--:--:--</div>
    </div>

    <div class="holiday-banner" id="holidayBanner">
        <strong>Holiday / Sunday Rates Apply</strong><br>
        Fares are subject to statutory holiday surcharges today.
    </div>

    <div class="select-group">
        <select id="routeSelect"></select>
        <select id="directionSelect"></select>
    </div>

    <div id="resultsContainer"></div>
</div>

<script>
/**
 * LOCAL DATA STORE (Zero Vercel CDN Database Queries)
 * Add the rest of your 120+ routes into this array structure.
 */
const routesData = [
    {
        name: "Inter-Islands (Peng Chau - Mui Wo - Chi Ma Wan - Cheung Chau)",
        operator: "Sun Ferry",
        directions: {
            "Depart from Mui Wo": [
                { time: "06:00", itinerary: ["Mui Wo", "Cheung Chau"] },
                { time: "10:10", itinerary: ["Mui Wo", "Chi Ma Wan", "Cheung Chau"] },
                { time: "12:15", itinerary: ["Mui Wo", "Cheung Chau"] }, // Skipped Chi Ma Wan
                { time: "23:05", itinerary: ["Mui Wo", "Chi Ma Wan", "Cheung Chau"] }
            ],
            "Depart from Peng Chau": [
                { time: "11:55", itinerary: ["Peng Chau", "Mui Wo", "Cheung Chau"] }, // Skipped
                { time: "17:55", itinerary: ["Peng Chau", "Mui Wo", "Cheung Chau"] }, // Skipped
                { time: "21:50", itinerary: ["Peng Chau", "Mui Wo", "Cheung Chau"] }  // Skipped
            ],
            "Depart from Cheung Chau": [
                { time: "12:45", itinerary: ["Cheung Chau", "Mui Wo", "Peng Chau"] }, // Skipped
                { time: "21:00", itinerary: ["Cheung Chau", "Mui Wo", "Peng Chau"] }  // Skipped
            ]
        }
    },
    {
        name: "Central - Cheung Chau",
        operator: "Sun Ferry",
        directions: {
            "Central to Cheung Chau": [
                { time: "00:30", itinerary: ["Central", "Cheung Chau"] },
                { time: "01:30", itinerary: ["Central", "Cheung Chau"] },
                { time: "07:00", itinerary: ["Central", "Cheung Chau"] },
                { time: "08:00", itinerary: ["Central", "Cheung Chau"] }
            ],
            "Cheung Chau to Central": [
                { time: "02:20", itinerary: ["Cheung Chau", "Central"] },
                { time: "06:20", itinerary: ["Cheung Chau", "Central"] },
                { time: "07:20", itinerary: ["Cheung Chau", "Central"] }
            ]
        }
    },
    {
        name: "Central - Discovery Bay",
        operator: "HKR International",
        directions: {
            "Central to Discovery Bay": [
                { time: "00:30", itinerary: ["Central", "Discovery Bay"] },
                { time: "07:30", itinerary: ["Central", "Discovery Bay"] }
            ]
        }
    }
];

// --- CORE LOGIC ---

function checkHoliday() {
    const today = new Date();
    const isSunday = today.getDay() === 0;
    
    // 2026/2027 HK Statutory Holidays (MM-DD)
    const holidays = [
        "1-1", "2-17", "2-18", "2-19", "4-3", "4-4", "4-6", "4-7", 
        "5-1", "5-24", "6-19", "7-1", "9-26", "10-1", "12-25", "12-26"
    ]; 
    
    const dateString = `${today.getMonth()+1}-${today.getDate()}`;
    
    if (isSunday || holidays.includes(dateString)) {
        document.getElementById('holidayBanner').style.display = 'block';
        return true;
    }
    return false;
}

const isHolidayToday = checkHoliday();

// Deterministic Load Heuristic Engine (Calculates 1 to 10 scale)
function getLoadFactor(timeStr, isHoliday) {
    const [hours, minutes] = timeStr.split(':').map(Number);
    let load = 2; // Baseline

    if (isHoliday) {
        if (hours >= 9 && hours <= 11) load += 6; // Morning rush to islands
        if (hours >= 16 && hours <= 19) load += 7; // Evening return
        if (hours >= 12 && hours <= 15) load += 4; 
    } else {
        if (hours >= 7 && hours <= 9) load += 7;  // Commuter AM
        if (hours >= 17 && hours <= 19) load += 6; // Commuter PM
    }

    // Pseudo-random but stable variance based on the minute digits
    load += (minutes % 3); 
    
    // Cap between 1 and 10
    return Math.max(1, Math.min(10, load));
}

function renderLoadIcons(loadScore) {
    let icons = '';
    const colorClass = loadScore >= 8 ? 'active-red' : (loadScore >= 5 ? 'active-yellow' : 'active-green');
    
    const svgPath = "M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z";
    
    for (let i = 1; i <= 10; i++) {
        const active = i <= loadScore ? colorClass : '';
        icons += `<svg class="person-icon ${active}" viewBox="0 0 24 24"><path d="${svgPath}"/></svg>`;
    }
    return icons;
}

// Main Render Loop (Runs entirely in client memory)
function updateUI() {
    const now = new Date();
    
    // Update live clock
    document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB'); // 24hr format
    
    const routeIndex = document.getElementById('routeSelect').value;
    const direction = document.getElementById('directionSelect').value;
    if(!routeIndex || !direction) return;

    const route = routesData[routeIndex];
    const schedule = route.directions[direction];
    
    if (!schedule || schedule.length === 0) {
        document.getElementById('resultsContainer').innerHTML = '<div class="no-results">No departures found for this route.</div>';
        return;
    }

    let html = '';
    let upcomingCount = 0;

    schedule.forEach(ferry => {
        const [hh, mm] = ferry.time.split(':');
        const ferryTime = new Date(now);
        ferryTime.setHours(hh, mm, 0, 0);
        
        // Handle midnight crossover (if ferry is between 00:00 - 03:00 and it's currently late night)
        if (ferryTime < now && now.getHours() > 3) {
            ferryTime.setDate(ferryTime.getDate() + 1);
        }

        const diffMs = ferryTime - now;
        
        // Hide ferries that departed more than 5 minutes ago (unless they are next day)
        if (diffMs < -300000 && ferryTime.getDate() === now.getDate()) return;

        upcomingCount++;
        
        // Cap UI at showing the next 15 sailings
        if (upcomingCount > 15) return;

        const isDeparted = diffMs < 0;
        const diffMins = Math.abs(Math.floor(diffMs / 60000));
        const hoursLeft = Math.floor(diffMins / 60);
        const minsLeft = diffMins % 60;
        
        let countdownStr = hoursLeft > 0 ? `${hoursLeft}h ${minsLeft}m` : `${minsLeft}m`;
        if (isDeparted) countdownStr = "Departed";

        const loadScore = getLoadFactor(ferry.time, isHolidayToday);
        const destination = ferry.itinerary[ferry.itinerary.length - 1];

        html += `
            <div class="card" style="${isDeparted ? 'opacity: 0.6;' : ''}">
                <div class="card-header">
                    <span class="time-large">${ferry.time}</span>
                    <span class="countdown" style="${isDeparted ? 'background: rgba(255,255,255,0.1); color: var(--text-muted);' : ''}">${countdownStr}</span>
                </div>
                
                <div class="destination">
                    <span style="color: var(--text-muted); font-size: 13px;">Heading towards</span> 
                    <strong>${destination}</strong>
                </div>
                
                <div class="itinerary">
                    ${ferry.itinerary.join(' ➔ ')}
                </div>
                
                <div class="footer-row">
                    <div class="load-indicator">
                        <span class="load-label">Est. Load</span>
                        <div class="people-icons">${renderLoadIcons(loadScore)}</div>
                    </div>
                    <span class="operator-badge">${route.operator}</span>
                </div>
            </div>
        `;
    });

    if (html === '') {
        html = '<div class="no-results">No more sailings today.</div>';
    }

    document.getElementById('resultsContainer').innerHTML = html;
}

// Initialization and Event Listeners
function init() {
    const routeSel = document.getElementById('routeSelect');
    const dirSel = document.getElementById('directionSelect');
    
    // Populate Routes
    routesData.forEach((r, i) => {
        routeSel.add(new Option(r.name, i));
    });

    // Handle Route Change
    routeSel.addEventListener('change', () => {
        dirSel.innerHTML = '';
        const selectedRoute = routesData[routeSel.value];
        Object.keys(selectedRoute.directions).forEach(dir => {
            dirSel.add(new Option(dir, dir));
        });
        updateUI();
    });

    // Handle Direction Change
    dirSel.addEventListener('change', updateUI);
    
    // Bootstrap first load
    routeSel.dispatchEvent(new Event('change'));
    
    // Start local interval clock (Updates UI every 15 seconds locally, 0 server requests)
    setInterval(updateUI, 15000); 
}

// Start Application
init();
</script>
</body>
</html>
