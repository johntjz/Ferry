                        <select id="stationSelect" class="w-full bg-slate-800/80 border border-slate-700 text-white text-sm rounded-xl py-3 px-4 appearance-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition cursor-pointer">
                            <!-- Populated dynamically -->

            </div>

            <!-- Status Bar -->

                <i id="statusIcon" class="ph text-lg mr-2"></i>
                <span id="statusText"></span>
            </div>
        </section>

        <!-- Real-Time Countdown Display Panels -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Outbound Direction Panel -->
            <div class="glass-panel rounded-2xl p-5 border-t-4 border-t-blue-500 flex flex-col min-h-[380px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2 text-white">
                        <i class="ph ph-arrow-circle-right text-blue-400 text-xl"></i>
                        Outbound Departures
                    </h2>
                    <span class="text-xs font-medium bg-blue-500/20 text-blue-300 py-1 px-2.5 rounded-md" id="upDestLabel">--</span>
                </div>
                <div id="upTrains" class="space-y-3 flex-1 overflow-y-auto max-h-[380px] pr-1">
                    <div class="h-full flex items-center justify-center text-slate-500 text-sm"><i class="ph ph-spinner animate-spin text-2xl"></i></div>
                </div>
            </div>

            <!-- Inbound Direction Panel -->
            <div class="glass-panel rounded-2xl p-5 border-t-4 border-t-purple-500 flex flex-col min-h-[380px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2 text-white">
                        <i class="ph ph-arrow-circle-left text-purple-400 text-xl"></i>
                        Inbound Departures
                    </h2>
                    <span class="text-xs font-medium bg-purple-500/20 text-purple-300 py-1 px-2.5 rounded-md" id="downDestLabel">--</span>
                </div>
                <div id="downTrains" class="space-y-3 flex-1 overflow-y-auto max-h-[380px] pr-1">
                     <div class="h-full flex items-center justify-center text-slate-500 text-sm"><i class="ph ph-spinner animate-spin text-2xl"></i></div>
                </div>
            </div>

        </section>
        
        <footer class="text-center py-4">
            <p class="text-xs text-slate-500">
                Data integration modeling Sun Ferry ETA API, Fortune Ferry Timetables, and Marine Department Cross Boundary schedules.
            </p>
        </footer>

    </main>

**Best Ways to Estimate Load Factor**
*   **Vessel Capacity Mapping:** Extract the `vesselcode` (e.g., "CHAO" or "FF8") provided in the Sun Ferry ETA API and map it against a static database of the operator's fleet to determine the maximum passenger capacity for that specific trip.
*   **Time-Series Heuristics:** Build a model based on the day of the week, time of day, public holidays, and weather. Commuter routes (e.g., Central to Mui Wo) predictably hit 85–100% capacity during peak rush hours (7:30 AM–9:00 AM and 5:30 PM–7:00 PM) but drop significantly mid-day. 
*   **Historical Baselines:** Utilize the Hong Kong Transport Department’s publicly available monthly traffic and transport digests to establish baseline ridership averages for specific ferry routes and distribute them across the daily timetable.

**Is it Useful to Add?**
Yes, it is highly useful for end-users, but only if framed correctly. Knowing the load factor helps commuters decide whether they need to rush to the pier or wait for the next vessel, which is particularly valuable for routes where fast ferries frequently sell out. 

However, because you are estimating rather than fetching live ticket sales or turnstile data, displaying a precise percentage (e.g., "73% full") will likely lead to user frustration when the model is wrong. If you implement this feature, it is best to abstract the numerical estimate into qualitative indicators like **"Usually Quiet,"** **"Moderate,"** or **"Usually Busy"** to manage expectations while still providing actionable context.
