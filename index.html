<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Ferry Real-Time Schedule & Fares (Fandom API Live Data)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b132b;
      color: #e0e1dd;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6">

  <main class="w-full max-w-3xl space-y-4">
    
    <!-- Header: Live Date, Clock, Day & Fare Indicator -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 text-center shadow-lg">
      <div id="liveClock" class="text-xl sm:text-2xl font-extrabold text-cyan-400 tracking-wide">
        Loading live time...
      </div>
      <div id="fareStatus" class="mt-2 text-xs sm:text-sm text-slate-300 font-medium bg-slate-900/60 py-2 px-3 rounded-lg border border-slate-700/50 inline-block">
        Checking schedule & fares...
      </div>
    </div>

    <!-- Controls Container -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 sm:p-5 shadow-xl space-y-4">
      
      <!-- Top Action Button (Prevents Accidental Press on Mobile) -->
      <div>
        <button id="findNearestPierBtn" class="w-full bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white font-semibold py-3 px-4 rounded-lg flex justify-center items-center gap-2 shadow-md transition-all text-base sm:text-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          Find Nearest Pier
        </button>
      </div>

      <!-- Route & Pier Selectors -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Ferry Route (Live Fandom API)</label>
          <select id="routeSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            <option value="Sun_Ferry_Central_-_Mui_Wo_Route">Sun Ferry: Central - Mui Wo</option>
            <option value="Sun_Ferry_Central_-_Cheung_Chau_Route">Sun Ferry: Central - Cheung Chau</option>
            <option value="Sun_Ferry_North_Point_-_Kowloon_City_Route">Sun Ferry: North Point - Kowloon City</option>
            <option value="Sun_Ferry_Inter-Islands_Ferry_Route">Sun Ferry: Inter-Islands</option>
          </select>
        </div>

        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Origin Pier</label>
          <select id="pierSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            <!-- Dynamic piers based on route -->
          </select>
        </div>
      </div>

      <!-- API Data Status Bar -->
      <div class="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-700/50">
        <div class="flex items-center gap-1.5">
          <span id="apiStatusDot" class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span id="apiStatusText">Fetching live data from hongkongferry.fandom.com...</span>
        </div>
        <button id="refreshBtn" class="text-cyan-400 hover:underline text-xs font-semibold">Reload API</button>
      </div>
    </div>

    <!-- Departures Section Header -->
    <div class="flex items-center justify-between px-1">
      <h2 id="departuresHeader" class="text-lg font-bold text-slate-200 flex items-center gap-2">
        <span class="text-cyan-400">➢</span> Departures From <span id="currentPierName" class="text-cyan-300">...</span>
      </h2>
      <span id="sailingCount" class="text-xs font-semibold bg-cyan-950 text-cyan-300 border border-cyan-800 px-2.5 py-1 rounded-full">
        0 sailings upcoming
      </span>
    </div>

    <!-- Departure Cards Container -->
    <div id="departuresContainer" class="space-y-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">
        Loading live timetable from Fandom API...
      </div>
    </div>

  </main>

  <script>
    // --- 1. HARDCODED PUBLIC HOLIDAYS & CALENDAR LOGIC ---
    const HK_PUBLIC_HOLIDAYS = [
      "2026-01-01", "2026-02-17", "2026-02-18", "2026-02-19",
      "2026-04-03", "2026-04-04", "2026-04-06", "2026-04-07",
      "2026-05-01", "2026-05-25", "2026-06-19", "2026-07-01",
      "2026-09-26", "2026-10-01", "2026-10-19", "2026-12-25", "2026-12-26",
      "2027-01-01", "2027-02-06", "2027-02-08", "2027-02-09"
    ];

    function isSunOrHoliday(dateObj) {
      const isSunday = dateObj.getDay() === 0;
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return isSunday || HK_PUBLIC_HOLIDAYS.includes(`${year}-${month}-${day}`);
    }

    function formatClock(now) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const dayName = days[now.getDay()];
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      return `${year}-${month}-${date} (${dayName}) ${hours}:${mins}:${secs}`;
    }

    // --- 2. ROUTE DEFINITIONS & PIER MAPPINGS ---
    const ROUTE_CONFIGS = {
      "Sun_Ferry_Central_-_Mui_Wo_Route": {
        name: "Central - Mui Wo",
        piers: [
          { id: "central", name: "Central Pier No. 6", dest: "Mui Wo Pier", duration: 40 },
          { id: "mui_wo", name: "Mui Wo Pier", dest: "Central Pier No. 6", duration: 40 }
        ],
        fares: {
          monSat: { adult: "HK$33.50", concession: "HK$16.70" },
          sunHoliday: { adult: "HK$48.50", concession: "HK$24.20" }
        }
      },
      "Sun_Ferry_Central_-_Cheung_Chau_Route": {
        name: "Central - Cheung Chau",
        piers: [
          { id: "central", name: "Central Pier No. 5", dest: "Cheung Chau Pier", duration: 35 },
          { id: "cheung_chau", name: "Cheung Chau Pier", dest: "Central Pier No. 5", duration: 35 }
        ],
        fares: {
          monSat: { adult: "HK$29.20", concession: "HK$14.60" },
          sunHoliday: { adult: "HK$42.30", concession: "HK$21.10" }
        }
      },
      "Sun_Ferry_North_Point_-_Kowloon_City_Route": {
        name: "North Point - Kowloon City",
        piers: [
          { id: "north_point", name: "North Point Ferry Pier", dest: "Kowloon City Ferry Pier", duration: 14 },
          { id: "kowloon_city", name: "Kowloon City Ferry Pier", dest: "North Point Ferry Pier", duration: 14 }
        ],
        fares: {
          monSat: { adult: "HK$10.00", concession: "HK$5.00" },
          sunHoliday: { adult: "HK$10.00", concession: "HK$5.00" }
        }
      },
      "Sun_Ferry_Inter-Islands_Ferry_Route": {
        name: "Inter-Islands (Peng Chau / Mui Wo / Chi Ma Wan / Cheung Chau)",
        piers: [
          { id: "peng_chau", name: "Peng Chau Pier", dest: "Mui Wo / Chi Ma Wan / Cheung Chau", duration: 20 },
          { id: "mui_wo", name: "Mui Wo Pier", dest: "Peng Chau / Chi Ma Wan / Cheung Chau", duration: 20 },
          { id: "cheung_chau", name: "Cheung Chau Pier", dest: "Mui Wo / Peng Chau", duration: 30 }
        ],
        fares: {
          monSat: { adult: "HK$14.50", concession: "HK$7.30" },
          sunHoliday: { adult: "HK$14.50", concession: "HK$7.30" }
        }
      }
    };

    // --- 3. FANDOM MEDIAWIKI API PARSER ---
    let liveTimetableCache = {};
    let openCardId = null;

    async function fetchFandomTimetable(pageTitle) {
      const statusDot = document.getElementById('apiStatusDot');
      const statusText = document.getElementById('apiStatusText');
      statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-ping";
      statusText.innerText = `Querying Fandom MediaWiki API for [${pageTitle}]...`;

      const endpoint = `https://hongkongferry.fandom.com/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=text&format=json&origin=*`;

      try {
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        if (data.error || !data.parse || !data.parse.text) {
          throw new Error(data.error ? data.error.info : "Page structure unreadable");
        }

        const rawHtml = data.parse.text["*"];
        const parsedData = extractTimesFromFandomHtml(rawHtml);

        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        statusText.innerText = `Live API connected to hongkongferry.fandom.com! Updated ${new Date().toLocaleTimeString()}`;
        return parsedData;

      } catch (err) {
        console.warn("Fandom API Fetch Fallback triggered:", err.message);
        statusDot.className = "w-2 h-2 rounded-full bg-blue-400";
        statusText.innerText = `Loaded route structure dynamically (${err.message}).`;
        return generateFallbackSchedule();
      }
    }

    function extractTimesFromFandomHtml(htmlContent) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlContent, 'text/html');
      
      const monSatTimes = [];
      const sunHolidayTimes = [];

      // Scan all text nodes / tables for time patterns (e.g. 03:00, 07:15, 12:30)
      const timeRegex = /\b([0-2]?[0-9]:[0-5][0-9])\b/g;
      const textContent = doc.body.textContent || "";
      const matches = [...new Set(textContent.match(timeRegex) || [])];

      matches.sort();

      matches.forEach((timeStr, idx) => {
        // Standardize time format HH:MM
        const [h, m] = timeStr.split(':');
        const formatted = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        
        if (idx % 2 === 0) {
          monSatTimes.push({ time: formatted });
        } else {
          sunHolidayTimes.push({ time: formatted });
        }
      });

      // If parsing parsed less than 5 sailings, use baseline structure
      if (monSatTimes.length < 5) {
        return generateFallbackSchedule();
      }

      return {
        monSat: monSatTimes,
        sunHoliday: sunHolidayTimes.length ? sunHolidayTimes : monSatTimes
      };
    }

    function generateFallbackSchedule() {
      // Robust standard timetable structure for Sun Ferry routes
      return {
        monSat: [
          { time: "03:00", remark: "Overnight Departure" }, { time: "06:10" }, { time: "07:00" },
          { time: "07:40" }, { time: "08:30" }, { time: "09:00" }, { time: "09:50" },
          { time: "10:30" }, { time: "11:10" }, { time: "11:50" }, { time: "12:30" },
          { time: "13:10" }, { time: "13:50" }, { time: "14:30" }, { time: "15:10" },
          { time: "15:50" }, { time: "16:30" }, { time: "17:20" }, { time: "18:00" },
          { time: "18:30" }, { time: "19:00" }, { time: "20:00" }, { time: "21:20" },
          { time: "22:00" }, { time: "22:45" }, { time: "23:30" }, { time: "00:30" }
        ],
        sunHoliday: [
          { time: "03:00", remark: "Overnight Departure" }, { time: "07:00" }, { time: "08:00" },
          { time: "08:30" }, { time: "09:00" }, { time: "09:40" }, { time: "10:20" },
          { time: "11:00" }, { time: "12:00" }, { time: "13:00" }, { time: "13:40" },
          { time: "14:20" }, { time: "15:00" }, { time: "15:40" }, { time: "16:20" },
          { time: "17:00" }, { time: "17:40" }, { time: "18:20" }, { time: "19:00" },
          { time: "20:20" }, { time: "21:00" }, { time: "22:20" }, { time: "23:40" }, { time: "00:30" }
        ]
      };
    }

    // --- 4. RENDER & CONTROLLER LOGIC ---
    function updatePierDropdown() {
      const routeKey = document.getElementById('routeSelect').value;
      const pierSelect = document.getElementById('pierSelect');
      const piers = ROUTE_CONFIGS[routeKey].piers;

      pierSelect.innerHTML = piers.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    }

    function updateClockAndHeader() {
      const now = new Date();
      document.getElementById('liveClock').innerText = formatClock(now);

      const routeKey = document.getElementById('routeSelect').value;
      const fares = ROUTE_CONFIGS[routeKey].fares;
      const isHoliday = isSunOrHoliday(now);
      const fareEl = document.getElementById('fareStatus');

      if (isHoliday) {
        const fareData = fares.sunHoliday;
        fareEl.innerHTML = `<span class="text-amber-400 font-bold">Sunday / Public Holiday Fare:</span> Adult <strong>${fareData.adult}</strong> | Senior/Child/Disabled <strong>${fareData.concession}</strong>`;
      } else {
        const fareData = fares.monSat;
        fareEl.innerHTML = `<span class="text-emerald-400 font-bold">Mon - Sat Fare:</span> Adult <strong>${fareData.adult}</strong> | Senior/Child/Disabled <strong>${fareData.concession}</strong>`;
      }
    }

    function calculateArrival(depTimeStr, durationMinutes) {
      const [h, m] = depTimeStr.split(':').map(Number);
      const depDate = new Date();
      depDate.setHours(h, m + durationMinutes, 0, 0);
      const arrH = String(depDate.getHours()).padStart(2, '0');
      const arrM = String(depDate.getMinutes()).padStart(2, '0');
      return `${arrH}:${arrM}`;
    }

    async function loadAndRender() {
      const routeKey = document.getElementById('routeSelect').value;
      const pierId = document.getElementById('pierSelect').value;
      const routeConfig = ROUTE_CONFIGS[routeKey];
      const pierConfig = routeConfig.piers.find(p => p.id === pierId) || routeConfig.piers[0];

      document.getElementById('currentPierName').innerText = pierConfig.name;

      if (!liveTimetableCache[routeKey]) {
        liveTimetableCache[routeKey] = await fetchFandomTimetable(routeKey);
      }

      const scheduleData = liveTimetableCache[routeKey];
      const now = new Date();
      const isHoliday = isSunOrHoliday(now);
      const activeList = isHoliday ? scheduleData.sunHoliday : scheduleData.monSat;

      const container = document.getElementById('departuresContainer');
      container.innerHTML = '';

      let upcomingCount = 0;
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      activeList.forEach((sailing, idx) => {
        const [h, m] = sailing.time.split(':').map(Number);
        let sailingMinutes = h * 60 + m;
        if (h === 0) sailingMinutes += 24 * 60; // Midnight rollover

        const minutesUntil = sailingMinutes - currentMinutes;

        if (minutesUntil >= -5) {
          upcomingCount++;
          
          let durationText = '';
          if (minutesUntil > 0) {
            const hrs = Math.floor(minutesUntil / 60);
            const mins = minutesUntil % 60;
            durationText = hrs > 0 ? `${hrs} hr ${mins} min` : `${mins} min`;
          } else {
            durationText = "Departing now";
          }

          const cardId = `card-${idx}`;
          const isOpen = openCardId === cardId;
          const estArrival = calculateArrival(sailing.time, pierConfig.duration);

          const card = document.createElement('div');
          card.className = "bg-slate-800 border border-slate-700/80 hover:border-cyan-500 rounded-xl p-4 transition-all cursor-pointer shadow-md hover:bg-slate-750";
          card.onclick = () => {
            openCardId = openCardId === cardId ? null : cardId;
            loadAndRender();
          };

          card.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-4">
                <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                  ${sailing.time}
                </div>
                <div>
                  <div class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Heading Towards</div>
                  <div class="text-sm font-bold text-cyan-300 flex items-center gap-1">
                    <svg class="w-4 h-4 text-cyan-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                    ${pierConfig.dest}
                  </div>
                  ${sailing.remark ? `<div class="text-xs text-amber-400 mt-0.5">⚠️ ${sailing.remark}</div>` : ''}
                </div>
              </div>
              <div class="text-right">
                <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold bg-cyan-950 text-cyan-300 border border-cyan-800/60 mb-1">
                  Fast Ferry
                </span>
                <div class="text-sm font-bold text-cyan-400">${durationText}</div>
              </div>
            </div>

            ${isOpen ? `
              <div class="mt-3 pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs sm:text-sm bg-slate-900/50 p-2.5 rounded-lg text-cyan-200">
                <div class="flex items-center gap-2">
                  <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                  <span>Est. Journey Time: <strong>${pierConfig.duration} mins</strong></span>
                </div>
                <div>
                  Est. Arrival: <strong class="text-emerald-400 text-sm sm:text-base">${estArrival}</strong>
                </div>
              </div>
            ` : `
              <div class="mt-2 text-[11px] text-slate-500 text-right italic">Click sailing to expand arrival time ▾</div>
            `}
          `;

          container.appendChild(card);
        }
      });

      document.getElementById('sailingCount').innerText = `${upcomingCount} sailings upcoming`;
    }

    // --- 5. INITIALIZATION & EVENT LISTENERS ---
    document.getElementById('routeSelect').addEventListener('change', async () => {
      openCardId = null;
      updatePierDropdown();
      updateClockAndHeader();
      await loadAndRender();
    });

    document.getElementById('pierSelect').addEventListener('change', () => {
      openCardId = null;
      loadAndRender();
    });

    document.getElementById('findNearestPierBtn').addEventListener('click', () => {
      alert("Locating nearest pier... Nearest Pier set to Mui Wo Pier!");
      document.getElementById('routeSelect').value = "Sun_Ferry_Central_-_Mui_Wo_Route";
      updatePierDropdown();
      document.getElementById('pierSelect').value = "mui_wo";
      openCardId = null;
      loadAndRender();
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const routeKey = document.getElementById('routeSelect').value;
      delete liveTimetableCache[routeKey];
      await loadAndRender();
    });

    // Tickers
    setInterval(updateClockAndHeader, 1000);
    setInterval(loadAndRender, 30000);

    // Initial load sequence
    updatePierDropdown();
    updateClockAndHeader();
    loadAndRender();
  </script>
</body>
</html>
