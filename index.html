<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Ferry Live Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b132b;
      color: #e0e1dd;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6">

  <main class="w-full max-w-3xl space-y-4">
    
    <!-- Clock & Status Header -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 text-center shadow-lg relative overflow-hidden">
      <div id="liveClock" class="text-xl sm:text-2xl font-extrabold text-cyan-400 tracking-wide">
        Loading clock...
      </div>
      
      <div class="mt-2 flex flex-wrap items-center justify-center gap-2">
        <div id="fareStatus" class="text-xs sm:text-sm text-slate-300 font-medium bg-slate-900/60 py-1.5 px-3 rounded-lg border border-slate-700/50 inline-block">
          Initializing Fandom Live API...
        </div>
        <div id="operatorBadgeHeader" class="hidden text-xs font-semibold bg-cyan-950 text-cyan-300 border border-cyan-800/80 py-1.5 px-3 rounded-lg inline-flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
          <span id="operatorHeaderName">Operator</span>
        </div>
      </div>
    </div>

    <!-- Controls Container -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 sm:p-5 shadow-xl space-y-4">
      
      <!-- Route & Pier Selectors -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Select Ferry Route</label>
          <select id="routeSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none text-sm font-medium">
            <option>Fetching routes...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Departure Pier / Station</label>
          <select id="pierSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none text-sm font-medium">
            <!-- Populated dynamically based on 2-stop or multi-stop inter-island piers -->
          </select>
        </div>
      </div>

      <!-- API Data Status Bar -->
      <div class="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-700/50">
        <div class="flex items-center gap-2">
          <span id="apiStatusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span id="apiStatusText">Querying wiki database...</span>
        </div>
        <button id="refreshBtn" class="text-cyan-400 hover:underline text-xs font-semibold flex items-center gap-1">
          <svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Refresh Timetable
        </button>
      </div>
    </div>

    <!-- Departures Section Header -->
    <div class="flex items-center justify-between px-1">
      <h2 id="departuresHeader" class="text-lg font-bold text-slate-200 flex items-center gap-2">
        <span class="text-cyan-400">➢</span> Departures from <span id="currentPierName" class="text-cyan-300">...</span>
      </h2>
      <span id="sailingCount" class="text-xs font-semibold bg-cyan-950 text-cyan-300 border border-cyan-800 px-2.5 py-1 rounded-full">
        0 sailings upcoming
      </span>
    </div>

    <!-- Departure Cards Container -->
    <div id="departuresContainer" class="space-y-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">
        Fetching live schedule...
      </div>
    </div>

  </main>

  <script>
    let liveTimetableCache = {};
    let openCardId = null;

    const HK_HOLIDAYS = [
      "2026-01-01", "2026-02-17", "2026-02-18", "2026-02-19",
      "2026-04-03", "2026-04-04", "2026-04-06", "2026-04-07",
      "2026-05-01", "2026-05-25", "2026-06-19", "2026-07-01",
      "2026-10-01", "2026-12-25", "2026-12-26"
    ];

    function isHolidayOrSunday(d) {
      const isSun = d.getDay() === 0;
      const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return isSun || HK_HOLIDAYS.includes(dateStr);
    }

    function formatClock(d) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} (${days[d.getDay()]}) ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
    }

    // List of known ferry operators in Hong Kong
    const KNOWN_OPERATORS = [
      { keys: ["sun ferry", "first ferry"], name: "Sun Ferry" },
      { keys: ["star ferry"], name: "Star Ferry" },
      { keys: ["hkkf", "hong kong & kowloon ferry"], name: "HKKF" },
      { keys: ["tsui wah"], name: "Tsui Wah Ferry" },
      { keys: ["fortune ferry"], name: "Fortune Ferry" },
      { keys: ["coral sea"], name: "Coral Sea Ferry" },
      { keys: ["chuen kee"], name: "Chuen Kee Ferry" },
      { keys: ["pitcl", "park island"], name: "Park Island Transport" },
      { keys: ["dbtpl", "discovery bay"], name: "Discovery Bay Transportation" }
    ];

    // Strips company/operator prefix to leave only clean route names for dropdown labels
    function parseRouteDetails(rawTitle) {
      let company = "Ferry Operator";
      const lower = rawTitle.toLowerCase();

      for (const op of KNOWN_OPERATORS) {
        if (op.keys.some(k => lower.includes(k))) {
          company = op.name;
          break;
        }
      }

      // Remove operator names, "Ferry Route", "Route", "Ferry", "Service", etc.
      let cleanTitle = rawTitle
        .replace(/Sun Ferry|First Ferry|Star Ferry|HKKF|Hong Kong & Kowloon Ferry|Hong Kong Ferry|Tsui Wah Ferry|Tsui Wah|Fortune Ferry|Coral Sea Ferry|Coral Sea|Chuen Kee Ferry|Chuen Kee|Park Island Transport|PITCL|Discovery Bay Transportation|DBTPL/gi, '')
        .replace(/Ferry Route/gi, '')
        .replace(/Route/gi, '')
        .replace(/Ferry/gi, '')
        .replace(/Service/gi, '')
        .replace(/^[\s\-\:\–]+|[\s\-\:\–]+$/g, '')
        .trim();

      if (!cleanTitle) cleanTitle = rawTitle;

      return {
        rawTitle,
        cleanTitle,
        company
      };
    }

    function cleanRouteKey(title) {
      return title
        .toLowerCase()
        .replace(/service/g, '')
        .replace(/ferry/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    // Helper: Parses HH:MM string from cell; strictly returns null if '/' or empty
    function parseCellTime(cellStr) {
      if (!cellStr) return null;
      const clean = cellStr.trim();
      if (clean === '/' || clean === '-' || clean === '—') return null;
      const match = clean.match(/([0-2]?[0-9]:[0-5][0-9])/);
      return match ? match[1].padStart(5, '0') : null;
    }

    // Helper: Adds minutes to HH:MM time string with midnight wrap-around
    function addMinutesToTime(timeStr, minsToAdd) {
      if (!timeStr || !/^\d{1,2}:\d{2}$/.test(timeStr)) return "";
      const [h, m] = timeStr.split(':').map(Number);
      const totalMins = (h * 60 + m + Math.round(minsToAdd)) % (24 * 60);
      const newH = Math.floor(totalMins / 60);
      const newM = totalMins % 60;
      return `${String(newH).padStart(2, '0')}:${String(newM).padStart(2, '0')}`;
    }

    // Helper: Computes time difference in minutes between two HH:MM strings
    function getTimeDiffMinutes(startTimeStr, endTimeStr) {
      if (!startTimeStr || !endTimeStr) return 0;
      const [h1, m1] = startTimeStr.split(':').map(Number);
      const [h2, m2] = endTimeStr.split(':').map(Number);
      let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
      if (diff < 0) diff += 24 * 60;
      return diff;
    }

    // Standard journey duration fallback lookup
    function getStandardRouteDuration(routeTitle, pier1, pier2) {
      const combined = `${routeTitle || ''} ${pier1 || ''} ${pier2 || ''}`.toLowerCase();

      if (combined.includes('cheung chau')) return 35;
      if (combined.includes('mui wo')) return 35;
      if (combined.includes('peng chau')) return 30;
      if (combined.includes('yung shue wan')) return 27;
      if (combined.includes('sok kwu wan')) return 35;
      if (combined.includes('discovery bay')) return 25;
      if (combined.includes('park island') || combined.includes('ma wan')) return 22;
      if (combined.includes('tsim sha tsui') || combined.includes('star ferry')) return 8;
      if (combined.includes('hung hom')) return 12;
      if (combined.includes('kwun tong') || combined.includes('kai tak') || combined.includes('sai wan ho')) return 15;
      if (combined.includes('aberdeen')) return 30;

      return 30;
    }

    // 1. FETCH & DEDUPLICATE ROUTE PAGES
    async function loadRoutes() {
      const statusDot = document.getElementById('apiStatusDot');
      const statusText = document.getElementById('apiStatusText');
      
      try {
        const url = "https://hongkongferry.fandom.com/api.php?action=query&list=allpages&apfilterredir=nonredirects&aplimit=500&format=json&origin=*";
        const res = await fetch(url);
        const data = await res.json();
        
        const rawPages = data.query.allpages.filter(p => p.title.includes("Route") && !p.title.includes("Template:"));
        
        const seen = new Set();
        const routes = [];

        for (const page of rawPages) {
          const key = cleanRouteKey(page.title);
          if (!seen.has(key)) {
            seen.add(key);
            routes.push(page);
          }
        }

        const select = document.getElementById('routeSelect');
        select.innerHTML = '';
        
        routes.forEach(r => {
          const parsed = parseRouteDetails(r.title);
          const opt = document.createElement('option');
          opt.value = r.title; // Keep full raw title as value for API query
          opt.textContent = parsed.cleanTitle; // Clean title ONLY (no operator name)
          opt.setAttribute('data-company', parsed.company);
          select.appendChild(opt);
        });

        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        statusText.innerText = `Loaded ${routes.length} unique route schedules.`;

        if (routes.length > 0) {
          updatePierDropdown();
          await fetchAndRender();
        }

      } catch (err) {
        statusDot.className = "w-2 h-2 rounded-full bg-red-500";
        statusText.innerText = "Error reaching wiki API.";
        console.error(err);
      }
    }

    // 2. SCRAPE & PARSE HTML TABLES
    async function parseWikiTimetable(pageTitle) {
      const url = `https://hongkongferry.fandom.com/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=text&format=json&origin=*`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.parse) throw new Error("Parse error");

        const html = data.parse.text["*"];
        const doc = new DOMParser().parseFromString(html, 'text/html');

        let fare = "Consult Live API";
        const ths = Array.from(doc.querySelectorAll('th'));
        const fareTh = ths.find(th => th.textContent.includes('Full fare') || th.textContent.includes('Fare'));
        if (fareTh && fareTh.nextElementSibling) {
          fare = fareTh.nextElementSibling.textContent.trim().split('\n')[0].replace(/\[.*?\]/g, '');
        }

        const tables = doc.querySelectorAll('table.wikitable, table');
        const parsedSailings = [];

        // Special Parser for Multi-stop Inter-Islands Route
        if (pageTitle.toLowerCase().includes("inter-island")) {
          tables.forEach(table => {
            const rows = Array.from(table.querySelectorAll('tr'));
            if (rows.length < 2) return;

            const matrix = rows.map(r => Array.from(r.querySelectorAll('th, td')).map(cell => cell.textContent.trim()));

            for (let i = 1; i < matrix.length; i++) {
              const cols = matrix[i];
              if (cols.length < 2) continue;

              // Extract column times strictly ignoring '/' or skipped stops
              const pc_dep = parseCellTime(cols[0]); // Col 0: Peng Chau
              const isTerminus = cols[1] && cols[1].toLowerCase().includes('terminus');
              const mw_fwd = parseCellTime(cols[1]); // Col 1: Mui Wo (Forward)
              const cmw_fwd = parseCellTime(cols[2]); // Col 2: Chi Ma Wan (Forward)
              const cc_fwd = parseCellTime(cols[3]); // Col 3: Cheung Chau (Forward arrival / Reverse departure)

              // --- FORWARD DIRECTION (Peng Chau -> Mui Wo -> [Chi Ma Wan] -> Cheung Chau) ---
              
              // 1. Departure from Peng Chau
              if (pc_dep) {
                if (isTerminus) {
                  // Special trip ending at Mui Wo (Terminus), e.g., 23:45 from Peng Chau
                  const mw_arr = addMinutesToTime(pc_dep, 20);
                  parsedSailings.push({
                    pier: "Peng Chau",
                    time: pc_dep,
                    next: `Mui Wo (${mw_arr})`,
                    final: "Mui Wo",
                    etaTime: mw_arr,
                    stops: [
                      { pier: "Peng Chau", time: pc_dep },
                      { pier: "Mui Wo", time: mw_arr }
                    ]
                  });
                } else {
                  const mw_arr = mw_fwd || addMinutesToTime(pc_dep, 20);
                  const cc_arr = cc_fwd || (cmw_fwd ? addMinutesToTime(cmw_fwd, 20) : addMinutesToTime(mw_arr, 30));

                  const pcStops = [{ pier: "Peng Chau", time: pc_dep }];
                  if (mw_arr) pcStops.push({ pier: "Mui Wo", time: mw_arr });
                  if (cmw_fwd) pcStops.push({ pier: "Chi Ma Wan", time: cmw_fwd });
                  pcStops.push({ pier: "Cheung Chau", time: cc_arr });

                  const nextStopStr = mw_arr ? `Mui Wo (${mw_arr})` : (cmw_fwd ? `Chi Ma Wan (${cmw_fwd})` : `Cheung Chau (${cc_arr})`);

                  parsedSailings.push({
                    pier: "Peng Chau",
                    time: pc_dep,
                    next: nextStopStr,
                    final: "Cheung Chau",
                    etaTime: cc_arr,
                    stops: pcStops
                  });
                }
              }

              // 2. Intermediate Departure from Mui Wo (Forward)
              if (mw_fwd && !isTerminus) {
                const cc_arr = cc_fwd || (cmw_fwd ? addMinutesToTime(cmw_fwd, 20) : addMinutesToTime(mw_fwd, 30));

                const mwStops = [{ pier: "Mui Wo", time: mw_fwd }];
                if (cmw_fwd) mwStops.push({ pier: "Chi Ma Wan", time: cmw_fwd });
                mwStops.push({ pier: "Cheung Chau", time: cc_arr });

                const nextStopStr = cmw_fwd ? `Chi Ma Wan (${cmw_fwd})` : `Cheung Chau (${cc_arr})`;

                parsedSailings.push({
                  pier: "Mui Wo",
                  time: mw_fwd,
                  next: nextStopStr,
                  final: "Cheung Chau",
                  etaTime: cc_arr,
                  stops: mwStops
                });
              }

              // 3. Intermediate Departure from Chi Ma Wan (Forward - only if not '/')
              if (cmw_fwd) {
                const cc_arr = cc_fwd || addMinutesToTime(cmw_fwd, 20);

                const cmwStops = [
                  { pier: "Chi Ma Wan", time: cmw_fwd },
                  { pier: "Cheung Chau", time: cc_arr }
                ];

                parsedSailings.push({
                  pier: "Chi Ma Wan",
                  time: cmw_fwd,
                  next: `Cheung Chau (${cc_arr})`,
                  final: "Cheung Chau",
                  etaTime: cc_arr,
                  stops: cmwStops
                });
              }

              // --- REVERSE DIRECTION (Cheung Chau -> [Chi Ma Wan] -> Mui Wo -> Peng Chau) ---

              const cc_rev = parseCellTime(cols[3]); // Col 3: Cheung Chau departure
              const cmw_rev = parseCellTime(cols[4]); // Col 4: Chi Ma Wan departure (Reverse)
              const mw_rev = parseCellTime(cols[5]); // Col 5: Mui Wo departure (Reverse)

              // Mui Wo to Peng Chau arrival takes 20 minutes
              const pc_rev_arr = mw_rev ? addMinutesToTime(mw_rev, 20) : null;

              // 1. Departure from Cheung Chau (Reverse)
              if (cc_rev) {
                const mw_time = mw_rev || (cmw_rev ? addMinutesToTime(cmw_rev, 20) : addMinutesToTime(cc_rev, 30));
                const pc_arr = pc_rev_arr || addMinutesToTime(mw_time, 20);

                const ccRevStops = [{ pier: "Cheung Chau", time: cc_rev }];
                if (cmw_rev) ccRevStops.push({ pier: "Chi Ma Wan", time: cmw_rev });
                if (mw_time) ccRevStops.push({ pier: "Mui Wo", time: mw_time });
                ccRevStops.push({ pier: "Peng Chau", time: pc_arr });

                const nextStopStr = cmw_rev ? `Chi Ma Wan (${cmw_rev})` : (mw_time ? `Mui Wo (${mw_time})` : `Peng Chau (${pc_arr})`);

                parsedSailings.push({
                  pier: "Cheung Chau",
                  time: cc_rev,
                  next: nextStopStr,
                  final: "Peng Chau",
                  etaTime: pc_arr,
                  stops: ccRevStops
                });
              }

              // 2. Intermediate Departure from Chi Ma Wan (Reverse - only if not '/')
              if (cmw_rev) {
                const mw_time = mw_rev || addMinutesToTime(cmw_rev, 20);
                const pc_arr = pc_rev_arr || addMinutesToTime(mw_time, 20);

                const cmwRevStops = [{ pier: "Chi Ma Wan", time: cmw_rev }];
                if (mw_time) cmwRevStops.push({ pier: "Mui Wo", time: mw_time });
                cmwRevStops.push({ pier: "Peng Chau", time: pc_arr });

                const nextStopStr = mw_time ? `Mui Wo (${mw_time})` : `Peng Chau (${pc_arr})`;

                parsedSailings.push({
                  pier: "Chi Ma Wan",
                  time: cmw_rev,
                  next: nextStopStr,
                  final: "Peng Chau",
                  etaTime: pc_arr,
                  stops: cmwRevStops
                });
              }

              // 3. Intermediate Departure from Mui Wo (Reverse)
              if (mw_rev) {
                const pc_arr = pc_rev_arr || addMinutesToTime(mw_rev, 20);

                const mwRevStops = [
                  { pier: "Mui Wo", time: mw_rev },
                  { pier: "Peng Chau", time: pc_arr }
                ];

                parsedSailings.push({
                  pier: "Mui Wo",
                  time: mw_rev,
                  next: `Peng Chau (${pc_arr})`,
                  final: "Peng Chau",
                  etaTime: pc_arr,
                  stops: mwRevStops
                });
              }

            }
          });
        } else {
          // Standard 2-Stop Fallback Parsing
          const text = doc.body.textContent || "";
          const times = [...new Set(text.match(/\b([0-2]?[0-9]:[0-5][0-9])\b/g) || [])];
          
          const match = pageTitle.match(/(.*?) - (.*?) Route/);
          const p1 = match ? match[1].replace(/^(Sun Ferry|Star Ferry|HKKF|Tsui Wah|Fortune Ferry|Coral Sea)\s+/i, '').trim() : "Origin";
          const p2 = match ? match[2].trim() : "Destination";

          const durationMins = getStandardRouteDuration(pageTitle, p1, p2);

          times.forEach(t => {
            const formatted = t.padStart(5, '0');
            const arrTime = addMinutesToTime(formatted, durationMins);

            // Forward direction
            parsedSailings.push({
              pier: p1,
              time: formatted,
              next: `${p2} (${arrTime})`,
              final: p2,
              etaTime: arrTime,
              stops: [
                { pier: p1, time: formatted },
                { pier: p2, time: arrTime }
              ]
            });

            // Reverse direction
            parsedSailings.push({
              pier: p2,
              time: formatted,
              next: `${p1} (${arrTime})`,
              final: p1,
              etaTime: arrTime,
              stops: [
                { pier: p2, time: formatted },
                { pier: p1, time: arrTime }
              ]
            });
          });
        }

        // Deduplicate sailings
        const uniqueSailings = [];
        const seenSailings = new Set();
        for (const s of parsedSailings) {
          const key = `${s.pier}-${s.time}-${s.final}`;
          if (!seenSailings.has(key)) {
            seenSailings.add(key);
            uniqueSailings.push(s);
          }
        }

        return { fare, sailings: uniqueSailings };

      } catch (err) {
        console.error("Scraping error:", err);
        return { fare: "Consult Live API", sailings: [] };
      }
    }

    // 3. UI PIER SELECTOR DYNAMIC GENERATOR
    function updatePierDropdown() {
      const routeSelect = document.getElementById('routeSelect');
      const routeTitle = routeSelect.value;
      const pierSelect = document.getElementById('pierSelect');
      pierSelect.innerHTML = '';

      if (routeTitle.toLowerCase().includes("inter-island")) {
        const piers = ["Peng Chau", "Mui Wo", "Chi Ma Wan", "Cheung Chau"];
        piers.forEach(p => {
          pierSelect.innerHTML += `<option value="${p}">Depart from ${p}</option>`;
        });
      } else {
        const match = routeTitle.match(/(.*?) - (.*?) Route/);
        if (match) {
          const p1 = match[1].replace(/^(Sun Ferry|Star Ferry|HKKF|Tsui Wah|Fortune Ferry|Coral Sea)\s+/i, '').trim();
          const p2 = match[2].trim();
          pierSelect.innerHTML += `<option value="${p1}">Depart from ${p1}</option>`;
          pierSelect.innerHTML += `<option value="${p2}">Depart from ${p2}</option>`;
        } else {
          pierSelect.innerHTML += `<option value="Direction 1">Direction 1</option>`;
          pierSelect.innerHTML += `<option value="Direction 2">Direction 2</option>`;
        }
      }
    }

    // 4. FETCH AND RENDER COUNTDOWNS CHRONOLOGICALLY WITH ACCURATE ETAs
    async function fetchAndRender() {
      const routeSelect = document.getElementById('routeSelect');
      const routeTitle = routeSelect.value;
      const selectedPier = document.getElementById('pierSelect').value;
      
      const selectedOption = routeSelect.options[routeSelect.selectedIndex];
      const companyName = selectedOption ? (selectedOption.getAttribute('data-company') || parseRouteDetails(routeTitle).company) : "Ferry Operator";

      // Update Header Discrete Operator Badge
      const opBadgeHeader = document.getElementById('operatorBadgeHeader');
      const opHeaderName = document.getElementById('operatorHeaderName');
      if (companyName) {
        opHeaderName.innerText = companyName;
        opBadgeHeader.classList.remove('hidden');
      }

      document.getElementById('currentPierName').innerText = selectedPier;

      if (!liveTimetableCache[routeTitle]) {
        liveTimetableCache[routeTitle] = await parseWikiTimetable(routeTitle);
      }

      const data = liveTimetableCache[routeTitle];
      const now = new Date();
      const currentMs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), 0).getTime();

      const fareTag = isHolidayOrSunday(now) ? "<span class='text-amber-400'>(Holiday Rates May Apply)</span>" : "";
      document.getElementById('fareStatus').innerHTML = `Live Fare: <strong>${data.fare}</strong> ${fareTag}`;

      const container = document.getElementById('departuresContainer');
      container.innerHTML = '';

      const matchingSailings = data.sailings.filter(s => s.pier === selectedPier);

      if (matchingSailings.length === 0) {
        container.innerHTML = `<div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">No scheduled departures found for ${selectedPier}.</div>`;
        document.getElementById('sailingCount').innerText = `0 sailings upcoming`;
        return;
      }

      // Calculate time remaining & sort chronologically
      const processed = matchingSailings.map(s => {
        const [h, m] = s.time.split(':').map(Number);
        let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);

        if (target.getTime() < currentMs - 2 * 60000) {
          target.setDate(target.getDate() + 1);
        }

        const diffMs = target.getTime() - currentMs;
        const mins = Math.floor(diffMs / 60000);

        return {
          ...s,
          targetDate: target,
          minutesUntil: mins
        };
      });

      const upcoming = processed
        .filter(s => s.minutesUntil >= -2)
        .sort((a, b) => a.targetDate.getTime() - b.targetDate.getTime())
        .slice(0, 15);

      upcoming.forEach((sailing) => {
        let countdownStr = "";
        if (sailing.minutesUntil > 0) {
          const hrs = Math.floor(sailing.minutesUntil / 60);
          const mins = sailing.minutesUntil % 60;
          countdownStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
        } else {
          countdownStr = "Departing";
        }

        let finalEtaTime = sailing.etaTime;
        if (!finalEtaTime && sailing.stops && sailing.stops.length > 0) {
          finalEtaTime = sailing.stops[sailing.stops.length - 1].time;
        }

        if (!finalEtaTime) {
          const dur = getStandardRouteDuration(routeTitle, sailing.pier, sailing.final);
          finalEtaTime = addMinutesToTime(sailing.time, dur);
        }

        const durationMins = getTimeDiffMinutes(sailing.time, finalEtaTime);

        const cardId = `card-${sailing.time}-${sailing.final.replace(/\s+/g, '')}`;
        const isOpen = openCardId === cardId;

        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700/80 hover:border-cyan-500 rounded-xl p-4 transition-all cursor-pointer shadow-md hover:bg-slate-750";
        card.onclick = () => {
          openCardId = openCardId === cardId ? null : cardId;
          fetchAndRender();
        };

        // Render itinerary pills excluding skipped '/' stops
        let stopsHtml = "";
        if (sailing.stops && sailing.stops.length > 0) {
          stopsHtml = sailing.stops
            .map((st, idx) => {
              const isFirst = idx === 0;
              const isLast = idx === sailing.stops.length - 1;
              const bgClass = isFirst ? "bg-slate-900 border-slate-700 text-slate-300" : (isLast ? "bg-emerald-950 border-emerald-800 text-emerald-300" : "bg-cyan-950 border-cyan-800 text-cyan-300");
              return `<span class="inline-block ${bgClass} border px-2 py-0.5 rounded text-[11px] font-semibold">${st.pier}: ${st.time}</span>`;
            })
            .join(' <span class="text-slate-500 font-bold">➔</span> ');
        }

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                ${sailing.time}
              </div>
              <div>
                <div class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Heading Towards</div>
                <div class="text-sm font-bold text-cyan-300 flex items-center gap-1 truncate max-w-[180px] sm:max-w-none">
                  <svg class="w-4 h-4 text-cyan-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                  ${sailing.final}
                </div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold text-cyan-400">${countdownStr}</div>
            </div>
          </div>

          ${isOpen ? `
            <div class="mt-3 pt-3 border-t border-slate-700/60 text-xs sm:text-sm bg-slate-900/50 p-3 rounded-lg text-cyan-200 space-y-2.5">
              
              <!-- ETA & Duration Info Box -->
              <div class="flex items-center justify-between bg-cyan-950/60 border border-cyan-800/60 p-2.5 rounded-lg">
                <div>
                  <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Estimated Arrival (ETA)</div>
                  <div class="text-base font-extrabold text-emerald-400 flex items-center gap-1.5 mt-0.5">
                    <svg class="w-4 h-4 text-emerald-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    ${finalEtaTime}
                    <span class="text-xs text-slate-400 font-normal">(~${durationMins} mins trip)</span>
                  </div>
                </div>
                <div class="text-right">
                  <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Operator</div>
                  <div class="text-xs font-bold text-cyan-300 mt-0.5">${companyName}</div>
                </div>
              </div>

              <div><strong>Next Stop:</strong> ${sailing.next}</div>
              ${stopsHtml ? `<div class="pt-1"><strong>Route Itinerary:</strong><br/><div class="mt-1.5 flex flex-wrap items-center gap-1">${stopsHtml}</div></div>` : ''}
            </div>
          ` : `
            <div class="mt-2 text-[11px] text-slate-500 text-right italic">Click sailing for ETA & itinerary stops ▾</div>
          `}
        `;

        container.appendChild(card);
      });

      document.getElementById('sailingCount').innerText = `${upcoming.length} sailings upcoming`;
      document.getElementById('liveClock').innerText = formatClock(now);
    }

    // 5. EVENT LISTENERS & TICKERS
    document.getElementById('routeSelect').addEventListener('change', async () => {
      openCardId = null;
      updatePierDropdown();
      await fetchAndRender();
    });

    document.getElementById('pierSelect').addEventListener('change', () => {
      openCardId = null;
      fetchAndRender();
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const routeTitle = document.getElementById('routeSelect').value;
      delete liveTimetableCache[routeTitle];
      await fetchAndRender();
    });

    setInterval(() => {
      document.getElementById('liveClock').innerText = formatClock(new Date());
    }, 1000);

    setInterval(fetchAndRender, 30000);

    document.addEventListener("DOMContentLoaded", () => {
      loadRoutes();
    });
  </script>
</body>
</html>
