<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Ferry Live Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b132b;
      color: #e0e1dd;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6">

  <main class="w-full max-w-3xl space-y-4">
    
    <!-- Clock & Status Header -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 text-center shadow-lg">
      <div id="liveClock" class="text-xl sm:text-2xl font-extrabold text-cyan-400 tracking-wide">
        Loading clock...
      </div>
      <div id="fareStatus" class="mt-2 text-xs sm:text-sm text-slate-300 font-medium bg-slate-900/60 py-2 px-3 rounded-lg border border-slate-700/50 inline-block">
        Initializing Fandom Live API...
      </div>
    </div>

    <!-- Controls Container -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 sm:p-5 shadow-xl space-y-4">
      
      <!-- Route & Pier Selectors -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Select Ferry Route (Live)</label>
          <select id="routeSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            <option>Fetching routes...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Departure Pier / Station</label>
          <select id="pierSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            <!-- Populated dynamically based on 2-stop or 4-stop inter-island piers -->
          </select>
        </div>
      </div>

      <!-- API Data Status Bar -->
      <div class="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-700/50">
        <div class="flex items-center gap-1.5">
          <span id="apiStatusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span id="apiStatusText">Querying wiki database...</span>
        </div>
        <button id="refreshBtn" class="text-cyan-400 hover:underline text-xs font-semibold">Refresh Timetable</button>
      </div>
    </div>

    <!-- Departures Section Header -->
    <div class="flex items-center justify-between px-1">
      <h2 id="departuresHeader" class="text-lg font-bold text-slate-200 flex items-center gap-2">
        <span class="text-cyan-400">➢</span> Departures from <span id="currentPierName" class="text-cyan-300">...</span>
      </h2>
      <span id="sailingCount" class="text-xs font-semibold bg-cyan-950 text-cyan-300 border border-cyan-800 px-2.5 py-1 rounded-full">
        0 sailings upcoming
      </span>
    </div>

    <!-- Departure Cards Container -->
    <div id="departuresContainer" class="space-y-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">
        Fetching live schedule...
      </div>
    </div>

  </main>

  <script>
    // System & State Variables
    let liveTimetableCache = {};
    let openCardId = null;

    const HK_HOLIDAYS = [
      "2026-01-01", "2026-02-17", "2026-02-18", "2026-02-19",
      "2026-04-03", "2026-04-04", "2026-04-06", "2026-04-07",
      "2026-05-01", "2026-05-25", "2026-06-19", "2026-07-01",
      "2026-10-01", "2026-12-25", "2026-12-26"
    ];

    function isHolidayOrSunday(d) {
      const isSun = d.getDay() === 0;
      const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      return isSun || HK_HOLIDAYS.includes(dateStr);
    }

    function formatClock(d) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} (${days[d.getDay()]}) ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
    }

    // Normalizes title strings to strip duplicate variations (e.g. "Inter-Island" vs "Inter-Islands")
    function cleanRouteKey(title) {
      return title
        .toLowerCase()
        .replace(/service/g, '')
        .replace(/ferry/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    // 1. FETCH & DEDUPLICATE ROUTE PAGES
    async function loadRoutes() {
      const statusDot = document.getElementById('apiStatusDot');
      const statusText = document.getElementById('apiStatusText');
      
      try {
        const url = "https://hongkongferry.fandom.com/api.php?action=query&list=allpages&apfilterredir=nonredirects&aplimit=500&format=json&origin=*";
        const res = await fetch(url);
        const data = await res.json();
        
        const rawPages = data.query.allpages.filter(p => p.title.includes("Route") && !p.title.includes("Template:"));
        
        // Deduplicate using key normalizer
        const seen = new Set();
        const routes = [];

        for (const page of rawPages) {
          const key = cleanRouteKey(page.title);
          if (!seen.has(key)) {
            seen.add(key);
            routes.push(page);
          }
        }

        const select = document.getElementById('routeSelect');
        select.innerHTML = '';
        
        routes.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.title;
          opt.textContent = r.title;
          select.appendChild(opt);
        });

        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        statusText.innerText = `Loaded ${routes.length} unique route schedules.`;

        if (routes.length > 0) {
          updatePierDropdown();
          await fetchAndRender();
        }

      } catch (err) {
        statusDot.className = "w-2 h-2 rounded-full bg-red-500";
        statusText.innerText = "Error reaching wiki API.";
        console.error(err);
      }
    }

    // 2. SCRAPE & PARSE HTML TABLES (Handles multi-stop & 4-pier routes)
    async function parseWikiTimetable(pageTitle) {
      const url = `https://hongkongferry.fandom.com/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=text&format=json&origin=*`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.parse) throw new Error("Parse error");

        const html = data.parse.text["*"];
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // Check for fare
        let fare = "Consult Live API";
        const ths = Array.from(doc.querySelectorAll('th'));
        const fareTh = ths.find(th => th.textContent.includes('Full fare') || th.textContent.includes('Fare'));
        if (fareTh && fareTh.nextElementSibling) {
          fare = fareTh.nextElementSibling.textContent.trim().split('\n')[0].replace(/\[.*?\]/g, '');
        }

        const tables = doc.querySelectorAll('table.wikitable, table');
        const parsedSailings = [];

        // Special Structured Parser for 4-stop Inter-Islands Route
        if (pageTitle.toLowerCase().includes("inter-island")) {
          // Parse Peng Chau -> Cheung Chau & Cheung Chau -> Peng Chau multi-stop tables
          tables.forEach(table => {
            const rows = Array.from(table.querySelectorAll('tr'));
            if (rows.length < 2) return;

            const headers = Array.from(rows[0].querySelectorAll('th, td')).map(cell => cell.textContent.trim());

            // Detect direction table
            const isPCtoCC = headers.some(h => h.includes("Peng Chau") || h.includes("Mui Wo"));
            const isCCtoPC = headers.some(h => h.includes("Cheung Chau") || h.includes("Chi Ma Wan"));

            for (let i = 1; i < rows.length; i++) {
              const cols = Array.from(rows[i].querySelectorAll('td, th')).map(c => c.textContent.trim());
              if (cols.length >= 2) {
                if (isPCtoCC && !isCCtoPC) {
                  // Forward: Peng Chau [0] -> Mui Wo [1] -> Chi Ma Wan [2] -> Cheung Chau
                  const pc = cols[0]?.match(/\d{2}:\d{2}/)?.[0];
                  const mw = cols[1]?.match(/\d{2}:\d{2}/)?.[0];
                  const cmw = cols[2]?.match(/\d{2}:\d{2}/)?.[0];

                  if (pc) parsedSailings.push({ pier: "Peng Chau", time: pc, next: mw ? `Mui Wo (${mw})` : "Cheung Chau", final: "Cheung Chau", stops: [ { pier: "Peng Chau", time: pc }, { pier: "Mui Wo", time: mw }, { pier: "Chi Ma Wan", time: cmw }, { pier: "Cheung Chau", time: "Terminus" } ] });
                  if (mw) parsedSailings.push({ pier: "Mui Wo", time: mw, next: cmw ? `Chi Ma Wan (${cmw})` : "Cheung Chau", final: "Cheung Chau", stops: [ { pier: "Mui Wo", time: mw }, { pier: "Chi Ma Wan", time: cmw }, { pier: "Cheung Chau", time: "Terminus" } ] });
                  if (cmw) parsedSailings.push({ pier: "Chi Ma Wan", time: cmw, next: "Cheung Chau", final: "Cheung Chau", stops: [ { pier: "Chi Ma Wan", time: cmw }, { pier: "Cheung Chau", time: "Terminus" } ] });

                } else {
                  // Reverse: Cheung Chau [0] -> Chi Ma Wan [1] -> Mui Wo [2] -> Peng Chau
                  const cc = cols[0]?.match(/\d{2}:\d{2}/)?.[0];
                  const cmw = cols[1]?.match(/\d{2}:\d{2}/)?.[0];
                  const mw = cols[2]?.match(/\d{2}:\d{2}/)?.[0];

                  if (cc) parsedSailings.push({ pier: "Cheung Chau", time: cc, next: cmw ? `Chi Ma Wan (${cmw})` : (mw ? `Mui Wo (${mw})` : "Peng Chau"), final: "Peng Chau", stops: [ { pier: "Cheung Chau", time: cc }, { pier: "Chi Ma Wan", time: cmw }, { pier: "Mui Wo", time: mw }, { pier: "Peng Chau", time: "Terminus" } ] });
                  if (cmw) parsedSailings.push({ pier: "Chi Ma Wan", time: cmw, next: mw ? `Mui Wo (${mw})` : "Peng Chau", final: "Peng Chau", stops: [ { pier: "Chi Ma Wan", time: cmw }, { pier: "Mui Wo", time: mw }, { pier: "Peng Chau", time: "Terminus" } ] });
                  if (mw) parsedSailings.push({ pier: "Mui Wo", time: mw, next: "Peng Chau", final: "Peng Chau", stops: [ { pier: "Mui Wo", time: mw }, { pier: "Peng Chau", time: "Terminus" } ] });
                }
              }
            }
          });
        } else {
          // Standard 2-Stop Fallback
          const text = doc.body.textContent || "";
          const times = [...new Set(text.match(/\b([0-2]?[0-9]:[0-5][0-9])\b/g) || [])];
          
          const match = pageTitle.match(/(.*?) - (.*?) Route/);
          const p1 = match ? match[1] : "Origin";
          const p2 = match ? match[2] : "Destination";

          times.forEach(t => {
            const formatted = t.padStart(5, '0');
            parsedSailings.push({ pier: p1, time: formatted, next: p2, final: p2, stops: [] });
            parsedSailings.push({ pier: p2, time: formatted, next: p1, final: p1, stops: [] });
          });
        }

        // Deduplicate parsed sailings to prevent UI overflow from nested tables
        const uniqueSailings = [];
        const seenSailings = new Set();
        for (const s of parsedSailings) {
          const key = `${s.pier}-${s.time}-${s.final}`;
          if (!seenSailings.has(key)) {
            seenSailings.add(key);
            uniqueSailings.push(s);
          }
        }

        return { fare, sailings: uniqueSailings };

      } catch (err) {
        console.error("Scraping error:", err);
        return { fare: "Consult Live API", sailings: [] };
      }
    }

    // 3. UI PIER SELECTOR DYNAMIC GENERATOR
    function updatePierDropdown() {
      const routeTitle = document.getElementById('routeSelect').value;
      const pierSelect = document.getElementById('pierSelect');
      pierSelect.innerHTML = '';

      if (routeTitle.toLowerCase().includes("inter-island")) {
        // 4 Inter-Island Stop Piers
        const piers = ["Peng Chau", "Mui Wo", "Chi Ma Wan", "Cheung Chau"];
        piers.forEach(p => {
          pierSelect.innerHTML += `<option value="${p}">Depart from ${p}</option>`;
        });
      } else {
        // Standard 2-Pier Route
        const match = routeTitle.match(/(.*?) - (.*?) Route/);
        if (match) {
          pierSelect.innerHTML += `<option value="${match[1]}">Depart from ${match[1]}</option>`;
          pierSelect.innerHTML += `<option value="${match[2]}">Depart from ${match[2]}</option>`;
        } else {
          pierSelect.innerHTML += `<option value="Direction 1">Direction 1</option>`;
          pierSelect.innerHTML += `<option value="Direction 2">Direction 2</option>`;
        }
      }
    }

    // 4. FETCH AND RENDER COUNTDOWNS CHRONOLOGICALLY
    async function fetchAndRender() {
      const routeTitle = document.getElementById('routeSelect').value;
      const selectedPier = document.getElementById('pierSelect').value;
      
      document.getElementById('currentPierName').innerText = selectedPier;

      if (!liveTimetableCache[routeTitle]) {
        liveTimetableCache[routeTitle] = await parseWikiTimetable(routeTitle);
      }

      const data = liveTimetableCache[routeTitle];
      const now = new Date();
      // Zero out the seconds of the current time to ensure stable integer minute countdowns
      const currentMs = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), 0).getTime();

      // Update Fare header
      const fareTag = isHolidayOrSunday(now) ? "<span class='text-amber-400'>(Holiday Rates May Apply)</span>" : "";
      document.getElementById('fareStatus').innerHTML = `Live Scraped Fare: <strong>${data.fare}</strong> ${fareTag}`;

      const container = document.getElementById('departuresContainer');
      container.innerHTML = '';

      // Filter sailings for selected pier
      const matchingSailings = data.sailings.filter(s => s.pier === selectedPier);

      if (matchingSailings.length === 0) {
        container.innerHTML = `<div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">No scheduled departures found for ${selectedPier}.</div>`;
        document.getElementById('sailingCount').innerText = `0 sailings upcoming`;
        return;
      }

      // Calculate time remaining & sort
      const processed = matchingSailings.map(s => {
        const [h, m] = s.time.split(':').map(Number);
        let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);

        // Handle overnight sailings
        if (target.getTime() < currentMs - 2 * 60000) {
          target.setDate(target.getDate() + 1);
        }

        const diffMs = target.getTime() - currentMs;
        const mins = Math.floor(diffMs / 60000);

        return {
          ...s,
          targetDate: target,
          minutesUntil: mins
        };
      });

      // Sort chronologically from nearest to furthest departure time
      const upcoming = processed
        .filter(s => s.minutesUntil >= -2)
        .sort((a, b) => a.targetDate.getTime() - b.targetDate.getTime())
        .slice(0, 15);

      upcoming.forEach((sailing) => {
        let countdownStr = "";
        if (sailing.minutesUntil > 0) {
          const hrs = Math.floor(sailing.minutesUntil / 60);
          const mins = sailing.minutesUntil % 60;
          countdownStr = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
        } else {
          countdownStr = "Departing";
        }

        // Use a unique static ID instead of array index to prevent correct card from closing when array order changes
        const cardId = `card-${sailing.time}-${sailing.final.replace(/\s+/g, '')}`;
        const isOpen = openCardId === cardId;

        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700/80 hover:border-cyan-500 rounded-xl p-4 transition-all cursor-pointer shadow-md hover:bg-slate-750";
        card.onclick = () => {
          openCardId = openCardId === cardId ? null : cardId;
          fetchAndRender();
        };

        // Render Stop breakdown if available
        let stopsHtml = "";
        if (sailing.stops && sailing.stops.length > 0) {
          stopsHtml = sailing.stops
            .filter(st => st.time && st.time !== "/")
            .map(st => `<span class="inline-block bg-slate-900 border border-slate-700 px-2 py-0.5 rounded text-[11px] text-cyan-300 mr-1 mt-1">${st.pier}: ${st.time}</span>`)
            .join(' ➔ ');
        }

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                ${sailing.time}
              </div>
              <div>
                <div class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Heading Towards</div>
                <div class="text-sm font-bold text-cyan-300 flex items-center gap-1 truncate max-w-[180px] sm:max-w-none">
                  <svg class="w-4 h-4 text-cyan-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                  ${sailing.final}
                </div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold text-cyan-400">${countdownStr}</div>
            </div>
          </div>

          ${isOpen ? `
            <div class="mt-3 pt-3 border-t border-slate-700/60 text-xs sm:text-sm bg-slate-900/50 p-2.5 rounded-lg text-cyan-200 space-y-1.5">
              <div><strong>Next Stop:</strong> ${sailing.next}</div>${stopsHtml ? `<div class="pt-1"><strong>Route Itinerary:</strong><br/> ${stopsHtml}</div>` : ''}
            </div>
          ` : `
            <div class="mt-2 text-[11px] text-slate-500 text-right italic">Click sailing to expand voyage stops ▾</div>
          `}
        `;

        container.appendChild(card);
      });

      document.getElementById('sailingCount').innerText = `${upcoming.length} sailings upcoming`;
      document.getElementById('liveClock').innerText = formatClock(now);
    }

    // 5. EVENT LISTENERS & TICKERS
    document.getElementById('routeSelect').addEventListener('change', async () => {
      openCardId = null;
      updatePierDropdown();
      await fetchAndRender();
    });

    document.getElementById('pierSelect').addEventListener('change', () => {
      openCardId = null;
      fetchAndRender();
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const routeTitle = document.getElementById('routeSelect').value;
      delete liveTimetableCache[routeTitle];
      await fetchAndRender();
    });

    setInterval(() => {
      document.getElementById('liveClock').innerText = formatClock(new Date());
    }, 1000);

    setInterval(fetchAndRender, 30000);

    document.addEventListener("DOMContentLoaded", () => {
      loadRoutes();
    });
  </script>
</body>
</html>
