<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK Ferry Live Schedule (Dynamic Fandom API)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b132b;
      color: #e0e1dd;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6">

  <main class="w-full max-w-3xl space-y-4">
    
    <!-- Header: Live Date & Extracted Fare Indicator -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-xl p-4 text-center shadow-lg">
      <div id="liveClock" class="text-xl sm:text-2xl font-extrabold text-cyan-400 tracking-wide">
        Loading live time...
      </div>
      <div id="fareStatus" class="mt-2 text-xs sm:text-sm text-slate-300 font-medium bg-slate-900/60 py-2 px-3 rounded-lg border border-slate-700/50 inline-block">
        Initializing Fandom API connection...
      </div>
    </div>

    <!-- Controls Container -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 sm:p-5 shadow-xl space-y-4">
      
      <!-- Route & Pier Selectors -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Select Ferry Route (Live)</label>
          <select id="routeSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none disabled:opacity-50">
            <option>Loading routes from Fandom...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Direction / Pier</label>
          <select id="pierSelect" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:outline-none">
            <!-- Dynamically generated based on Route Title -->
          </select>
        </div>
      </div>

      <!-- API Data Status Bar -->
      <div class="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-700/50">
        <div class="flex items-center gap-1.5">
          <span id="apiStatusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span id="apiStatusText">Querying wiki database...</span>
        </div>
        <button id="refreshBtn" class="text-cyan-400 hover:underline text-xs font-semibold">Refresh Timetable</button>
      </div>
    </div>

    <!-- Departures Section Header -->
    <div class="flex items-center justify-between px-1">
      <h2 id="departuresHeader" class="text-lg font-bold text-slate-200 flex items-center gap-2">
        <span class="text-cyan-400">➢</span> Departures from <span id="currentPierName" class="text-cyan-300">...</span>
      </h2>
      <span id="sailingCount" class="text-xs font-semibold bg-cyan-950 text-cyan-300 border border-cyan-800 px-2.5 py-1 rounded-full">
        0 sailings upcoming
      </span>
    </div>

    <!-- Departure Cards Container -->
    <div id="departuresContainer" class="space-y-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">
        Fetching live timetable data...
      </div>
    </div>

  </main>

  <script>
    // --- 1. GLOBAL VARIABLES & CALENDAR ---
    let liveTimetableCache = {};
    let openCardId = null;
    let currentRouteDuration = 30; // Fallback duration in minutes

    const HK_PUBLIC_HOLIDAYS = [
      "2026-01-01", "2026-02-17", "2026-02-18", "2026-02-19",
      "2026-04-03", "2026-04-04", "2026-04-06", "2026-04-07",
      "2026-05-01", "2026-05-25", "2026-06-19", "2026-07-01",
      "2026-10-01", "2026-12-25", "2026-12-26"
    ];

    function isSunOrHoliday(dateObj) {
      const isSunday = dateObj.getDay() === 0;
      const fmtDate = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
      return isSunday || HK_PUBLIC_HOLIDAYS.includes(fmtDate);
    }

    function formatClock(now) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} (${days[now.getDay()]}) ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }

    // Normalizes strings to eliminate near-duplicate title variations
    function canonicalKey(title) {
      return title
        .toLowerCase()
        .replace(/service/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    // --- 2. DYNAMIC FANDOM API INTEGRATION ---

    // A. Fetch All Route Pages & Deduplicate
    async function fetchAllRoutesList() {
      const statusDot = document.getElementById('apiStatusDot');
      const statusText = document.getElementById('apiStatusText');
      
      try {
        // Query non-redirect pages from Fandom API (apfilterredir=nonredirects removes alias duplicates)
        const endpoint = "https://hongkongferry.fandom.com/api.php?action=query&list=allpages&apfilterredir=nonredirects&aplimit=500&format=json&origin=*";
        const response = await fetch(endpoint);
        const data = await response.json();
        
        const rawPages = data.query.allpages.filter(p => p.title.includes("Route") && !p.title.includes("Template:"));
        
        // Deduplicate near-identical route page names
        const seenKeys = new Set();
        const routes = [];

        for (const page of rawPages) {
          const key = canonicalKey(page.title);
          if (!seenKeys.has(key)) {
            seenKeys.add(key);
            routes.push(page);
          }
        }

        const select = document.getElementById('routeSelect');
        select.innerHTML = '';
        
        routes.forEach(route => {
          const opt = document.createElement('option');
          opt.value = route.title;
          opt.textContent = route.title;
          select.appendChild(opt);
        });

        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        statusText.innerText = `Loaded ${routes.length} unique live routes.`;

        if (routes.length > 0) {
          updatePierDropdown();
          await loadAndRender();
        }

      } catch (err) {
        statusDot.className = "w-2 h-2 rounded-full bg-red-500";
        statusText.innerText = "Error fetching routes list from wiki.";
        console.error(err);
      }
    }

    // B. Fetch Page Content & Parse Data
    async function fetchFandomTimetable(pageTitle) {
      const statusDot = document.getElementById('apiStatusDot');
      const statusText = document.getElementById('apiStatusText');
      statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-ping";
      statusText.innerText = `Scraping [${pageTitle}]...`;

      const endpoint = `https://hongkongferry.fandom.com/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=text&format=json&origin=*`;

      try {
        const response = await fetch(endpoint);
        const data = await response.json();

        if (data.error || !data.parse) throw new Error("Wiki page unreadable");

        const htmlContent = data.parse.text["*"];
        const parsedData = extractDetailsFromHtml(htmlContent);

        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        statusText.innerText = `Data updated from live wiki: ${new Date().toLocaleTimeString()}`;
        return parsedData;

      } catch (err) {
        statusDot.className = "w-2 h-2 rounded-full bg-red-500";
        statusText.innerText = "Failed to load timetable.";
        return { times: [], fare: "Consult Live API", duration: 30 };
      }
    }

    // C. Scrape Data from Raw HTML
    function extractDetailsFromHtml(htmlContent) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlContent, 'text/html');
      
      let extractedFare = "Consult Live API";
      let extractedDuration = 30; // default duration

      // Scrape InfoBox for duration and fare details
      const ths = Array.from(doc.querySelectorAll('th'));
      
      const durationTh = ths.find(th => th.textContent.includes('Travelling time') || th.textContent.includes('Journey time'));
      if (durationTh && durationTh.nextElementSibling) {
         const match = durationTh.nextElementSibling.textContent.match(/(\d+)/);
         if (match) extractedDuration = parseInt(match[1]);
      }

      const fareTh = ths.find(th => th.textContent.includes('Full fare') || th.textContent.includes('Fare'));
      if (fareTh && fareTh.nextElementSibling) {
         extractedFare = fareTh.nextElementSibling.textContent.trim().split('\n')[0].replace(/\[.*?\]/g, ''); 
      }

      // Scrape standard timetable HH:MM patterns
      const timesList = [];
      const timeRegex = /\b([0-2]?[0-9]:[0-5][0-9])\b/g;
      const contentBody = doc.querySelector('.mw-parser-output') || doc.body;
      const textContent = contentBody.textContent || "";
      const matches = [...new Set(textContent.match(timeRegex) || [])];

      matches.forEach(timeStr => {
        const [h, m] = timeStr.split(':');
        timesList.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
      });

      return {
        times: timesList,
        fare: extractedFare,
        duration: extractedDuration
      };
    }

    // --- 3. DYNAMIC UI & SORTING LOGIC ---
    
    function updatePierDropdown() {
      const routeTitle = document.getElementById('routeSelect').value;
      const pierSelect = document.getElementById('pierSelect');
      
      const match = routeTitle.match(/(.*?) - (.*?) Route/);
      
      pierSelect.innerHTML = '';
      if (match) {
        const originFull = match[1];
        const dest = match[2];
        
        pierSelect.innerHTML += `<option value="dir1" data-dest="${dest}">Depart from ${originFull}</option>`;
        pierSelect.innerHTML += `<option value="dir2" data-dest="${originFull}">Depart from ${dest}</option>`;
      } else {
        pierSelect.innerHTML += `<option value="dir1" data-dest="Destination">Direction 1</option>`;
        pierSelect.innerHTML += `<option value="dir2" data-dest="Origin">Direction 2</option>`;
      }
    }

    function calculateArrivalDate(sailingDate, durationMinutes) {
      const arr = new Date(sailingDate.getTime() + durationMinutes * 60000);
      const arrH = String(arr.getHours()).padStart(2, '0');
      const arrM = String(arr.getMinutes()).padStart(2, '0');
      return `${arrH}:${arrM}`;
    }

    function updateClockAndHeader() {
      const now = new Date();
      document.getElementById('liveClock').innerText = formatClock(now);
      
      const routeTitle = document.getElementById('routeSelect').value;
      if (liveTimetableCache[routeTitle]) {
        const fare = liveTimetableCache[routeTitle].fare;
        const holidayTag = isSunOrHoliday(now) ? "<span class='text-amber-400'>(Holiday Rates May Apply)</span>" : "";
        document.getElementById('fareStatus').innerHTML = `Live Scraped Fare: <strong>${fare}</strong> ${holidayTag}`;
      }
    }

    async function loadAndRender() {
      const routeTitle = document.getElementById('routeSelect').value;
      const pierSelect = document.getElementById('pierSelect');
      const selectedOption = pierSelect.options[pierSelect.selectedIndex];
      
      document.getElementById('currentPierName').innerText = selectedOption.text.replace('Depart from ', '');
      const destinationText = selectedOption.getAttribute('data-dest');

      if (!liveTimetableCache[routeTitle]) {
        liveTimetableCache[routeTitle] = await fetchFandomTimetable(routeTitle);
      }

      const scheduleData = liveTimetableCache[routeTitle];
      currentRouteDuration = scheduleData.duration;
      const now = new Date();

      const container = document.getElementById('departuresContainer');
      container.innerHTML = '';

      if (!scheduleData.times || scheduleData.times.length === 0) {
        container.innerHTML = `<div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">No standard timetable data found on this wiki page.</div>`;
        document.getElementById('sailingCount').innerText = `0 sailings upcoming`;
        return;
      }

      // Compute actual target Date objects for each sailing time relative to right now
      const structuredSailings = scheduleData.times.map(timeStr => {
        const [h, m] = timeStr.split(':').map(Number);
        
        let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
        
        // If the sailing time today has already passed, treat it as tomorrow's departure
        if (targetDate.getTime() < now.getTime() - 2 * 60000) {
          targetDate.setDate(targetDate.getDate() + 1);
        }

        const diffMs = targetDate.getTime() - now.getTime();
        const minutesUntil = Math.floor(diffMs / 60000);

        return {
          timeStr,
          targetDate,
          minutesUntil
        };
      });

      // Filter upcoming sailings & sort chronologically from soonest to furthest
      const upcomingSailings = structuredSailings
        .filter(s => s.minutesUntil >= -2)
        .sort((a, b) => a.targetDate.getTime() - b.targetDate.getTime())
        .slice(0, 15); // Show next 15 upcoming departures

      upcomingSailings.forEach((sailing, idx) => {
        let durationText = '';
        if (sailing.minutesUntil > 0) {
          const hrs = Math.floor(sailing.minutesUntil / 60);
          const mins = sailing.minutesUntil % 60;
          durationText = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
        } else {
          durationText = "Departing";
        }

        const cardId = `card-${idx}`;
        const isOpen = openCardId === cardId;
        const estArrival = calculateArrivalDate(sailing.targetDate, currentRouteDuration);

        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700/80 hover:border-cyan-500 rounded-xl p-4 transition-all cursor-pointer shadow-md hover:bg-slate-750";
        card.onclick = () => {
          openCardId = openCardId === cardId ? null : cardId;
          loadAndRender();
        };

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
              <div class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                ${sailing.timeStr}
              </div>
              <div>
                <div class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Heading Towards</div>
                <div class="text-sm font-bold text-cyan-300 flex items-center gap-1 truncate w-40 sm:w-auto">
                  <svg class="w-4 h-4 text-cyan-400 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                  ${destinationText}
                </div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold text-cyan-400">${durationText}</div>
            </div>
          </div>

          ${isOpen ? `
            <div class="mt-3 pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs sm:text-sm bg-slate-900/50 p-2.5 rounded-lg text-cyan-200">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Est. Journey Time: <strong>${currentRouteDuration} mins</strong></span>
              </div>
              <div>
                Est. Arrival: <strong class="text-emerald-400">${estArrival}</strong>
              </div>
            </div>
          ` : `
            <div class="mt-2 text-[11px] text-slate-500 text-right italic">Click sailing to expand arrival time ▾</div>
          `}
        `;

        container.appendChild(card);
      });

      if (upcomingSailings.length === 0) {
        container.innerHTML = `<div class="bg-slate-800 border border-slate-700 rounded-xl p-6 text-center text-slate-400">No upcoming sailings remaining today or tomorrow based on parsed data.</div>`;
      }
      
      document.getElementById('sailingCount').innerText = `${upcomingSailings.length} sailings upcoming`;
      updateClockAndHeader();
    }

    // --- 4. INITIALIZATION & EVENT LISTENERS ---
    document.getElementById('routeSelect').addEventListener('change', async () => {
      openCardId = null;
      updatePierDropdown();
      await loadAndRender();
    });

    document.getElementById('pierSelect').addEventListener('change', () => {
      openCardId = null;
      loadAndRender();
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const routeTitle = document.getElementById('routeSelect').value;
      delete liveTimetableCache[routeTitle];
      await loadAndRender();
    });

    // Auto Tickers
    setInterval(updateClockAndHeader, 1000);
    setInterval(loadAndRender, 30000);

    // Initial Start
    document.addEventListener("DOMContentLoaded", () => {
      updateClockAndHeader();
      fetchAllRoutesList();
    });
  </script>
</body>
</html>
