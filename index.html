    <!-- Global Ferry Core Registry -->
    <script>
        window.PulseFerry = {
            scheduleData: {},
            timeToMins: function(tm) {
                const [h, m] = tm.split(':').map(Number);
                return h * 60 + m;
            },
            minsToTime: function(m) {
                const h = Math.floor(m / 60) % 24;
                const min = m % 60;
                return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
            },
            addMins: function(tm, mins) {
                return this.minsToTime(this.timeToMins(tm) + mins);
            },
            generateFrequent: function(p1, p2, startTime, endTime, headwayMins, travelMins) {
                const trips = [];
                let current = this.timeToMins(startTime);
                const end = this.timeToMins(endTime);
                while (current <= end) {
                    const timeStr = this.minsToTime(current);
                    const arrivalStr = this.addMins(timeStr, travelMins);
                    trips.push({ stops: [{ p: p1, t: timeStr }, { p: p2, t: arrivalStr }], duration: travelMins });
                    trips.push({ stops: [{ p: p2, t: timeStr }, { p: p1, t: arrivalStr }], duration: travelMins });
                    current += headwayMins;
                }
                return trips;
            },
            generateDirectional: function(p1, p2, outbound, inbound, travelMins) {
                const trips = [];
                outbound.forEach(tm => {
                    trips.push({ 
                        stops: [{ p: p1, t: tm }, { p: p2, t: this.addMins(tm, travelMins) }],
                        duration: travelMins 
                    });
                });
                inbound.forEach(tm => {
                    trips.push({ 
                        stops: [{ p: p2, t: tm }, { p: p1, t: this.addMins(tm, travelMins) }],
                        duration: travelMins 
                    });
                });
                return trips;
            },
            registerRoute: function(key, data) {
                if (data.trips && !Array.isArray(data.trips)) {
                    let normalizedTrips = [];
                    for (const [dirKey, departures] of Object.entries(data.trips)) {
                        const [p1, p2] = dirKey.split("-");
                        departures.forEach(dep => {
                            const duration = dep.duration || 45;
                            const arrivalTime = this.addMins(dep.t, duration);
                            normalizedTrips.push({
                                weekdayOnly: dep.weekdayOnly || false,
                                weekendOnly: dep.weekendOnly || false,
                                vesselType: dep.type || "standard",
                                duration: duration,
                                cargo: dep.cargo || false,
                                stops: [{ p: p1, t: dep.t }, { p: p2, t: arrivalTime }]
                            });
                        });
                    }
                    data.trips = normalizedTrips;
                }
                this.scheduleData[key] = data;
            }
        };
    </script>

            'Ma Liu Shui Landing 3': {lat: 22.4165, lng: 114.2120},
            'Macau Outer Harbour Ferry Terminal': {lat: 22.1966, lng: 113.5559},
            'Macau Taipa Ferry Terminal': {lat: 22.1625, lng: 113.5786}
        };

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function findNearestPierAndRoute(userLat, userLng) {
            let closestPierId = null, closestRouteId = null, closestPierName = null, minDistance = Infinity;
            for (const [routeKey, routeData] of Object.entries(scheduleData)) {
                for (const [pierId, pierName] of Object.entries(routeData.piers || {})) {
                    const coords = pierCoordinates[pierName];
                    if (coords) {
                        const dist = getDistance(userLat, userLng, coords.lat, coords.lng);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestPierId = pierId;
                            closestRouteId = routeKey;
                            closestPierName = pierName;
                        }
                    }
                }
            }
            return { routeId: closestRouteId, pierId: closestPierId, pierName: closestPierName };
        }

        function t(text) {
            if (!text) return '';
            if (currentLang === 'en') return text;
            return (i18n[currentLang] && i18n[currentLang][text]) ? i18n[currentLang][text] : text;
        }

        function t_fare(fareStr) {
            if (currentLang === 'en') return fareStr;
            let translated = fareStr;
            ['(Ord)', '(Fast)', '(Single Ticket)', '(Roundtrip)'].forEach(term => {
                translated = translated.replace(term, t(term));
            });
            return translated;
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.getAttribute('data-i18n-placeholder')));
            const viewToggleText = document.getElementById('viewToggleText');
            if (viewToggleText) viewToggleText.textContent = isTimetableGridOpen ? t("Live Cards View") : t("Timetable");
        }

        // Hardcoded HK Public Holidays for logic evaluation
        const HK_PUBLIC_HOLIDAYS = {
            "2026-10-01": "National Day", "2026-10-18": "Chung Yeung Festival", "2026-12-25": "Christmas Day", "2026-12-26": "Boxing Day",
            "2027-01-01": "New Year's Day", "2027-02-06": "Lunar New Year's Day"
        };

        const scheduleData = window.PulseFerry.scheduleData;
        const routeSelect = document.getElementById('routeSelect');
        const pierSelect = document.getElementById('pierSelect');
        const scheduleContainer = document.getElementById('scheduleContainer');
        const searchInput = document.getElementById('searchInput');
        let currentActiveCategory = 'all';
        let isTimetableGridOpen = false;

        function initApp() {
            document.getElementById('langSelect').value = currentLang;
            applyTranslations();
            checkHolidayAndSundayStatus();
            fetchWeatherDisruptions();
            
            populateRoutes();
            updateLiveClock();

            setInterval(updateLiveClock, 1000);
            setInterval(renderSchedule, 15000);

            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLang = e.target.value;
                localStorage.setItem('pulseFerryLang', currentLang);
                applyTranslations();
                populateRoutes();
                populatePiers();
                renderSchedule();
                if (isTimetableGridOpen && routeSelect.value !== 'GPS_MODE') renderTimetableGrid();
            });

            document.getElementById('gpsBtn').addEventListener('click', handleGPSClick);
            
            routeSelect.addEventListener('change', () => { 
                if (routeSelect.value !== 'GPS_MODE') currentGpsPierName = null; 
                populatePiers(); 
                renderSchedule(); 
                if (isTimetableGridOpen && routeSelect.value !== 'GPS_MODE') renderTimetableGrid(); 
            });

            pierSelect.addEventListener('change', () => { 
                renderSchedule(); 
                if (isTimetableGridOpen && routeSelect.value !== 'GPS_MODE') renderTimetableGrid(); 
            });

            document.getElementById('swapDirectionBtn').addEventListener('click', () => { 
                if (pierSelect.options.length > 1) {
                    pierSelect.selectedIndex = (pierSelect.selectedIndex + 1) % pierSelect.options.length; 
                    renderSchedule(); 
                    if (isTimetableGridOpen && routeSelect.value !== 'GPS_MODE') renderTimetableGrid();
                }
            });
            
            searchInput.addEventListener('input', () => { 
                currentGpsPierName = null; 
                document.getElementById('clearSearch').classList.toggle('hidden', searchInput.value === ''); 
                populateRoutes(); 
                populatePiers(); 
                renderSchedule(); 
            });

            document.getElementById('clearSearch').addEventListener('click', () => { 
                currentGpsPierName = null; 
                searchInput.value = ''; 
                document.getElementById('clearSearch').classList.add('hidden'); 
                populateRoutes(); 
                populatePiers(); 
                renderSchedule(); 
            });
            
            document.querySelectorAll('.cat-pill').forEach(pill => {
                pill.addEventListener('click', () => {
                    currentGpsPierName = null;
                    document.querySelectorAll('.cat-pill').forEach(p => {
                        p.classList.remove('bg-[#2dd4bf]', 'text-slate-900', 'font-bold');
                        p.classList.add('bg-white/5', 'text-gray-300', 'font-medium');
                    });
                    pill.classList.remove('bg-white/5', 'text-gray-300', 'font-medium');
                    pill.classList.add('bg-[#2dd4bf]', 'text-slate-900', 'font-bold');
                    
                    currentActiveCategory = pill.dataset.cat;
                    populateRoutes();
                    populatePiers();
                    renderSchedule();
                });
            });

            document.getElementById('fareBtn').addEventListener('click', openFareModal);
            document.getElementById('closeFareModal').addEventListener('click', () => document.getElementById('fareModal').classList.add('hidden'));
            document.getElementById('viewToggleBtn').addEventListener('click', toggleTimetableGrid);
            document.getElementById('closeTimetableBtn').addEventListener('click', toggleTimetableGrid);

            populatePiers();
            renderSchedule();
        }

        function handleGPSClick() {
            if ("geolocation" in navigator) {
                document.getElementById('gpsBtnText').textContent = t('Locating...');
                navigator.geolocation.getCurrentPosition((position) => {
                    const nearest = findNearestPierAndRoute(position.coords.latitude, position.coords.longitude);
                    if (nearest.pierName) {
                        currentGpsPierName = nearest.pierName;
                        document.querySelectorAll('.cat-pill').forEach(p => {
                            p.classList.remove('bg-[#2dd4bf]', 'text-slate-900', 'font-bold');
                            p.classList.add('bg-white/5', 'text-gray-300', 'font-medium');
                        });
                        const allPill = document.querySelector('.cat-pill[data-cat="all"]');
                        if (allPill) {
                            allPill.classList.remove('bg-white/5', 'text-gray-300', 'font-medium');
                            allPill.classList.add('bg-[#2dd4bf]', 'text-slate-900', 'font-bold');
                        }
                        currentActiveCategory = 'all';
                        searchInput.value = ''; 
                        document.getElementById('clearSearch').classList.add('hidden');
                        populateRoutes();
                        routeSelect.value = 'GPS_MODE';
                        populatePiers();
                        if (isTimetableGridOpen) toggleTimetableGrid(); 
                        renderSchedule();
                    }
                    document.getElementById('gpsBtnText').textContent = t('Nearest Pier');
                }, () => {
                    alert(t('Location disabled or unavailable'));
                    document.getElementById('gpsBtnText').textContent = t('Nearest Pier');
                }, { enableHighAccuracy: true });
            }
        }

        function updateLiveClock() {
            const now = new Date();
            const liveClockEl = document.getElementById('liveClock');
            if (liveClockEl) {
                liveClockEl.textContent = now.toLocaleDateString('en-GB', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            }
        }

        function checkHolidayAndSundayStatus() {
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const holidayName = HK_PUBLIC_HOLIDAYS[dateStr];
            
            isHolidayPricingToday = (now.getDay() === 0 || !!holidayName);

            const holidayBanner = document.getElementById('holidayBanner');
            if (holidayBanner) {
                if (isHolidayPricingToday) {
                    holidayBanner.classList.remove('hidden');
                    document.getElementById('holidayTitle').textContent = holidayName ? `${t('HK Public Holiday')} (${t(holidayName) || holidayName}):` : t('Sunday Service Notice:');
                } else {
                    holidayBanner.classList.add('hidden');
                }
            }
        }

        async function fetchWeatherDisruptions() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.28&longitude=114.16&current=wind_speed_10m,wind_gusts_10m&wind_speed_unit=kmh');
                const data = await res.json();
                const gusts = data?.current?.wind_gusts_10m || 0;

                if (gusts > 60) {
                    globalWeatherWarningHtml = `
                        <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-3 mb-3 flex items-start space-x-3 fade-in shadow-inner">
                            <span class="text-2xl mt-0.5">🌊</span>
                            <div>
                                <h4 class="text-red-400 font-bold text-sm">${t('Rough Sea Conditions Warning')}</h4>
                                <p class="text-red-200/80 text-xs mt-0.5 leading-relaxed">${t('High winds detected (Gusts up to')} <strong class="text-white">${gusts}</strong> ${t('km/h). Ferry services may experience delays, heavy rocking, or sudden suspensions. Check with operators.')}</p>
                            </div>
                        </div>`;
                } else if (gusts > 40) {
                    globalWeatherWarningHtml = `
                        <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-3 flex items-start space-x-3 fade-in shadow-inner">
                            <span class="text-2xl mt-0.5">🌬️</span>
                            <div>
                                <h4 class="text-amber-400 font-bold text-sm">${t('Breezy Sea Conditions')}</h4>
                                <p class="text-amber-200/80 text-xs mt-0.5 leading-relaxed">${t('Moderate winds detected. Ferries are operating normally but expect a bumpier ride than usual.')}</p>
                            </div>
                        </div>`;
                }
                renderSchedule();
            } catch(e) {
                // Silently ignore if offline
            }
        }

        function populateRoutes() {
            const query = searchInput.value.trim().toLowerCase();
            const currentSelected = routeSelect.value;
            routeSelect.innerHTML = '';
            let matchedCount = 0;

            if (currentGpsPierName && query === '' && currentActiveCategory === 'all') {
                const option = document.createElement('option');
                option.value = 'GPS_MODE'; 
                option.textContent = `📍 ${t('Departing from')} ${t(currentGpsPierName)}`;
                routeSelect.appendChild(option);
            }

            for (const [key, route] of Object.entries(scheduleData)) {
                if (currentActiveCategory !== 'all' && route.category !== currentActiveCategory) continue;
                if (query !== '') {
                    const pierNames = Object.values(route.piers || {});
                    const translatedPiers = pierNames.map(p => t(p));
                    const searchable = `${route.name} ${t(route.name)} ${route.operator} ${t(route.operator)} ${pierNames.join(' ')} ${translatedPiers.join(' ')}`.toLowerCase();
                    if (!searchable.includes(query)) continue;
                }
                const option = document.createElement('option');
                option.value = key; 
                option.textContent = t(route.name);
                routeSelect.appendChild(option);
                matchedCount++;
            }

            document.getElementById('routeCountBadge').textContent = `${matchedCount} ${matchedCount === 1 ? t('Route') : t('Routes')}`;
            if (currentSelected && [...routeSelect.options].some(o => o.value === currentSelected)) {
                routeSelect.value = currentSelected;
            }
        }

        function populatePiers() {
            pierSelect.innerHTML = '';
            const routeKey = routeSelect.value;
            if (routeKey === 'GPS_MODE') {
                const opt = document.createElement('option'); 
                opt.value = 'ALL_DEST'; 
                opt.textContent = `🗺️ ${t('All Destinations')}`;
                pierSelect.appendChild(opt); 
                return;
            }
            if (!routeKey || !scheduleData[routeKey]) return;
            
            for (const [key, name] of Object.entries(scheduleData[routeKey].piers || {})) {
                const option = document.createElement('option');
                option.value = key; 
                option.textContent = `${t('Depart from')} ${t(name)}`;
                pierSelect.appendChild(option);
            }
        }

        function parseTimeToDate(timeStr) {
            const now = new Date();
            const [hours, minutes] = timeStr.split(':').map(Number);
            let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);
            if (now.getTime() - targetDate.getTime() > 12 * 60 * 60 * 1000) targetDate.setDate(targetDate.getDate() + 1);
            else if (targetDate.getTime() - now.getTime() > 20 * 60 * 60 * 1000) targetDate.setDate(targetDate.getDate() - 1);
            return targetDate;
        }

        function extractDeparturesForRoute(route, pierKey, now, isWeekend) {
            const deps = [];
            (route.trips || []).forEach(trip => {
                if (trip.weekdayOnly && isWeekend) return;
                if (trip.weekendOnly && !isWeekend) return;

                const stops = trip.stops;
                if (!stops || stops.length === 0) return;
                const pierIndex = stops.findIndex(s => s.p === pierKey);

                if (pierIndex !== -1 && pierIndex < stops.length - 1) {
                    const departureDate = parseTimeToDate(stops[pierIndex].t);
                    const diffMinutes = Math.floor((departureDate.getTime() - now.getTime()) / 60000);
                    
                    if (diffMinutes >= -15 && diffMinutes < 1440) {
                        const finalStop = stops[stops.length - 1];
                        const nextStop = stops[pierIndex + 1];

                        deps.push({
                            operator: route.operator,
                            departureTime: stops[pierIndex].t,
                            departureDate: departureDate,
                            nextStop: route.piers[nextStop.p] || nextStop.p,
                            nextStopTime: nextStop.t,
                            destination: route.piers[finalStop.p] || finalStop.p,
                            etaDestination: finalStop.t,
                            countdownMins: diffMinutes,
                            travelDurationMins: (window.PulseFerry.timeToMins(finalStop.t) - window.PulseFerry.timeToMins(stops[pierIndex].t) + 1440) % 1440,
                            vesselType: trip.vesselType, 
                            cargo: trip.cargo,
                            routeFares: route.fares
                        });
                    }
                }
            });
            return deps;
        }

        function renderSchedule() {
            const routeKey = routeSelect.value;
            const pierKey = pierSelect.value;

            if (routeKey !== 'GPS_MODE' && (!routeKey || !scheduleData[routeKey])) {
                scheduleContainer.innerHTML = `<div class="bg-[#1e293b] rounded-2xl p-8 text-center text-gray-500">${t('Please choose a route or adjust your category search filter above.')}</div>`;
                return;
            }

            const now = new Date();
            const isWeekend = now.getDay() === 0 || now.getDay() === 6;
            let departures = [];

            if (routeKey === 'GPS_MODE' && currentGpsPierName) {
                for (const [rKey, r] of Object.entries(scheduleData)) {
                    let matchingPierKey = null;
                    for (const [k, v] of Object.entries(r.piers || {})) {
                        if (v === currentGpsPierName) {
                            matchingPierKey = k;
                            break;
                        }
                    }
                    if (matchingPierKey) {
                        departures.push(...extractDeparturesForRoute(r, matchingPierKey, now, isWeekend));
                    }
                }
            } else if (scheduleData[routeKey]) {
                departures = extractDeparturesForRoute(scheduleData[routeKey], pierKey, now, isWeekend);
            }

            departures.sort((a, b) => a.departureDate - b.departureDate);
            
            if (departures.length === 0) {
                scheduleContainer.innerHTML = `<div class="bg-[#1e293b] rounded-2xl p-8 text-center text-gray-400 font-medium">${t('No more scheduled departures from this pier today.')}</div>`;
                return;
            }

            let newContentHtml = globalWeatherWarningHtml;

            departures.forEach((dep, index) => {
                let countdownDisplay = '';
                let countdownStyle = '';

                if (dep.countdownMins < 0) {
                    countdownDisplay = t('Departed');
                    countdownStyle = 'bg-gray-800 text-gray-500 border-gray-700';
                } else if (dep.countdownMins === 0) {
                    countdownDisplay = t('Boarding Now');
                    countdownStyle = 'bg-red-500/20 text-red-400 border-red-500/30 animate-pulse font-bold';
                } else {
                    const hrs = Math.floor(dep.countdownMins / 60);
                    const mins = dep.countdownMins % 60;
                    countdownDisplay = hrs > 0 ? `${t('In')} ${hrs}${t('h')} ${mins}${t('m')}` : `${t('In')} ${mins} ${t('mins')}`;
                    countdownStyle = dep.countdownMins <= 15 ? 'bg-amber-500/20 text-amber-300 border-amber-500/30 font-bold animate-pulse' : 'bg-[#2dd4bf]/15 text-[#2dd4bf] border-[#2dd4bf]/30 font-semibold';
                }

                // Intuitive Load Factor Symbol System 
                const hour = dep.departureDate.getHours();
                const isPeak = (!isWeekend && ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19))) || (isWeekend && (hour >= 14 && hour <= 18));
                const isMid = hour >= 10 && hour <= 16;
                
                const seatText = isPeak ? 'Elbow to elbow' : (isMid ? 'Seats available' : 'Whole row to yourself');
                const seatEmoji = isPeak ? '🧍' : '💺';
                const queueText = isPeak ? 'Giant queue to exit' : (isMid ? 'Moderate queue to exit' : 'Quick unload on arrival');
                const queueEmoji = isPeak ? '🐌' : '🚶‍♂️';

                // Smart Hide Next Stop if it is identical to Destination
                let nextStopHtml = '';
                if (dep.nextStop !== dep.destination) {
                    nextStopHtml = `<span class="text-[10px] text-gray-400 ml-1 mt-0.5">${t('Next Stop:')} <strong class="text-gray-200 font-semibold">${t(dep.nextStop)} (${dep.nextStopTime})</strong></span>`;
                }
                
                // Auto-pricing contextual extraction directly on card
                let displayFare = '';
                if (dep.routeFares) {
                    let activeFare = isHolidayPricingToday ? dep.routeFares.adultHoliday : dep.routeFares.adultWeekday;
                    if (activeFare !== undefined && activeFare !== null) {
                        let currency = dep.routeFares.currency === 'HKD' ? 'HK$' : (dep.routeFares.currency || 'HK$');
                        displayFare = typeof activeFare === 'string' ? t_fare(activeFare) : `${currency}${Number(activeFare).toFixed(1)}`;
                    }
                }

                newContentHtml += `
                    <div class="bg-[#1e293b] rounded-2xl p-4 sm:p-5 shadow-xl border border-white/10 fade-in" style="animation-delay: ${Math.min(index * 0.03, 0.25)}s">
                        <div class="flex justify-between items-start mb-1 gap-2">
                            <div>
                                <div class="flex items-baseline space-x-2 flex-wrap">
                                    <h2 class="text-4xl font-extrabold text-[#2dd4bf] tracking-tight font-mono">${dep.departureTime}</h2>
                                    <span class="text-lg text-white font-bold">${t('to')} ${t(dep.destination)}</span>
                                </div>
                                <div class="mt-1 flex items-center space-x-2 flex-wrap gap-y-1">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-800 text-teal-300 border border-teal-500/30 uppercase">${t(dep.operator)}</span>
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${dep.vesselType === 'fast' ? 'bg-sky-500/20 text-sky-300 border-sky-500/30' : 'bg-amber-500/20 text-amber-300 border-amber-500/30'} border">
                                        ${dep.vesselType === 'fast' ? '⚡ ' + t('Fast Ferry') : '⛴️ ' + t('Ordinary Ferry') + (dep.cargo ? ' 📦' : '')}
                                    </span>
                                    ${nextStopHtml}
                                </div>
                            </div>
                            <div class="flex flex-col items-end shrink-0">
                                <div class="flex items-center space-x-2 mb-1.5">
                                    ${displayFare ? `<span class="text-base font-extrabold text-white bg-white/5 px-2.5 py-1 rounded-lg border border-white/10 shadow-inner">${displayFare}</span>` : ''}
                                    <div class="px-3 py-1 rounded-xl border text-sm shadow-sm ${countdownStyle}">${countdownDisplay}</div>
                                </div>
                                <div class="text-[11px] text-gray-400 font-medium flex items-center space-x-1">
                                    <span>${t('Arrive')} ${t(dep.destination)}:</span>
                                    <span class="text-gray-100 font-bold font-mono text-sm">${dep.etaDestination}</span>
                                    <span class="text-[#2dd4bf]/70 font-semibold font-mono">(${dep.travelDurationMins}${t('m')})</span>
                                </div>
                            </div>
                        </div>

                        <!-- Minimalist Comfort & Queue Widgets -->
                        <div class="mt-3.5 flex flex-col sm:flex-row items-center gap-2 border-t border-white/5 pt-3">
                            <div class="flex-1 w-full bg-white/5 border border-white/10 rounded-lg p-2.5 flex items-center space-x-2.5">
                                <span class="text-xl leading-none">${seatEmoji}</span>
                                <span class="text-xs font-semibold text-gray-200">${t(seatText)}</span>
                            </div>
                            <div class="flex-1 w-full bg-white/5 border border-white/10 rounded-lg p-2.5 flex items-center space-x-2.5">
                                <span class="text-xl leading-none">${queueEmoji}</span>
                                <span class="text-xs font-semibold text-gray-200">${t(queueText)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            scheduleContainer.innerHTML = newContentHtml;
        }

        function toggleTimetableGrid() {
            if (routeSelect.value === 'GPS_MODE') return alert(t('Please select a specific route to view full timetable.'));
            isTimetableGridOpen = !isTimetableGridOpen;
            document.getElementById('timetableGridContainer').classList.toggle('hidden', !isTimetableGridOpen);
            document.getElementById('scheduleContainer').classList.toggle('hidden', isTimetableGridOpen);
            document.getElementById('viewToggleText').textContent = isTimetableGridOpen ? t("Live Cards View") : t("Timetable");
            if (isTimetableGridOpen) renderTimetableGrid();
        }

        function renderTimetableGrid() {
            const route = scheduleData[routeSelect.value]; 
            if (!route) return;
            document.getElementById('timetableTitle').textContent = `${t(route.name)} - ${t('Full Route Daily Timetable')}`;
            document.getElementById('timetableSubtitle').textContent = `${t('Operated by')} ${t(route.operator)} | ${t('Total Sailings:')} ${route.trips.length}`;
            
            let tableHtml = `<table class="w-full text-left text-xs border-collapse"><thead><tr class="bg-[#0f172a] text-gray-300 border-b border-white/10"><th class="p-2.5 font-bold">#</th><th class="p-2.5 font-bold">${t('Departure')}</th><th class="p-2.5 font-bold">${t('Stops & Route Details')}</th><th class="p-2.5 font-bold">${t('Final Terminus')}</th><th class="p-2.5 font-bold">${t('ETA')}</th></tr></thead><tbody class="divide-y divide-white/5">`;
            route.trips.forEach((trip, idx) => {
                const fStop = trip.stops[0], lStop = trip.stops[trip.stops.length - 1];
                tableHtml += `<tr class="hover:bg-white/5 transition"><td class="p-2.5 text-gray-500 font-mono">${idx + 1}</td><td class="p-2.5 font-bold text-[#2dd4bf] font-mono text-sm">${fStop.t}</td><td class="p-2.5 text-gray-300">${trip.stops.map(s => `${t(route.piers[s.p] \vert{}\vert{} s.p)} (${s.t})`).join(' ➔ ')}</td><td class="p-2.5 font-semibold text-white">${t(route.piers[lStop.p] || lStop.p)}</td><td class="p-2.5 text-gray-300 font-mono">${lStop.t}</td></tr>`;
            });
            document.getElementById('timetableContent').innerHTML = tableHtml + `</tbody></table>`;
        }

        function openFareModal() {
            const route = scheduleData[routeSelect.value]; 
            if (!route || routeSelect.value === 'GPS_MODE') return alert(t('Please select a specific route to view full timetable.'));
            document.getElementById('fareModalRouteTitle').textContent = t(route.name);
            document.getElementById('fareModalOperator').textContent = `${t('Operated by')} ${t(route.operator)}`;
            
            const f = route.fares || {};
            let fHtml = typeof f.adultWeekday === 'number' || f.currency ? 
                `<div class="bg-[#0f172a] rounded-xl border border-white/10 overflow-hidden"><table class="w-full text-left text-xs text-gray-300"><thead class="bg-white/5 border-b border-white/10 text-gray-400"><tr><th class="p-2.5 font-medium">${t('Passenger Type')}</th><th class="p-2.5 font-medium">${t('Mon - Sat')}</th><th class="p-2.5 font-medium">${t('Sun & Holiday')}</th></tr></thead><tbody class="divide-y divide-white/5"><tr class="hover:bg-white/5 transition"><td class="p-2.5 text-white font-semibold">${t('Adult')}</td><td class="p-2.5 text-emerald-400 font-bold">${f.currency || 'HK$'}${Number(f.adultWeekday).toFixed(2)}</td><td class="p-2.5 text-amber-400 font-bold">${f.currency || 'HK$'}${Number(f.adultHoliday).toFixed(2)}</td></tr></tbody></table></div>` : 
                `<div class="bg-[#0f172a] rounded-xl p-3.5 border border-white/10 space-y-2"><div class="flex justify-between text-sm"><span class="text-gray-400">${t('Mondays to Saturdays (Non-Holidays):')}</span><span class="text-emerald-400 font-bold">${t_fare(f.adultWeekday)}</span></div><div class="flex justify-between text-sm"><span class="text-gray-400">${t('Sundays & HK Public Holidays:')}</span><span class="text-amber-400 font-bold">${t_fare(f.adultHoliday)}</span></div></div>`;
            
            document.getElementById('fareModalContent').innerHTML = fHtml;
            document.getElementById('fareModal').classList.remove('hidden');
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
