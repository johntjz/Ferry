<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>Pulse HK - Ferry Network</title>

<!-- Leaflet CSS via CDN -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

<style>
  /* ==========================================
     CSS ZONE 1: VARIABLES & RESET
     ========================================== */
  :root {
    --theme-color: #0d9488; /* Teal 600 */
    --theme-hover: #14b8a6;
    --bg-light: #0b1120;
    --bg-white: #0f172a;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --border-color: #1e293b;
    --accent-blue: #0ea5e9;
    --accent-green: #10b981;
    --accent-orange: #f59e0b;
    --accent-red: #ef4444;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  html { font-size: 16px; transition: font-size 0.2s ease-in-out; }
  html.text-sm { font-size: 14px; } 
  html.text-xs { font-size: 12px; } 

  body {
    background-color: var(--bg-light);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    color-scheme: dark;
  }

  /* ==========================================
     CSS ZONE 2: LAYOUT & VIEWS
     ========================================== */
  .header {
    background-color: var(--theme-color); color: white; padding: 0 12px;
    display: flex; justify-content: center; align-items: center; position: relative;
    z-index: 1001; height: 55px; flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.15rem; font-weight: 700; margin: 0; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-left: 50px; padding-right: 50px; width: 100%; box-sizing: border-box;
  }
  .back-btn {
    position: absolute; left: 4px; top: 0; bottom: 0; width: 44px; display: none;
    align-items: center; justify-content: center; background: none; border: none;
    color: white; font-size: 2.2rem; font-weight: bold; cursor: pointer; padding: 0; z-index: 2; line-height: 1;
  }
  .text-size-btn {
    position: absolute; right: 4px; top: 0; bottom: 0; width: 44px; display: flex;
    align-items: center; justify-content: center; background: none; border: none;
    color: white; font-size: 1.05rem; font-weight: 800; cursor: pointer; padding: 0; z-index: 2;
  }

  /* --- NEW: App Switcher Bar --- */
  .app-switcher {
    background: var(--bg-white);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    height: 44px;
    flex-shrink: 0;
    z-index: 1000;
  }
  .app-switcher-item {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--text-sub);
    font-size: 0.9rem;
    font-weight: 700;
    border-right: 1px solid var(--border-color);
    transition: background 0.2s, color 0.2s;
    border-bottom: 2px solid transparent;
  }
  .app-switcher-item:last-child {
    border-right: none;
  }
  .app-switcher-item.active {
    color: var(--theme-color);
    border-bottom: 2px solid var(--theme-color);
    background: rgba(13, 148, 136, 0.05); /* Soft teal background */
  }
  .app-switcher-item:active:not(.active) {
    background: var(--bg-light);
  }
  /* ------------------------------ */

  .view-container {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    display: none; flex-direction: column; background: var(--bg-light);
  }
  .view-container.active { display: flex; }

  /* ==========================================
     CSS ZONE 3: COMPONENTS (Tabs, Lists, ETAs)
     ========================================== */
  .bottom-tabs {
    background-color: var(--bg-white); border-top: 1px solid var(--border-color);
    display: flex; justify-content: space-around; align-items: center;
    height: 65px; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 1001;
  }
  .tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-sub); flex: 1; height: 100%; cursor: pointer; font-size: 0.75rem; gap: 4px; transition: color 0.2s;
  }
  .tab.active { color: var(--theme-color); font-weight: 700; }
  .tab-icon { font-size: 1.5rem; margin-bottom: 2px; }

  .location-header {
    background: var(--bg-white); padding: 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10;
  }
  .location-text { font-size: 1.1rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
  .refresh-timer { font-size: 1.05rem; color: var(--theme-color); font-weight: 800; font-variant-numeric: tabular-nums; }

  .detail-live-bar {
    background: var(--bg-white); padding: 8px 16px; border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;
    color: var(--text-sub); font-weight: 700; flex-shrink: 0;
  }
  .live-dot-pulse {
    color: var(--accent-blue); display: inline-flex; align-items: center; gap: 6px; font-weight: 800;
  }

  .route-list-item {
    display: flex; padding: 16px; border-bottom: 1px solid var(--border-color);
    align-items: center; gap: 16px; cursor: pointer; background: var(--bg-light); transition: background 0.2s;
  }
  .route-list-item.inactive-route { opacity: 0.85; }
  .route-list-item:active { background: var(--bg-white); }
  
  .route-no-col {
    min-width: 60px; height: 48px; border-radius: 8px; font-size: 0.95rem; font-weight: 900;
    text-align: center; color: white; letter-spacing: 0.5px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  .route-info-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .route-dest { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
  .route-sub { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .route-eta-col { text-align: right; min-width: 80px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; }
  .eta-time { font-size: 1.6rem; font-weight: 900; color: var(--accent-green); font-variant-numeric: tabular-nums; line-height: 1; }
  
  .eta-expanded-container { display: none; flex-direction: column; gap: 0; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .eta-expanded-container.active { display: flex; }
  .eta-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px dashed var(--border-color); }
  .eta-row:last-child { border-bottom: none; }
  .eta-row-left { display: flex; flex-direction: column; gap: 6px; font-size: 1rem; color: var(--text-main); font-weight: 700; }
  .eta-row-sub { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .eta-row-time { font-size: 1.8rem; font-weight: 900; font-variant-numeric: tabular-nums; text-align: right; }

  /* ==========================================
     CSS ZONE 4: SEARCH, MAPS & UTILS
     ========================================== */
  .search-box-container { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; z-index: 10;}
  .search-input {
    width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px;
    font-size: 1.2rem; outline: none; text-align: center; background: var(--bg-light); color: var(--text-main); font-weight: 700;
  }
  .search-input:focus { border-color: var(--theme-color); }
  .region-filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 4px; }
  .region-filters::-webkit-scrollbar { display: none; }
  .region-btn { flex: 0 0 auto; padding: 12px 18px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-light); color: var(--text-sub); font-size: 0.9rem; font-weight: 800; cursor: pointer; text-transform: uppercase; }
  .region-btn.active { background: var(--theme-color); color: white; border-color: var(--theme-color); }

  #map-container { height: 35vh; width: 100%; background: #111; flex-shrink: 0; border-bottom: 1px solid var(--border-color); transition: height 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); }
  #stop-list-container { flex: 1; overflow-y: auto; position: relative; background: var(--bg-light); }
  
  .stop-item { position: relative; padding: 20px 16px 20px 50px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
  .stop-line { position: absolute; left: 28px; top: 0; bottom: 0; width: 4px; z-index: 1; }
  .stop-item:first-child .stop-line { top: 32px; }
  .stop-item:last-child .stop-line { bottom: auto; height: 32px; }
  .stop-dot { position: absolute; left: 20px; top: 22px; width: 20px; height: 20px; border-radius: 50%; background: #aaa; border: 4px solid var(--bg-light); z-index: 2; }
  .stop-item.active-stop .stop-dot { box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.3); }
  .stop-name { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
  .nearest-tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; background: rgba(14,165,233,0.2); color: var(--accent-blue); border: 1px solid rgba(14,165,233,0.4); vertical-align: middle; text-transform: uppercase; }
  
  #global-map-container { flex: 1; width: 100%; background: #111; z-index: 1; position: relative; }
  
  .map-floating-filters {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000;
    display: flex; gap: 6px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(12px);
    padding: 4px; border-radius: 24px; border: 1px solid var(--border-color); box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .map-filter-btn {
    padding: 7px 14px; border-radius: 18px; border: none; background: transparent;
    color: var(--text-sub); font-size: 0.8rem; font-weight: 800; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .map-filter-btn.active { background: var(--theme-color); color: white; }

  .map-bottom-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--bg-white); border-top-left-radius: 20px; border-top-right-radius: 20px; max-height: 70vh; overflow-y: auto; z-index: 1000; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); box-shadow: 0 -4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; }
  .map-bottom-sheet.active { transform: translateY(0); }
  .sheet-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-white); z-index: 2; }
  .sheet-title { font-size: 1.25rem; font-weight: 800; }
  .sheet-close { font-size: 1.5rem; font-weight: bold; color: var(--text-sub); cursor: pointer; background: none; border: none; }
  
  .text-center { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 1.15rem; }
  .init-loader { padding: 80px 20px; text-align: center; }
  
  .occ-pill { padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; color: white; display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .occ-neutral { background: rgba(148, 163, 184, 0.15); color: var(--text-sub); border: 1px solid rgba(148, 163, 184, 0.3); }

  .add-fav-btn { margin: 24px; padding: 20px; background: var(--bg-white); border: 2px dashed var(--border-color); border-radius: 16px; text-align: center; color: var(--accent-blue); font-size: 1.15rem; font-weight: 800; cursor: pointer; transition: background 0.2s; }
  .add-fav-btn:active { background: #1e293b; }
  .del-fav-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; border-radius: 8px; width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }

  .fav-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: flex-end; }
  .fav-modal-content { background: var(--bg-light); width: 100%; height: 90vh; border-top-left-radius: 20px; border-top-right-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
  .fav-modal-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .fav-modal-header h3 { font-size: 1.25rem; font-weight: 800; margin: 0; color: var(--text-main); }
  .fav-modal-close { background: none; border: none; color: var(--text-sub); font-size: 1.8rem; font-weight: bold; cursor: pointer; }
  .fav-modal-search { padding: 16px; background: var(--bg-white); border-bottom: 1px solid var(--border-color); }
  .fav-modal-search input { width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 12px; font-size: 1.2rem; background: var(--bg-light); color: var(--text-main); font-weight: 700; text-align: center; }
  .fav-modal-search input:focus { border-color: var(--theme-color); outline: none; }
  .fav-modal-results { flex: 1; overflow-y: auto; background: var(--bg-light); }

  /* Map Tile Inversion */
  .dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
  .custom-user-icon div { width: 100% !important; height: 100% !important; background: #0ea5e9 !important; border-radius: 50% !important; border: 3px solid white !important; box-shadow: 0 0 12px rgba(0,0,0,0.8) !important; }
  
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body>

<header class="header">
  <button class="back-btn" id="backBtn" onclick="navigateBack()">‹</button>
  <h1 id="headerTitle">Pulse HK</h1>
  <button class="text-size-btn" onclick="toggleTextSize()">aA</button>
</header>

<!-- Transit Suite App Switcher -->
<div class="app-switcher">
  <a href="https://bus-f4c.pages.dev/" class="app-switcher-item">🚌 Bus</a>
  <a href="https://mtr-4uo.pages.dev/" class="app-switcher-item">🚇 MTR</a>
  <div class="app-switcher-item active">⛴️ Ferry</div>
</div>

<!-- Nearby View -->
<main id="view-main" class="view-container active">
  <div class="location-header">
    <div class="location-text" id="mainLocationText"><span style="font-size: 1.4rem;">📍</span> Locating nearest pier...</div>
    <div class="refresh-timer" id="refreshTimerMain">--</div>
  </div>
  
  <div style="padding: 12px 16px; font-size: 0.85rem; font-weight: 800; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); background: var(--bg-white);" id="wxrTelemetry">
     <!-- Telemetry badges inserted here -->
     <span style="font-size:0.8rem; color:var(--text-sub); padding:4px 8px; border:1px solid var(--border-color); border-radius:12px;">WXR Loading...</span>
  </div>
  
  <div id="mainRouteList">
      <div class="init-loader">
          <div style="font-size:1.2rem; color:var(--text-main); font-weight: 700;">Connecting to Ferry Network...</div>
      </div>
  </div>
</main>

<!-- Route (Search) View -->
<main id="view-search" class="view-container">
  <div class="search-box-container">
   <div class="region-filters">
        <button class="region-btn active" id="filter-ALL" onclick="setRegionFilter('ALL')">All Routes</button>
        <button class="region-btn" id="filter-harbour" onclick="setRegionFilter('harbour')">Harbour</button>
        <button class="region-btn" id="filter-islands" onclick="setRegionFilter('islands')">Islands</button>
        <button class="region-btn" id="filter-lamma" onclick="setRegionFilter('lamma')">Lamma</button>
        <button class="region-btn" id="filter-kaito" onclick="setRegionFilter('kaito')">Kaito</button>
        <button class="region-btn" id="filter-macau" onclick="setRegionFilter('macau')">Macau / Reg</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search Route (e.g. Central, Star Ferry)" oninput="renderSearchResults()" autocomplete="off">
  </div>
  <div id="searchResults" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Map View -->
<main id="view-map" class="view-container">
    <div id="global-map-container">
        <!-- Floating filter bar over the map -->
        <div class="map-floating-filters">
            <button class="map-filter-btn active" id="mapFilter-ALL" onclick="setMapFilter('ALL')">All Piers</button>
            <button class="map-filter-btn" id="mapFilter-harbour" onclick="setMapFilter('harbour')">Harbour</button>
            <button class="map-filter-btn" id="mapFilter-islands" onclick="setMapFilter('islands')">Islands</button>
        </div>
    </div>
    <div id="map-bottom-sheet" class="map-bottom-sheet">
        <div class="sheet-header">
            <div class="sheet-title" id="sheet-title">Pier Name</div>
            <button class="sheet-close" onclick="closeMapSheet()">✕</button>
        </div>
        <div id="sheet-route-list"></div>
    </div>
</main>

<!-- Favorites View -->
<main id="view-fav" class="view-container">
  <div class="location-header" style="justify-content:center;">
      <div class="location-text">Favorite Routes</div>
  </div>
  <div id="favList" style="flex:1; overflow-y:auto;"></div>
</main>

<!-- Route Detail View -->
<main id="view-detail" class="view-container">
  <div id="map-container"></div>
  <div class="detail-live-bar" id="detailLiveBar">
    <span class="live-dot-pulse">● TIMETABLE</span>
    <span id="detailLastUpdated">Loading timetables...</span>
  </div>
  <div id="stop-list-container"></div>
</main>

<!-- Bottom Tabs -->
<nav class="bottom-tabs">
  <div class="tab active" onclick="switchTab('main')" id="tab-main"><span class="tab-icon">📍</span><span>Nearby</span></div>
  <div class="tab" onclick="switchTab('search')" id="tab-search"><span class="tab-icon">⛴️</span><span>Routes</span></div>
  <div class="tab" onclick="switchTab('map')" id="tab-map"><span class="tab-icon">🗺️</span><span>Map</span></div>
  <div class="tab" onclick="switchTab('fav')" id="tab-fav"><span class="tab-icon">⭐</span><span>Favorites</span></div>
</nav>

<!-- Favorite Add Modal -->
<div id="fav-modal" class="fav-modal-overlay">
    <div class="fav-modal-content">
        <div class="fav-modal-header">
            <h3>Add New Favorite Route</h3>
            <button class="fav-modal-close" onclick="closeFavModal()">✕</button>
        </div>
        <div class="fav-modal-search">
            <input type="text" id="favSearchInput" placeholder="Search route..." oninput="renderFavSearch()" autocomplete="off">
        </div>
        <div id="favSearchResults" class="fav-modal-results"></div>
    </div>
</div>

window.PulseFerry = {
    scheduleData: {},
    timeToMins: function(tm) {
        if (!tm || typeof tm !== 'string') return 0;
        const parts = tm.split(':');
        return parts.length >= 2 ? Number(parts[0]) * 60 + Number(parts[1]) : 0;
    },
    minsToTime: function(m) {
        if (isNaN(m)) return "00:00";
        const h = Math.floor(m / 60) % 24;
        const min = m % 60;
        return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
    },
    addMins: function(tm, mins) {
        return this.minsToTime(this.timeToMins(tm) + mins);
    },
    generateFrequent: function(p1, p2, startTime, endTime, headwayMins, travelMins) {
        const trips = [];
        let current = this.timeToMins(startTime);
        const end = this.timeToMins(endTime);
        while (current <= end) {
            const timeStr = this.minsToTime(current);
            const arrivalStr = this.addMins(timeStr, travelMins);
            trips.push({ stops: [{ p: p1, t: timeStr }, { p: p2, t: arrivalStr }], duration: travelMins });
            trips.push({ stops: [{ p: p2, t: timeStr }, { p: p1, t: arrivalStr }], duration: travelMins });
            current += headwayMins;
        }
        return trips;
    },
    generateDirectional: function(p1, p2, outbound, inbound, travelMins) {
        const trips = [];
        outbound.forEach(tm => trips.push({ stops: [{ p: p1, t: tm }, { p: p2, t: this.addMins(tm, travelMins) }], duration: travelMins }));
        inbound.forEach(tm => trips.push({ stops: [{ p: p2, t: tm }, { p: p1, t: this.addMins(tm, travelMins) }], duration: travelMins }));
        return trips;
    },
    registerRoute: function(key, data) {
        if (data.trips && !Array.isArray(data.trips)) {
            let normalizedTrips = [];
            for (const [dirKey, departures] of Object.entries(data.trips)) {
                const [p1, p2] = dirKey.split("-");
                departures.forEach(dep => {
                    const duration = dep.duration || 45;
                    const arrivalTime = this.addMins(dep.t, duration);
                    normalizedTrips.push({
                        weekdayOnly: dep.weekdayOnly || false,
                        weekendOnly: dep.weekendOnly || false,
                        vesselType: dep.type || "standard",
                        duration: duration,
                        cargo: dep.cargo || false,
                        stops: [{ p: p1, t: dep.t }, { p: p2, t: arrivalTime }]
                    });
                });
            }
            data.trips = normalizedTrips;
        }
        this.scheduleData[key] = data;
    }
};

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  if (lat1 === 0 || lat2 === 0) return Infinity;
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearestStopIdx(stops, pos) {
    let best = -1, bestD = Infinity;
    stops.forEach((s, i) => {
        const d = calculateDistanceKm(pos.lat, pos.lon, parseFloat(s.latitude), parseFloat(s.longitude));
        if (d < bestD) { bestD = d; best = i; }
    });
    return best;
}

function parseTimeToDate(timeStr) {
    if (!timeStr || typeof timeStr !== 'string') return new Date();
    const parts = timeStr.split(':');
    if (parts.length < 2) return new Date();
    
    const now = new Date();
    let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(parts[0]), Number(parts[1]), 0);
    
    if (now.getTime() - targetDate.getTime() > 12 * 60 * 60 * 1000) targetDate.setDate(targetDate.getDate() + 1);
    else if (targetDate.getTime() - now.getTime() > 20 * 60 * 60 * 1000) targetDate.setDate(targetDate.getDate() - 1);
    
    return targetDate;
}

function buildInternalData() {
    ALL_ROUTES = [];
    const uniquePiers = new Map();
    routeStopsCache = {};
    
    for (const [key, data] of Object.entries(window.PulseFerry.scheduleData || {})) {
        const cat = data.category || 'harbour';
        let colorHex = '#0d9488'; // teal
        if (cat === 'islands') colorHex = '#0ea5e9'; // blue
        else if (cat === 'macau') colorHex = '#a855f7'; // purple
        else if (cat === 'lamma') colorHex = '#84cc16'; // lime
        else if (cat === 'kaito') colorHex = '#f59e0b'; // amber
        
        const routeObj = {
            key: key,
            routeNo: data.name,
            dest_e: data.name,
            company: data.operator,
            network: cat,
            colorHex: colorHex,
            fares: data.fares,
            piers: data.piers,
            trips: data.trips
        };
        ALL_ROUTES.push(routeObj);
        
        const stops = [];
        let seq = 1;
        if (data.piers) {
            for (const [pKey, pName] of Object.entries(data.piers)) {
                const coords = pierCoordinates[pName] || {lat: 22.28, lng: 114.16}; 
                
                stops.push({
                    stopKey: pName,
                    stopName_e: pName,
                    latitude: coords.lat,
                    longitude: coords.lng,
                    seq: seq++
                });
                
                const globalKey = pName; 
                if (!uniquePiers.has(globalKey)) {
                    uniquePiers.set(globalKey, {
                        stopKey: globalKey,
                        stopName_e: pName,
                        latitude: coords.lat,
                        longitude: coords.lng,
                        network: cat,
                        routes: new Set([key])
                    });
                } else {
                    uniquePiers.get(globalKey).routes.add(key);
                }
            }
        }
        routeStopsCache[key] = stops;
    }
    ALL_PIERS = Array.from(uniquePiers.values());
}

async function fetchJSONCached(url) {
    if (requestCache.has(url)) return requestCache.get(url);
    const promise = new Promise(async (resolve) => {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
            clearTimeout(timeoutId);
            if (!response.ok) resolve(null);
            else resolve(await response.json());
        } catch(e) { resolve(null); }
    });
    requestCache.set(url, promise);
    setTimeout(() => requestCache.delete(url), 60000); 
    return promise;
}

async function fetchFerryEtaRaw(group, stopKey) {
    let matchingPierKey = null;
    for (const [k, v] of Object.entries(group.piers)) {
        if (v === stopKey) { matchingPierKey = k; break; }
    }
    if (!matchingPierKey) return [];

    const now = new Date();
    const isWeekend = now.getDay() === 0 || now.getDay() === 6;
    const deps = [];
    const hasFast = group.trips.some(t => t.vesselType === 'fast');
    const hasOrd = group.trips.some(t => t.vesselType === 'ordinary' || !t.vesselType);
    const hasMixedVessels = hasFast && hasOrd;

    group.trips.forEach(trip => {
        if (trip.weekdayOnly && isWeekend) return;
        if (trip.weekendOnly && !isWeekend) return;
        
        const stops = trip.stops;
        if (!stops || stops.length === 0) return;
        
        const pierIndex = stops.findIndex(s => s.p === matchingPierKey);
        if (pierIndex !== -1 && pierIndex < stops.length - 1) {
            const currentStop = stops[pierIndex];
            const nextStop = stops[pierIndex + 1];
            const finalStop = stops[stops.length - 1];

            const departureDate = parseTimeToDate(currentStop.t);
            const diffMinutes = Math.floor((departureDate.getTime() - now.getTime()) / 60000);
            
            if (diffMinutes >= -15 && diffMinutes < 1440) {
                const depMins = window.PulseFerry.timeToMins(currentStop.t);
                const arrMins = window.PulseFerry.timeToMins(finalStop.t);
                
                deps.push({
                    departureDate: departureDate,
                    destName: group.piers[finalStop.p] || finalStop.p,
                    etaDestTime: finalStop.t,
                    mins: diffMinutes,
                    sortTimeMs: diffMinutes * 60000,
                    mainTimeText: diffMinutes <= 0 ? (diffMinutes < 0 ? 'Departed' : 'Boarding') : `${diffMinutes}m`,
                    apiStr: currentStop.t,
                    platText: group.company,
                    vesselType: trip.vesselType || 'ordinary',
                    cargo: trip.cargo || false,
                    hasMixedVessels: hasMixedVessels,
                    travelDurationMins: (arrMins - depMins + 1440) % 1440,
                    fares: group.fares,
                    isScheduled: true
                });
            }
        }
    });

    return deps.sort((a,b) => a.sortTimeMs - b.sortTimeMs);
}

function startGPSTracking() {
    if (!navigator.geolocation || gpsWatcherId) return;
    gpsWatcherId = navigator.geolocation.watchPosition((pos) => {
        lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        updateUserMarkers();
    }, (err) => { console.warn('GPS Watch Error:', err); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
}

function refreshGPS(timeoutMs = 4000) {
    return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(lastKnownPos); return; }
        
        const fallback = setTimeout(() => resolve(lastKnownPos), timeoutMs + 500);
        
        navigator.geolocation.getCurrentPosition((pos) => {
            clearTimeout(fallback);
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            resolve(lastKnownPos);
        }, () => {
            clearTimeout(fallback);
            resolve(lastKnownPos);
        }, { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 10000 });
    });
}

function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            document.getElementById('mainLocationText').innerText = 'GPS Not Supported';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false); 
            return;
        }
        document.getElementById('mainLocationText').innerHTML = '<span style="font-size: 1.4rem;">📍</span> Locating...';
        
        const fallback = setTimeout(() => {
            document.getElementById('mainLocationText').innerText = 'Location Failed';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false);
        }, 5000);

        navigator.geolocation.getCurrentPosition((pos) => {
            clearTimeout(fallback);
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            
            let closest = null, minDistance = Infinity;
            ALL_PIERS.forEach(s => {
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                currentNearestStopKey = closest.stopKey;
                const distNotice = minDistance > 3.0 ? ` (${minDistance.toFixed(1)}km)` : '';
                document.getElementById('mainLocationText').innerHTML = `<span style="font-size: 1.4rem;">📍</span> ${closest.stopName_e}${distNotice}`;
                renderMainNearby();
                if (currentView === 'map' && globalMapInstance) renderGlobalMapStops();
                if (currentView === 'search') renderSearchResults();
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby piers';
                document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="padding-top:40px;">Try searching via the Routes tab.</div>';
            }
            startGPSTracking();
            resolve(true);
        }, () => {
            clearTimeout(fallback);
            document.getElementById('mainLocationText').innerText = 'Location Unavailable';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false);
        }, { enableHighAccuracy: true, timeout: 4500, maximumAge: 10000 });
    });
}

function renderGlobalMapStops() {
    if (!globalMapInstance) return;
    
    globalMarkers.forEach(m => globalMapInstance.removeLayer(m));
    globalMarkers = [];

    const bounds = globalMapInstance.getBounds();
    let candidateStops = ALL_PIERS;
    if (activeMapFilter !== 'ALL') {
        candidateStops = candidateStops.filter(s => s.network === activeMapFilter);
    }

    let visibleStops = candidateStops.filter(s => {
        const lat = parseFloat(s.latitude);
        const lon = parseFloat(s.longitude);
        return bounds.contains([lat, lon]);
    });

    visibleStops.forEach(s => {
        const borderColor = 'var(--theme-color)';
        const stopIcon = L.divIcon({
            className: 'custom-stop-icon',
            html: `<div style="width:16px;height:16px;background:white;border:4px solid ${borderColor};border-radius:50%; box-shadow: 0 0 6px rgba(0,0,0,0.6);"></div>`,
            iconSize: [16, 16]
        });

        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], { icon: stopIcon }).addTo(globalMapInstance);
        marker.on('click', () => {
            globalMapInstance.setView(marker.getLatLng(), Math.max(globalMapInstance.getZoom(), 15), { animate: true });
            openMapSheet(s);
        });
        globalMarkers.push(marker);
    });
}

    if(mapRouteLayer) mapInstance.removeLayer(mapRouteLayer);
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    const stops = routeStopsCache[group.key] || [];
    if(stops.length === 0) return;
    
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    mapRouteLayer = L.polyline(latlngs, {color: group.colorHex, weight: 6, opacity: 0.9}).addTo(mapInstance);
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);
        marker.on('click', () => {
            expandStop(idx);
            document.getElementById(`stop-item-${idx}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        mapMarkers.push(marker);
    });
    
    const bounds = mapRouteLayer.getBounds();
    if(userMarkerDetail && lastKnownPos) { bounds.extend(userMarkerDetail.getLatLng()); }
    mapInstance.fitBounds(bounds, { padding: [40, 40] });
}

function getNearbyRoutes(maxDistanceKm = 3.5, targetNetwork = 'ALL') {
    if (!lastKnownPos || ALL_PIERS.length === 0) return [];

    let eligibleStops = ALL_PIERS;
    if (targetNetwork !== 'ALL') {
        eligibleStops = ALL_PIERS.filter(s => s.network === targetNetwork);
    }
    if (eligibleStops.length === 0) return [];

    const stopsWithDist = eligibleStops.map(s => {
        const dist = calculateDistanceKm(lastKnownPos.lat, lastKnownPos.lon, parseFloat(s.latitude), parseFloat(s.longitude));
        return { stop: s, dist };
    }).sort((a, b) => a.dist - b.dist);

    if (stopsWithDist.length === 0) return [];

    let candidates = stopsWithDist.filter(item => item.dist <= maxDistanceKm);
    if (candidates.length === 0) candidates = stopsWithDist.slice(0, 3); 

    const seenGroupKeys = new Set();
    const result = [];
    candidates.forEach(item => {
        item.stop.routes.forEach(rk => {
            if (!seenGroupKeys.has(rk)) {
                seenGroupKeys.add(rk);
                const g = ALL_ROUTES.find(r => r.key === rk);
                if (g && (targetNetwork === 'ALL' || g.network === targetNetwork)) {
                    result.push({ ...g, nearestDistKm: item.dist, nearestStopName: item.stop.stopName_e });
                }
            }
        });
    });
    return result.sort((a, b) => a.nearestDistKm - b.nearestDistKm);
}

function switchTab(tabId) {
    if (tabId === 'main') {
        mainExpandedGroupKey = null; 
        if (!lastKnownPos) document.getElementById('mainLocationText').innerHTML = '<span style="font-size: 1.4rem;">📍</span> Locating...';
        locateNearestStopPromise();
    }
    currentView = tabId;
    detailRouteGroup = null; 
    detailOpenToken++; 
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('headerTitle').innerText = 'Pulse HK';
    
    if (tabId === 'search') renderSearchResults();
    if (tabId === 'fav') renderFavList();
    if (tabId === 'map') {
        closeMapSheet();
        if (!globalMapInstance) {
            initGlobalMap();
        } else {
            globalMapInstance.invalidateSize();
            renderGlobalMapStops();
        }
    }
}

async function autoSelectNearestStop(token) {
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    if (stops.length === 0) return;

    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);
    if (token !== detailOpenToken) return;

    let bestIdx = 0; 
    if (pos) {
        let foundIdx = findNearestStopIdx(stops, pos);
        if (foundIdx !== -1) bestIdx = foundIdx;
    }
    const nameEl = document.querySelector(`#stop-item-${bestIdx} .stop-name`);
    if (nameEl && pos) {
         nameEl.insertAdjacentHTML('beforeend', `<span class="nearest-tag">Nearest GPS</span>`);
    }
    await expandStop(bestIdx, true);
}

function openRouteDetail(groupKey) {
    const group = ALL_ROUTES.find(g => g.key === groupKey);
    if (!group) return;
    
    previousView = currentView;
    detailRouteGroup = group;
    detailExpandedStopIdx = -1;
    currentView = 'detail';
    const token = ++detailOpenToken;
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-detail').classList.add('active');
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('headerTitle').innerText = group.dest_e;
    
    const updateEl = document.getElementById('detailLastUpdated');
    if (updateEl) updateEl.innerText = 'Locating you...';

    setTimeout(async () => {
        if (token !== detailOpenToken) return;
        if(mapInstance) mapInstance.invalidateSize();
        drawRouteOnMap(group);
        renderStopList();
        
        await autoSelectNearestStop(token);
    }, 250); 
}

function generateExpandedETAsHtml(arrs, groupKey) {
    if (isTyphoonSuspended) {
        return `
        <div style="background:rgba(239, 68, 68, 0.1); border:1px solid rgba(239, 68, 68, 0.3); border-radius:12px; margin: 16px; padding: 20px; text-align:center;">
            <div style="font-size:2rem; margin-bottom:8px;">🌪️</div>
            <h4 style="color:var(--accent-red); margin:0 0 8px 0;">TYPHOON SUSPENSION</h4>
            <p style="color:var(--text-main); font-size:0.85rem; margin:0;">All ferry services are suspended due to ${typhoonSignalName}.</p>
        </div>`;
    }

    if (arrs.length === 0) return '<div style="color:var(--text-sub); text-align:center; padding: 20px;">No more departures today.</div>';
    
    let html = '';
    for(let i = 0; i < Math.min(4, arrs.length); i++) {
        const arr = arrs[i];
        
        let vesselBadge = '';
        if (arr.hasMixedVessels) {
            if (arr.vesselType === 'fast') vesselBadge = `<span class="occ-pill" style="background:rgba(14, 165, 233, 0.15); color:var(--accent-blue); border:1px solid rgba(14, 165, 233, 0.3);">⚡ Fast</span>`;
            else vesselBadge = `<span class="occ-pill" style="background:rgba(245, 158, 11, 0.15); color:var(--accent-orange); border:1px solid rgba(245, 158, 11, 0.3);">⛴️ Ordinary</span>`;
        } else if (arr.cargo) {
            vesselBadge = `<span class="occ-pill occ-neutral">📦 Cargo OK</span>`;
        }

        const hour = arr.departureDate.getHours();
        const isWeekend = arr.departureDate.getDay() === 0 || arr.departureDate.getDay() === 6;
        const isPeak = (!isWeekend && ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19))) || (isWeekend && (hour >= 14 && hour <= 18));
        const isMid = hour >= 10 && hour <= 16;
        const seatText = isPeak ? '15% Seats' : (isMid ? '45% Seats' : '85% Seats');
        const queueText = isPeak ? '5m Q' : (isMid ? '2m Q' : '1m Q');
        let crowdHtml = `<span class="occ-pill occ-neutral">💺 ${seatText}</span> <span class="occ-pill occ-neutral">🚶 ${queueText}</span>`;

        let seaComfortHtml = '';
        if (i < 2) {
            let routeFactor = 1.0;
            if (groupKey.includes('harbour') || groupKey.includes('kaito')) routeFactor = 0.3;
            else if (groupKey.includes('islands') || groupKey.includes('macau') || groupKey.includes('lamma')) routeFactor = 1.25;

            const effectiveWindGusts = currentWindGustsKmh * routeFactor;
            const choppinessPercent = Math.min(100, Math.round((effectiveWindGusts / 70) * 100));

            if (choppinessPercent >= 60) seaComfortHtml = `<span class="occ-pill" style="background:rgba(239, 68, 68, 0.15); color:var(--accent-red); border:1px solid rgba(239, 68, 68, 0.3);">🤢 Rough</span>`;
            else if (choppinessPercent >= 30) seaComfortHtml = `<span class="occ-pill" style="background:rgba(245, 158, 11, 0.15); color:var(--accent-orange); border:1px solid rgba(245, 158, 11, 0.3);">🌊 Choppy</span>`;
            else seaComfortHtml = `<span class="occ-pill" style="background:rgba(16, 185, 129, 0.15); color:var(--accent-green); border:1px solid rgba(16, 185, 129, 0.3);">😌 Calm</span>`;
        }

        let displayFare = '';
        if (arr.fares) {
            let activeFare = isHolidayPricingToday ? arr.fares.adultHoliday : arr.fares.adultWeekday;
            if (activeFare) {
                let currency = arr.fares.currency === 'HKD' ? 'HK$' : (arr.fares.currency || 'HK$');
                if (typeof activeFare === 'string') {
                    if (activeFare.includes('/')) {
                        const parts = activeFare.split('/');
                        let matched = arr.vesselType === 'fast' ? (parts.find(p => p.toLowerCase().includes('fast')) || activeFare) : (parts.find(p => p.toLowerCase().includes('ord') || p.toLowerCase().includes('slow')) || parts[0]);
                        displayFare = matched.replace(/\(fast\)|\(ord\)|\(ordinary\)/ig, '').trim();
                    } else {
                        displayFare = activeFare.replace(/\(fast\)|\(ord\)|\(ordinary\)/ig, '').trim();
                    }
                    if (/^[\d.]+$/.test(displayFare)) displayFare = currency + displayFare;
                } else {
                    displayFare = `${currency}${Number(activeFare).toFixed(1)}`;
                }
            }
        }
        if(displayFare) displayFare = `<span class="occ-pill occ-neutral">${displayFare}</span>`;

        let color = arr.mins <= 0 ? 'var(--accent-orange)' : 'var(--accent-green)';
        let timeLabel = arr.mins <= 0 ? arr.mainTimeText : (arr.mins <= 15 ? `<span style="animation: pulse 2s infinite">${arr.mainTimeText}</span>` : arr.mainTimeText);
        
        html += `
            <div class="eta-row">
                <div class="eta-row-left">
                    <span>To ${arr.destName}</span>
                    <div class="eta-row-sub">
                        <span>${arr.platText}</span>
                        ${vesselBadge}
                        ${displayFare}
                        ${crowdHtml}
                        ${seaComfortHtml}
                    </div>
                </div>
                <div class="eta-row-time" style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;">
                    <div style="color:${color}; font-size:1.5rem;">${timeLabel}</div>
                    <div style="font-size:0.8rem; font-weight:800; color:var(--text-main); margin-top:4px;">Dep. ${arr.apiStr}</div>
                    <div style="font-size:0.75rem; font-weight:700; color:var(--text-sub); margin-top:2px;">Arr. ${arr.etaDestTime}</div>
                </div>
            </div>
        `;
    }
    
    html += `
        <div style="text-align:center; padding:12px; border-top:1px dashed var(--border-color);">
            <a href="mailto:mtrtimehk@gmail.com?subject=Ferry%20Timetable%20Update%20Needed" style="color:var(--text-sub); font-size:0.75rem; text-decoration:none;">📝 Report wrong timetable</a>
        </div>
    `;
    
    return html;
}

        html += `
          <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
              <div class="route-no-col" style="background-color:${g.colorHex}; font-size:0.9rem; line-height:1.2;"><div>${g.network.substring(0,3).toUpperCase()}</div></div>
              <div class="route-info-col"><div class="route-dest">${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

function renderFavList() {
    const listEl = document.getElementById('favList');
    let html = `<div class="add-fav-btn" onclick="openFavModal()">+ Add New Favorite Route</div>`;
    if(favRoutes.length === 0) { listEl.innerHTML = html + '<div class="text-center">No saved routes yet.</div>'; return; }
    
    favRoutes.forEach(k => {
        const g = ALL_ROUTES.find(r => r.key === k);
        if(g) {
            html += `
              <div class="route-list-item" onclick="openRouteDetail('${g.key}')">
                  <div class="route-no-col" style="background-color:${g.colorHex}; font-size:0.9rem; line-height:1.2;"><div>${g.network.substring(0,3).toUpperCase()}</div></div>
                  <div class="route-info-col"><div class="route-dest">${g.dest_e}</div><div class="route-sub">${g.company}</div></div>
                  <button class="del-fav-btn" onclick="event.stopPropagation(); removeFavRoute('${g.key}');">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  </button>
              </div>
            `;
        }
    });
    listEl.innerHTML = html;
}

function removeFavRoute(key) {
    favRoutes = favRoutes.filter(k => k !== key);
    localStorage.setItem('ferry_fav_routes_v1', JSON.stringify(favRoutes));
    renderFavList();
}
function openFavModal() { document.getElementById('fav-modal').style.display = 'flex'; document.getElementById('favSearchInput').value = ''; renderFavSearch(); }
function closeFavModal() { document.getElementById('fav-modal').style.display = 'none'; }

function renderFavSearch() {
    const query = document.getElementById('favSearchInput').value.trim().toLowerCase();
    const listEl = document.getElementById('favSearchResults');
    if(!query) { listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">🔍</div><div class="text-center">Type route name</div>'; return; }

    const matches = ALL_ROUTES.filter(g => g.routeNo.toLowerCase().includes(query) || (g.company && g.company.toLowerCase().includes(query)));
    if(matches.length === 0) { listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">⛴️</div><div class="text-center">No routes found</div>'; return; }
    
    let html = '';
    matches.forEach(g => {
        const isSaved = favRoutes.includes(g.key);
        html += `
          <div class="route-list-item" style="opacity: ${isSaved ? '0.5' : '1'}; pointer-events: ${isSaved ? 'none' : 'auto'};" onclick="addFavFromModal('${g.key}')">
              <div class="route-no-col" style="background-color:${g.colorHex}; font-size:0.9rem; line-height:1.2;"><div>${g.network.substring(0,3).toUpperCase()}</div></div>
              <div class="route-info-col"><div class="route-dest">${g.dest_e}</div><div class="route-sub">${g.company} ${isSaved ? '(Saved)' : ''}</div></div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

function addFavFromModal(key) {
    if(!favRoutes.includes(key)) { favRoutes.push(key); localStorage.setItem('ferry_fav_routes_v1', JSON.stringify(favRoutes)); }
    closeFavModal(); renderFavList();
}

function renderStopList() {
    const listEl = document.getElementById('stop-list-container');
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    let html = '';
    stops.forEach((s, idx) => {
        html += `
            <div class="stop-item" id="stop-item-${idx}" onclick="expandStop(${idx})">
                <div class="stop-line" style="background-color: ${detailRouteGroup.colorHex};"></div>
                <div class="stop-dot" id="stop-dot-${idx}"></div>
                <div class="stop-name">${idx + 1}. ${s.stopName_e}</div>
                <div class="eta-expanded-container" id="detail-eta-expanded-${idx}" style="margin-top: 20px; border-radius:12px;"></div>
            </div>
        `;
    });
    listEl.innerHTML = html;
}

async function expandStop(idx, forceOpen = false) {
    if (detailExpandedStopIdx === idx && !forceOpen) {
        document.getElementById(`detail-eta-expanded-${idx}`).classList.remove('active');
        document.getElementById(`stop-item-${idx}`).classList.remove('active-stop');
        const normalIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
        if (mapMarkers[idx]) mapMarkers[idx].setIcon(normalIcon);
        detailExpandedStopIdx = -1;
        return;
    }
    
    if(detailExpandedStopIdx !== -1) {
        const prevExp = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
        const prevItem = document.getElementById(`stop-item-${detailExpandedStopIdx}`);
        if (prevExp) prevExp.classList.remove('active');
        if (prevItem) prevItem.classList.remove('active-stop');
        if(mapMarkers[detailExpandedStopIdx]) mapMarkers[detailExpandedStopIdx].setIcon(L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] }));
    }
    
    detailExpandedStopIdx = idx;
    const item = document.getElementById(`stop-item-${idx}`);
    const expandContainer = document.getElementById(`detail-eta-expanded-${idx}`);
    if (!item || !expandContainer) return;
    
    item.classList.add('active-stop');
    expandContainer.classList.add('active');
    expandContainer.innerHTML = '<div style="color:var(--text-sub); padding:20px; text-align:center;">Loading times...</div>';
    
    const activeIcon = L.divIcon({ className: 'custom-active-stop-icon', html: `<div style="width:20px;height:20px;background:white;border:6px solid ${detailRouteGroup.colorHex};border-radius:50%;"></div>`, iconSize: [20, 20] });
    if(mapMarkers[idx]) mapMarkers[idx].setIcon(activeIcon);
    
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (mapInstance && mapMarkers[idx]) {
        mapInstance.setView(mapMarkers[idx].getLatLng(), 15, { animate: true });
    }
    
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    const targetStop = stops[idx];
    
    try {
        const arrs = await fetchFerryEtaRaw(detailRouteGroup, targetStop.stopKey);
        if (detailExpandedStopIdx !== idx) return; 
        expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup.key);
        updateDetailTimestamp();
    } catch (e) {
        expandContainer.innerHTML = '<div style="color:#ef4444; text-align:center; padding: 20px;">Network Failed</div>';
    }
}

function startTimer() {
  clearInterval(timerInterval);
  countdown = REFRESH_INTERVAL;
  document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
  
  timerInterval = setInterval(() => {
    if (isSyncing) return;
    countdown--;
    if (countdown <= 0) {
      isSyncing = true;
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimerMain').innerText = '...';
      
      if (currentView === 'main') {
          renderMainNearby(true).then(() => { isSyncing = false; });
      } else if (currentView === 'detail' && detailExpandedStopIdx !== -1) {
          const stops = routeStopsCache[detailRouteGroup.key] || [];
          const targetStop = stops[detailExpandedStopIdx];
          fetchFerryEtaRaw(detailRouteGroup, targetStop.stopKey).then(arrs => {
              const expandContainer = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
              if(expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup.key);
              updateDetailTimestamp();
              isSyncing = false;
          }).catch(() => { isSyncing = false; });
      } else if (currentView === 'map' && sheetExpandedGroupKey) {
          const group = ALL_ROUTES.find(g => g.key === sheetExpandedGroupKey);
          const stopObj = ALL_PIERS.find(s => s.stopName_e === document.getElementById('sheet-title').innerText);
          if(group && stopObj) {
              fetchFerryEtaRaw(group, stopObj.stopKey).then(arrs => {
                 const expandContainer = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`);
                 if (expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, sheetExpandedGroupKey);
                 isSyncing = false;
              }).catch(() => { isSyncing = false; });
          } else { isSyncing = false; }
      } else { isSyncing = false; }
    } else {
      document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
    }
  }, 1000);
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        clearInterval(timerInterval);
        if (gpsWatcherId) { navigator.geolocation.clearWatch(gpsWatcherId); gpsWatcherId = null; }
    } else if (ALL_ROUTES.length > 0) {
        startTimer();
        startGPSTracking();
    }
});

window.onload = initApp;
</script>
