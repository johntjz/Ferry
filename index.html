<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Ferry Live Schedule</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom smooth scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-3 sm:p-6 text-gray-100">

    <!-- Main Header Card -->
    <div class="w-full max-w-2xl bg-[#1e293b] rounded-2xl shadow-2xl overflow-hidden flex flex-col mb-4 ring-1 ring-white/10">

            </div>
            <div id="liveClock" class="text-gray-300 font-mono text-xs sm:text-sm">
                --:--:--
            </div>
        </div>

        <!-- Control Selectors -->
        <div class="p-4 sm:p-6 space-y-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">HK Ferry Schedule</h1>
                <button id="refreshBtn" class="flex items-center space-x-1 text-xs bg-white/5 hover:bg-white/10 text-gray-300 px-3 py-1.5 rounded-lg border border-white/10 transition">

                    <span>Refresh</span>
                </button>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <!-- Select Route (Clean Option Labels Without Operator Names) -->
                <div class="space-y-1.5">
                    <label for="routeSelect" class="text-xs font-medium text-gray-400 uppercase tracking-wide">Ferry Route</label>
                    <div class="relative">
                        <select id="routeSelect" class="w-full appearance-none bg-[#0f172a] border border-white/10 text-white rounded-xl px-3.5 py-2.5 pr-10 focus:outline-none focus:ring-2 focus:ring-[#2dd4bf] focus:border-transparent transition shadow-inner text-sm font-medium">
                            <!-- Options populated via JS -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="pierSelect" class="text-xs font-medium text-gray-400 uppercase tracking-wide">Departure Pier / Station</label>

                    { stops: [{ p: "TO", t: "08:00" }, { p: "SLW", t: "08:18" }, { p: "TC", t: "08:33" }, { p: "TM", t: "08:55" }] },
                    { stops: [{ p: "TO", t: "10:00" }, { p: "SLW", t: "10:18" }, { p: "TC", t: "10:33" }, { p: "TM", t: "10:55" }] },
                    { stops: [{ p: "TO", t: "12:00" }, { p: "SLW", t: "12:18" }, { p: "TC", t: "12:33" }, { p: "TM", t: "12:55" }] },
                    { stops: [{ p: "TO", t: "14:00" }, { p: "SLW", t: "14:18" }, { p: "TC", t: "14:33" }, { p: "TM", t: "14:55" }] },
                    { stops: [{ p: "TO", t: "16:00" }, { p: "SLW", t: "16:18" }, { p: "TC", t: "16:33" }, { p: "TM", t: "16:55" }] },
                    { stops: [{ p: "TO", t: "18:00" }, { p: "SLW", t: "18:18" }, { p: "TC", t: "18:33" }, { p: "TM", t: "18:55" }] }
                ]
            },
            "water-taxi": {
                name: "Water Taxi (Central - TST - Wan Chai)",
                operator: "Fortune Ferry",
                piers: { "CENTRAL": "Central Pier 9", "TST": "TST East", "WANCHAI": "Wan Chai" },
                trips: [
                    { stops: [{ p: "CENTRAL", t: "13:30" }, { p: "TST", t: "13:50" }, { p: "WANCHAI", t: "14:10" }] },
                    { stops: [{ p: "CENTRAL", t: "15:30" }, { p: "TST", t: "15:50" }, { p: "WANCHAI", t: "16:10" }] },
                    { stops: [{ p: "CENTRAL", t: "17:30" }, { p: "TST", t: "17:50" }, { p: "WANCHAI", t: "18:10" }] },
                    { stops: [{ p: "CENTRAL", t: "19:20" }, { p: "TST", t: "19:40" }, { p: "WANCHAI", t: "20:00" }] }
                ]
            },
            "turbojet-macau": {
                name: "Hong Kong - Macau (TurboJET)",
                operator: "TurboJET",
                piers: { "HK": "HK Macau Ferry Terminal (Sheung Wan)", "MACAU": "Macau Outer Harbour" },
                trips: generateBiDirectionalSchedules("HK", "MACAU", [
                    "07:30","08:30","09:30","10:30","11:30","12:30","13:30","14:30","15:30","16:30",
                    "17:30","18:30","19:30","20:30","21:30","22:30","23:30"
                ], 55)
            }
        };

        // Helper generators for full route schedule coverage
        function generateBiDirectionalSchedules(p1, p2, times, travelDurationMins) {
            const trips = [];
            times.forEach(t => {
                // Direction A -> B
                trips.push({ stops: [{ p: p1, t: t }, { p: p2, t: addMinutesToTime(t, travelDurationMins) }] });
                // Direction B -> A
                trips.push({ stops: [{ p: p2, t: t }, { p: p1, t: addMinutesToTime(t, travelDurationMins) }] });
            });
            return trips;
        }

        function generateFrequentSchedules(p1, p2, startTime, endTime, headwayMins, travelMins) {
            const trips = [];
            let current = timeToMinutes(startTime);
            const end = timeToMinutes(endTime);

            while (current <= end) {
                const timeStr = minutesToTime(current);
                trips.push({ stops: [{ p: p1, t: timeStr }, { p: p2, t: addMinutesToTime(timeStr, travelMins) }] });
                trips.push({ stops: [{ p: p2, t: timeStr }, { p: p1, t: addMinutesToTime(timeStr, travelMins) }] });
                current += headwayMins;
            }
            return trips;
        }

        function timeToMinutes(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function minutesToTime(m) {
            const h = Math.floor(m / 60) % 24;
            const min = m % 60;
            return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
        }

        function addMinutesToTime(t, mins) {
            return minutesToTime(timeToMinutes(t) + mins);
        }

        // DOM Handles
        const routeSelect = document.getElementById('routeSelect');
        const pierSelect = document.getElementById('pierSelect');
        const scheduleContainer = document.getElementById('scheduleContainer');
        const liveClock = document.getElementById('liveClock');
        const refreshBtn = document.getElementById('refreshBtn');
        const holidayBanner = document.getElementById('holidayBanner');
        const holidayTitle = document.getElementById('holidayTitle');
        const holidayMessage = document.getElementById('holidayMessage');

        // Application Startup
        function initApp() {
            populateRoutes();
            checkHolidayAndSundayStatus();
            updateLiveClock();

            // Set up real-time tickers
            setInterval(updateLiveClock, 1000);
            setInterval(renderSchedule, 30000); // refresh countdowns every 30s

            // Bind Event Listeners
            routeSelect.addEventListener('change', () => {
                populatePiers();
                renderSchedule();
            });
            pierSelect.addEventListener('change', renderSchedule);
            refreshBtn.addEventListener('click', () => {
                checkHolidayAndSundayStatus();
                renderSchedule();
            });

            // Initial view load
            populatePiers();
            renderSchedule();
        }

        function updateLiveClock() {
            const now = new Date();
            const options = { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            liveClock.textContent = now.toLocaleDateString('en-GB', options);
        }

        // Sunday & Holiday Notice Banner Checker
        function checkHolidayAndSundayStatus() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0]; // YYYY-MM-DD
            const isSunday = now.getDay() === 0;
            const holidayName = HK_PUBLIC_HOLIDAYS[dateStr];

            if (isSunday || holidayName) {
                holidayBanner.classList.remove('hidden');
                if (holidayName) {
                    holidayTitle.textContent = `Public Holiday (${holidayName}):`;
                    holidayMessage.textContent = ` Sunday & Public Holiday fare rates and schedules apply today (${dateStr}).`;
                } else {
                    holidayTitle.textContent = `Sunday Service Notice:`;
                    holidayMessage.textContent = ` Sunday fare rates and holiday sailing schedules apply today.`;
                }
            } else {
                holidayBanner.classList.add('hidden');
            }
        }

        function populateRoutes() {
            routeSelect.innerHTML = '';
            for (const [key, route] of Object.entries(scheduleData)) {
                const option = document.createElement('option');
                option.value = key;
                // CLEAN OPTION TEXT: No company name prefix!
                option.textContent = route.name;
                routeSelect.appendChild(option);
            }
        }

        function populatePiers() {
            const currentRouteKey = routeSelect.value;
            const piers = scheduleData[currentRouteKey].piers;
            
            pierSelect.innerHTML = '';
            for (const [key, name] of Object.entries(piers)) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = `Depart from ${name}`;
                pierSelect.appendChild(option);
            }
        }

        function parseTimeToDate(timeStr) {
            const now = new Date();
            const [hours, minutes] = timeStr.split(':').map(Number);
            let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes, 0);

            // Handle midnight crossover logic
            if (now.getTime() - targetDate.getTime() > 12 * 60 * 60 * 1000) {
                targetDate.setDate(targetDate.getDate() + 1);
            } else if (targetDate.getTime() - now.getTime() > 18 * 60 * 60 * 1000) {
                targetDate.setDate(targetDate.getDate() - 1);
            }

            return targetDate;
        }

        function getDepartures(routeKey, pierKey) {
            const route = scheduleData[routeKey];
            const trips = route.trips;
            const piersMapping = route.piers;
            const departures = [];
            const now = new Date();
            const isWeekend = now.getDay() === 0 || now.getDay() === 6;

            trips.forEach(trip => {
                // Filter weekday/weekend specific trips if needed
                if (trip.weekdayOnly && isWeekend) return;

                const stops = trip.stops;
                // Check if selected pier exists in this trip
                const pierIndex = stops.findIndex(s => s.p === pierKey);

                // Selected pier MUST be in trip and MUST NOT be the final terminus
                if (pierIndex !== -1 && pierIndex < stops.length - 1) {
                    const departureStop = stops[pierIndex];
                    const nextStop = stops[pierIndex + 1];
                    const finalStop = stops[stops.length - 1];

                    const departureDate = parseTimeToDate(departureStop.t);
                    const diffMinutes = Math.floor((departureDate.getTime() - now.getTime()) / 60000);

                    // Show upcoming departures or departures that occurred in the last 10 minutes
                    if (diffMinutes >= -10 && diffMinutes < 1440) {
                        const itinerary = stops.slice(pierIndex).map(s => ({
                            name: piersMapping[s.p],
                            time: s.t
                        }));

                        departures.push({
                            operator: route.operator,
                            departureTime: departureStop.t,
                            departureDate: departureDate,
                            nextStop: piersMapping[nextStop.p],
                            nextStopTime: nextStop.t,
                            destination: piersMapping[finalStop.p],
                            etaDestination: finalStop.t,
                            countdownMins: diffMinutes,
                            itinerary: itinerary
                        });
                    }
                }
            });

            // Return sorted chronologically
            return departures.sort((a, b) => a.departureDate - b.departureDate);
        }

        function renderSchedule() {
            const routeKey = routeSelect.value;
            const pierKey = pierSelect.value;
            const currentRoute = scheduleData[routeKey];
            
            const departures = getDepartures(routeKey, pierKey);
            scheduleContainer.innerHTML = '';

            if (departures.length === 0) {
                scheduleContainer.innerHTML = `
                    <div class="bg-[#1e293b] rounded-2xl p-8 text-center text-gray-400 border border-white/5 fade-in">
                        <svg class="w-10 h-10 mx-auto mb-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="font-medium text-gray-300">No more scheduled departures from this pier today.</p>
                        <p class="text-xs text-gray-500 mt-1">Please check back tomorrow or select another departure pier.</p>
                    </div>
                `;
                return;
            }

            departures.forEach((dep, index) => {
                let countdownDisplay = '';
                let countdownStyle = '';

                if (dep.countdownMins < 0) {
                    countdownDisplay = 'Departed';
                    countdownStyle = 'bg-gray-800 text-gray-400 border-gray-700';
                } else if (dep.countdownMins === 0) {
                    countdownDisplay = 'Boarding';
                    countdownStyle = 'bg-red-500/20 text-red-400 border-red-500/30 animate-pulse font-bold';
                } else {
                    const hrs = Math.floor(dep.countdownMins / 60);
                    const mins = dep.countdownMins % 60;
                    countdownDisplay = hrs > 0 ? `${hrs}h ${mins}m` : `${mins}m`;
                    countdownStyle = dep.countdownMins <= 15 
                        ? 'bg-amber-500/20 text-amber-300 border-amber-500/30 font-bold' 
                        : 'bg-[#2dd4bf]/15 text-[#2dd4bf] border-[#2dd4bf]/30 font-semibold';
                }

                // Render Route Timeline
                let itineraryHtml = '';
                dep.itinerary.forEach((stop, i) => {
                    const isFirst = i === 0;
                    const isLast = i === dep.itinerary.length - 1;

                    itineraryHtml += `
                        <div class="flex flex-col items-center min-w-[70px] relative px-1">
                            <span class="text-[11px] text-gray-400 mb-1 font-medium truncate max-w-[90px] text-center" title="${stop.name}">${stop.name}</span>
                            <div class="flex items-center w-full justify-center relative my-0.5">
                                ${!isFirst ? `<div class="absolute right-[50%] top-1/2 -translate-y-1/2 w-full h-[2px] bg-gradient-to-r from-gray-700 to-[#2dd4bf]/50"></div>` : ''}
                                <div class="w-3 h-3 rounded-full z-10 ${isFirst || isLast ? 'bg-[#2dd4bf] ring-4 ring-[#1e293b]' : 'bg-gray-400 ring-4 ring-[#1e293b]'}"></div>
                            </div>
                            <span class="text-xs ${isFirst ? 'text-[#2dd4bf] font-bold' : 'text-gray-300 font-semibold'} mt-1">${stop.time}</span>
                        </div>
                    `;
                });

                const cardHtml = `
                    <div class="bg-[#1e293b] rounded-2xl p-4 sm:p-5 shadow-lg border border-white/5 fade-in hover:border-white/10 transition-all" style="animation-delay: ${Math.min(index * 0.04, 0.3)}s">
                        
                        <!-- Card Header -->
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <div class="flex items-baseline space-x-2 sm:space-x-3">
                                    <h2 class="text-3xl sm:text-4xl font-extrabold text-[#2dd4bf] tracking-tight">${dep.departureTime}</h2>
                                    <span class="text-base sm:text-lg text-white font-semibold">to ${dep.destination}</span>
                                </div>
                                
                                <div class="mt-1.5 flex items-center space-x-2">
                                    <!-- DISCRETE OPERATOR BADGE -->
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-800 text-teal-300/80 border border-teal-500/20 tracking-wider uppercase">${dep.operator}</span>
                                    <span class="text-xs text-gray-400">Next stop: <strong class="text-gray-200 font-medium">${dep.nextStop} (${dep.nextStopTime})</strong></span>
                                </div>
                            </div>

                            <!-- Countdown & Destination ETA -->
                            <div class="flex flex-col items-end">
                                <div class="px-3 py-1.5 rounded-xl border text-sm shadow-sm ${countdownStyle}">
                                    ${countdownDisplay}
                                </div>
                                <div class="text-[11px] text-gray-400 mt-2 font-medium">
                                    ETA ${dep.destination}: <span class="text-gray-200 font-bold">${dep.etaDestination}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Route Itinerary Section -->
                        <div class="mt-4 pt-3 border-t border-white/5">
                            <div class="flex justify-between items-center w-full overflow-x-auto pb-1 hide-scrollbar">
                                ${itineraryHtml}
                            </div>
                        </div>
                    </div>
                `;
                scheduleContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
