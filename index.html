<!-- Static Schedule Engine Initialization -->
<script>
    window.PulseFerry = {
        scheduleData: {},
        timeToMins: function(tm) {
            if (!tm || typeof tm !== 'string') return 0;
            const parts = tm.split(':');
            return parts.length >= 2 ? Number(parts[0]) * 60 + Number(parts[1]) : 0;
        },
        minsToTime: function(m) {
            if (isNaN(m)) return "00:00";
            const h = Math.floor(m / 60) % 24;
            const min = m % 60;
            return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
        },
        addMins: function(tm, mins) {
            return this.minsToTime(this.timeToMins(tm) + mins);
        },
        generateFrequent: function(p1, p2, startTime, endTime, headwayMins, travelMins) {
            const trips = [];
            let current = this.timeToMins(startTime);
            const end = this.timeToMins(endTime);
            while (current <= end) {
                const timeStr = this.minsToTime(current);
                const arrivalStr = this.addMins(timeStr, travelMins);
                trips.push({ stops: [{ p: p1, t: timeStr }, { p: p2, t: arrivalStr }], duration: travelMins });
                trips.push({ stops: [{ p: p2, t: timeStr }, { p: p1, t: arrivalStr }], duration: travelMins });
                current += headwayMins;
            }
            return trips;
        },
        generateDirectional: function(p1, p2, outbound, inbound, travelMins) {
            const trips = [];
            outbound.forEach(tm => trips.push({ stops: [{ p: p1, t: tm }, { p: p2, t: this.addMins(tm, travelMins) }], duration: travelMins }));
            inbound.forEach(tm => trips.push({ stops: [{ p: p2, t: tm }, { p: p1, t: this.addMins(tm, travelMins) }], duration: travelMins }));
            return trips;
        },
        registerRoute: function(key, data) {
            if (data.trips && !Array.isArray(data.trips)) {
                let normalizedTrips = [];
                for (const [dirKey, departures] of Object.entries(data.trips)) {
                    const [p1, p2] = dirKey.split("-");
                    departures.forEach(dep => {
                        const duration = dep.duration || 45;
                        const arrivalTime = this.addMins(dep.t, duration);
                        normalizedTrips.push({
                            weekdayOnly: dep.weekdayOnly || false,
                            weekendOnly: dep.weekendOnly || false,
                            vesselType: dep.type || "standard",
                            duration: duration,
                            cargo: dep.cargo || false,
                            stops: [{ p: p1, t: dep.t }, { p: p2, t: arrivalTime }]
                        });
                    });
                }
                data.trips = normalizedTrips;
            }
            this.scheduleData[key] = data;
        }
    };
</script>

function calculateDistanceKm(lat1, lon1, lat2, lon2) {
  if (lat1 === 0 || lat2 === 0) return Infinity;
  const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearestStopIdx(stops, pos) {
    let best = -1, bestD = Infinity;
    stops.forEach((s, i) => {
        const d = calculateDistanceKm(pos.lat, pos.lon, parseFloat(s.latitude), parseFloat(s.longitude));
        if (d < bestD) { bestD = d; best = i; }
    });
    return best;
}

function parseTimeToDate(timeStr) {
    if (!timeStr || typeof timeStr !== 'string') return new Date();
    const parts = timeStr.split(':');
    if (parts.length < 2) return new Date();
    
    const now = new Date();
    let targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(parts[0]), Number(parts[1]), 0);
    
    if (now.getTime() - targetDate.getTime() > 12 * 60 * 60 * 1000) targetDate.setDate(targetDate.getDate() + 1);
    else if (targetDate.getTime() - now.getTime() > 20 * 60 * 60 * 1000) targetDate.setDate(targetDate.getDate() - 1);
    
    return targetDate;
}

function buildInternalData() {
    ALL_ROUTES = [];
    const uniquePiers = new Map();
    routeStopsCache = {};
    
    for (const [key, data] of Object.entries(window.PulseFerry.scheduleData || {})) {
        const cat = data.category || 'harbour';
        let colorHex = '#0d9488'; // teal
        if (cat === 'islands') colorHex = '#0ea5e9'; // blue
        else if (cat === 'macau') colorHex = '#a855f7'; // purple
        else if (cat === 'lamma') colorHex = '#84cc16'; // lime
        else if (cat === 'kaito') colorHex = '#f59e0b'; // amber
        
        const routeObj = {
            key: key,
            routeNo: data.name,
            dest_e: data.name,
            company: data.operator,
            network: cat,
            colorHex: colorHex,
            fares: data.fares,
            piers: data.piers,
            trips: data.trips
        };
        ALL_ROUTES.push(routeObj);
        
        const stops = [];
        let seq = 1;
        if (data.piers) {
            for (const [pKey, pName] of Object.entries(data.piers)) {
                const coords = pierCoordinates[pName] || {lat: 22.28, lng: 114.16}; // Fallback
                
                stops.push({
                    stopKey: pName,
                    stopName_e: pName,
                    latitude: coords.lat,
                    longitude: coords.lng,
                    seq: seq++
                });
                
                const globalKey = pName; 
                if (!uniquePiers.has(globalKey)) {
                    uniquePiers.set(globalKey, {
                        stopKey: globalKey,
                        stopName_e: pName,
                        latitude: coords.lat,
                        longitude: coords.lng,
                        network: cat,
                        routes: new Set([key])
                    });
                } else {
                    uniquePiers.get(globalKey).routes.add(key);
                }
            }
        }
        routeStopsCache[key] = stops;
    }
    ALL_PIERS = Array.from(uniquePiers.values());
}

async function fetchJSONCached(url) {
    if (requestCache.has(url)) return requestCache.get(url);
    const promise = new Promise(async (resolve) => {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
            const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
            clearTimeout(timeoutId);
            if (!response.ok) resolve(null);
            else resolve(await response.json());
        } catch(e) { resolve(null); }
    });
    requestCache.set(url, promise);
    setTimeout(() => requestCache.delete(url), 60000); 
    return promise;
}

async function fetchFerryEtaRaw(group, stopKey) {
    let matchingPierKey = null;
    for (const [k, v] of Object.entries(group.piers)) {
        if (v === stopKey) { matchingPierKey = k; break; }
    }
    if (!matchingPierKey) return [];

    const now = new Date();
    const isWeekend = now.getDay() === 0 || now.getDay() === 6;
    const deps = [];
    const hasFast = group.trips.some(t => t.vesselType === 'fast');
    const hasOrd = group.trips.some(t => t.vesselType === 'ordinary' || !t.vesselType);
    const hasMixedVessels = hasFast && hasOrd;

    group.trips.forEach(trip => {
        if (trip.weekdayOnly && isWeekend) return;
        if (trip.weekendOnly && !isWeekend) return;
        
        const stops = trip.stops;
        if (!stops || stops.length === 0) return;
        
        const pierIndex = stops.findIndex(s => s.p === matchingPierKey);
        if (pierIndex !== -1 && pierIndex < stops.length - 1) {
            const currentStop = stops[pierIndex];
            const nextStop = stops[pierIndex + 1];
            const finalStop = stops[stops.length - 1];

            const departureDate = parseTimeToDate(currentStop.t);
            const diffMinutes = Math.floor((departureDate.getTime() - now.getTime()) / 60000);
            
            if (diffMinutes >= -15 && diffMinutes < 1440) {
                const depMins = window.PulseFerry.timeToMins(currentStop.t);
                const arrMins = window.PulseFerry.timeToMins(finalStop.t);
                
                deps.push({
                    departureDate: departureDate,
                    destName: group.piers[finalStop.p] || finalStop.p,
                    etaDestTime: finalStop.t,
                    mins: diffMinutes,
                    sortTimeMs: diffMinutes * 60000,
                    mainTimeText: diffMinutes <= 0 ? (diffMinutes < 0 ? 'Departed' : 'Boarding') : `${diffMinutes}m`,
                    apiStr: currentStop.t,
                    platText: group.company,
                    vesselType: trip.vesselType || 'ordinary',
                    cargo: trip.cargo || false,
                    hasMixedVessels: hasMixedVessels,
                    travelDurationMins: (arrMins - depMins + 1440) % 1440,
                    fares: group.fares,
                    isScheduled: true
                });
            }
        }
    });

    return deps.sort((a,b) => a.sortTimeMs - b.sortTimeMs);
}

function makeUserIcon() {
    return L.divIcon({ className: 'custom-user-icon', html: '<div></div>', iconSize: [22, 22] });

function updateUserMarkers() {
    if (!lastKnownPos) return;
    const icon = makeUserIcon();
    if (mapInstance) {
        if (!userMarkerDetail) userMarkerDetail = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(mapInstance);
        else userMarkerDetail.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
    }
    if (globalMapInstance) {
        if (!userMarkerGlobal) userMarkerGlobal = L.marker([lastKnownPos.lat, lastKnownPos.lon], {icon, zIndexOffset: 1000}).addTo(globalMapInstance);
        else userMarkerGlobal.setLatLng([lastKnownPos.lat, lastKnownPos.lon]);
    }
}

function startGPSTracking() {
    if (!navigator.geolocation || gpsWatcherId) return;
    gpsWatcherId = navigator.geolocation.watchPosition((pos) => {
        lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        updateUserMarkers();
    }, (err) => { console.warn('GPS Watch Error:', err); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
}

function refreshGPS(timeoutMs = 4000) {
    return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(lastKnownPos); return; }
        
        const fallback = setTimeout(() => resolve(lastKnownPos), timeoutMs + 500);
        
        navigator.geolocation.getCurrentPosition((pos) => {
            clearTimeout(fallback);
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            resolve(lastKnownPos);
        }, () => {
            clearTimeout(fallback);
            resolve(lastKnownPos);
        }, { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 10000 });
    });
}

function locateNearestStopPromise() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            document.getElementById('mainLocationText').innerText = 'GPS Not Supported';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false); 
            return;
        }
        document.getElementById('mainLocationText').innerHTML = '<span style="font-size: 1.4rem;">📍</span> Locating...';
        
        const fallback = setTimeout(() => {
            document.getElementById('mainLocationText').innerText = 'Location Failed';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false);
        }, 5000);

        navigator.geolocation.getCurrentPosition((pos) => {
            clearTimeout(fallback);
            lastKnownPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            updateUserMarkers();
            
            let closest = null, minDistance = Infinity;
            ALL_PIERS.forEach(s => {
                const d = calculateDistanceKm(pos.coords.latitude, pos.coords.longitude, parseFloat(s.latitude), parseFloat(s.longitude));
                if (d < minDistance) { minDistance = d; closest = s; }
            });

            if (closest) {
                currentNearestStopKey = closest.stopKey;
                const distNotice = minDistance > 3.0 ? ` (${minDistance.toFixed(1)}km)` : '';
                document.getElementById('mainLocationText').innerHTML = `<span style="font-size: 1.4rem;">📍</span> ${closest.stopName_e}${distNotice}`;
                renderMainNearby();
                if (currentView === 'map' && globalMapInstance) renderGlobalMapStops();
                if (currentView === 'search') renderSearchResults();
            } else {
                document.getElementById('mainLocationText').innerText = 'No nearby piers';
                document.getElementById('mainRouteList').innerHTML = '<div class="text-center" style="padding-top:40px;">Try searching via the Routes tab.</div>';
            }
            startGPSTracking();
            resolve(true);
        }, () => {
            clearTimeout(fallback);
            document.getElementById('mainLocationText').innerText = 'Location Unavailable';
            renderMainNearby(); 
            if (currentView === 'search') renderSearchResults();
            resolve(false);
        }, { enableHighAccuracy: true, timeout: 4500, maximumAge: 10000 });
    });
}

async function recenterMap(mapType) {
    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);
    if (!pos) return;
    
    if (mapType === 'detail' && mapInstance) {

    } else if (mapType === 'global' && globalMapInstance) {

function renderGlobalMapStops() {
    if (!globalMapInstance) return;
    
    globalMarkers.forEach(m => globalMapInstance.removeLayer(m));
    globalMarkers = [];

    const bounds = globalMapInstance.getBounds();
    let candidateStops = ALL_PIERS;
    if (activeMapFilter !== 'ALL') {
        candidateStops = candidateStops.filter(s => s.network === activeMapFilter);
    }

    let visibleStops = candidateStops.filter(s => {
        const lat = parseFloat(s.latitude);
        const lon = parseFloat(s.longitude);
        return bounds.contains([lat, lon]);
    });

    visibleStops.forEach(s => {
        const borderColor = 'var(--theme-color)';
        const stopIcon = L.divIcon({
            className: 'custom-stop-icon',
            html: `<div style="width:16px;height:16px;background:white;border:4px solid ${borderColor};border-radius:50%; box-shadow: 0 0 6px rgba(0,0,0,0.6);"></div>`,
            iconSize: [16, 16]

        marker.on('click', () => {
            globalMapInstance.setView(marker.getLatLng(), Math.max(globalMapInstance.getZoom(), 15), { animate: true });
            openMapSheet(s);
        });
        globalMarkers.push(marker);
    });
}

function drawRouteOnMap(group) {
    if(!mapInstance) return;
    if(mapRouteLayer) mapInstance.removeLayer(mapRouteLayer);
    mapMarkers.forEach(m => mapInstance.removeLayer(m));
    mapMarkers = [];
    
    const stops = routeStopsCache[group.key] || [];
    if(stops.length === 0) return;
    
    const latlngs = stops.map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
    mapRouteLayer = L.polyline(latlngs, {color: group.colorHex, weight: 6, opacity: 0.9}).addTo(mapInstance);
    const stopIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
    
    stops.forEach((s, idx) => {
        const marker = L.marker([parseFloat(s.latitude), parseFloat(s.longitude)], {icon: stopIcon}).addTo(mapInstance);

            expandStop(idx);

    const bounds = mapRouteLayer.getBounds();
    if(userMarkerDetail && lastKnownPos) { bounds.extend(userMarkerDetail.getLatLng()); }

}

function getNearbyRoutes(maxDistanceKm = 3.5, targetNetwork = 'ALL') {
    if (!lastKnownPos || ALL_PIERS.length === 0) return [];

    let eligibleStops = ALL_PIERS;
    if (targetNetwork !== 'ALL') {
        eligibleStops = ALL_PIERS.filter(s => s.network === targetNetwork);
    }
    if (eligibleStops.length === 0) return [];

    const stopsWithDist = eligibleStops.map(s => {
        const dist = calculateDistanceKm(lastKnownPos.lat, lastKnownPos.lon, parseFloat(s.latitude), parseFloat(s.longitude));
        return { stop: s, dist };
    }).sort((a, b) => a.dist - b.dist);

    if (stopsWithDist.length === 0) return [];

    let candidates = stopsWithDist.filter(item => item.dist <= maxDistanceKm);
    if (candidates.length === 0) candidates = stopsWithDist.slice(0, 3); 

    const seenGroupKeys = new Set();
    const result = [];
    candidates.forEach(item => {
        item.stop.routes.forEach(rk => {
            if (!seenGroupKeys.has(rk)) {
                seenGroupKeys.add(rk);
                const g = ALL_ROUTES.find(r => r.key === rk);
                if (g && (targetNetwork === 'ALL' || g.network === targetNetwork)) {
                    result.push({ ...g, nearestDistKm: item.dist, nearestStopName: item.stop.stopName_e });
                }
            }
        });
    });
    return result.sort((a, b) => a.nearestDistKm - b.nearestDistKm);
}

function switchTab(tabId) {
    if (tabId === 'main') {
        mainExpandedGroupKey = null; 
        if (!lastKnownPos) document.getElementById('mainLocationText').innerHTML = '<span style="font-size: 1.4rem;">📍</span> Locating...';
        locateNearestStopPromise();
    }
    currentView = tabId;
    detailRouteGroup = null; 
    detailOpenToken++; 
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(`view-${tabId}`).classList.add('active');
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('headerTitle').innerText = 'Pulse HK';
    
    if (tabId === 'search') renderSearchResults();
    if (tabId === 'fav') renderFavList();
    if (tabId === 'map') {
        closeMapSheet();
        if (!globalMapInstance) {
            initGlobalMap();
        } else {
            globalMapInstance.invalidateSize();
            renderGlobalMapStops();
        }
    }
}

async function autoSelectNearestStop(token) {
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    if (stops.length === 0) return;

    let pos = lastKnownPos;
    if (!pos) pos = await refreshGPS(2000);
    if (token !== detailOpenToken) return;

    let bestIdx = 0; 
    if (pos) {
        let foundIdx = findNearestStopIdx(stops, pos);
        if (foundIdx !== -1) bestIdx = foundIdx;
    }
    const nameEl = document.querySelector(`#stop-item-${bestIdx} .stop-name`);
    if (nameEl && pos) {
         nameEl.insertAdjacentHTML('beforeend', `<span class="nearest-tag">Nearest GPS</span>`);
    }
    await expandStop(bestIdx, true);
}

function openRouteDetail(groupKey) {
    const group = ALL_ROUTES.find(g => g.key === groupKey);
    if (!group) return;
    
    previousView = currentView;
    detailRouteGroup = group;
    detailExpandedStopIdx = -1;
    currentView = 'detail';
    const token = ++detailOpenToken;
    
    document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
    document.getElementById('view-detail').classList.add('active');
    document.getElementById('backBtn').style.display = 'flex';
    document.getElementById('headerTitle').innerText = group.dest_e;
    
    const updateEl = document.getElementById('detailLastUpdated');
    if (updateEl) updateEl.innerText = 'Locating you...';

    setTimeout(async () => {
        if (token !== detailOpenToken) return;
        if(mapInstance) mapInstance.invalidateSize();
        drawRouteOnMap(group);
        renderStopList();
        
        await autoSelectNearestStop(token);
    }, 250); 
}

function generateExpandedETAsHtml(arrs, groupKey) {
    if (isTyphoonSuspended) {
        return `
        <div style="background:rgba(239, 68, 68, 0.1); border:1px solid rgba(239, 68, 68, 0.3); border-radius:12px; margin: 16px; padding: 20px; text-align:center;">
            <div style="font-size:2rem; margin-bottom:8px;">🌪️</div>
            <h4 style="color:var(--accent-red); margin:0 0 8px 0;">TYPHOON SUSPENSION</h4>
            <p style="color:var(--text-main); font-size:0.85rem; margin:0;">All ferry services are suspended due to ${typhoonSignalName}.</p>
        </div>`;
    }

    if (arrs.length === 0) return '<div style="color:var(--text-sub); text-align:center; padding: 20px;">No more departures today.</div>';
    
    let html = '';
    for(let i = 0; i < Math.min(4, arrs.length); i++) {
        const arr = arrs[i];
        
        let vesselBadge = '';
        if (arr.hasMixedVessels) {
            if (arr.vesselType === 'fast') vesselBadge = `<span class="occ-pill" style="background:rgba(14, 165, 233, 0.15); color:var(--accent-blue); border:1px solid rgba(14, 165, 233, 0.3);">⚡ Fast</span>`;
            else vesselBadge = `<span class="occ-pill" style="background:rgba(245, 158, 11, 0.15); color:var(--accent-orange); border:1px solid rgba(245, 158, 11, 0.3);">⛴️ Ordinary</span>`;
        } else if (arr.cargo) {
            vesselBadge = `<span class="occ-pill occ-neutral">📦 Cargo OK</span>`;
        }

        // Add Seats and Queue logic
        const hour = arr.departureDate.getHours();
        const isWeekend = arr.departureDate.getDay() === 0 || arr.departureDate.getDay() === 6;
        const isPeak = (!isWeekend && ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19))) || (isWeekend && (hour >= 14 && hour <= 18));
        const isMid = hour >= 10 && hour <= 16;
        const seatText = isPeak ? '15% Seats' : (isMid ? '45% Seats' : '85% Seats');
        const queueText = isPeak ? '5m Q' : (isMid ? '2m Q' : '1m Q');
        let crowdHtml = `<span class="occ-pill occ-neutral">💺 ${seatText}</span> <span class="occ-pill occ-neutral">🚶 ${queueText}</span>`;

        let seaComfortHtml = '';
        if (i < 2) {
            let routeFactor = 1.0;
            if (groupKey.includes('harbour') || groupKey.includes('kaito')) routeFactor = 0.3;
            else if (groupKey.includes('islands') || groupKey.includes('macau') || groupKey.includes('lamma')) routeFactor = 1.25;

            const effectiveWindGusts = currentWindGustsKmh * routeFactor;
            const choppinessPercent = Math.min(100, Math.round((effectiveWindGusts / 70) * 100));

            if (choppinessPercent >= 60) seaComfortHtml = `<span class="occ-pill" style="background:rgba(239, 68, 68, 0.15); color:var(--accent-red); border:1px solid rgba(239, 68, 68, 0.3);">🤢 Rough</span>`;
            else if (choppinessPercent >= 30) seaComfortHtml = `<span class="occ-pill" style="background:rgba(245, 158, 11, 0.15); color:var(--accent-orange); border:1px solid rgba(245, 158, 11, 0.3);">🌊 Choppy</span>`;
            else seaComfortHtml = `<span class="occ-pill" style="background:rgba(16, 185, 129, 0.15); color:var(--accent-green); border:1px solid rgba(16, 185, 129, 0.3);">😌 Calm</span>`;
        }

        let displayFare = '';
        if (arr.fares) {
            let activeFare = isHolidayPricingToday ? arr.fares.adultHoliday : arr.fares.adultWeekday;
            if (activeFare) {
                let currency = arr.fares.currency === 'HKD' ? 'HK$' : (arr.fares.currency || 'HK$');
                if (typeof activeFare === 'string') {
                    if (activeFare.includes('/')) {
                        const parts = activeFare.split('/');
                        let matched = arr.vesselType === 'fast' ? (parts.find(p => p.toLowerCase().includes('fast')) || activeFare) : (parts.find(p => p.toLowerCase().includes('ord') || p.toLowerCase().includes('slow')) || parts[0]);
                        displayFare = matched.replace(/\(fast\)|\(ord\)|\(ordinary\)/ig, '').trim();
                    } else {
                        displayFare = activeFare.replace(/\(fast\)|\(ord\)|\(ordinary\)/ig, '').trim();
                    }
                    if (/^[\d.]+$/.test(displayFare)) displayFare = currency + displayFare;
                } else {
                    displayFare = `${currency}${Number(activeFare).toFixed(1)}`;
                }
            }
        }
        if(displayFare) displayFare = `<span class="occ-pill occ-neutral">${displayFare}</span>`;

        let color = arr.mins <= 0 ? 'var(--accent-orange)' : 'var(--accent-green)';
        let timeLabel = arr.mins <= 0 ? arr.mainTimeText : (arr.mins <= 15 ? `<span style="animation: pulse 2s infinite">${arr.mainTimeText}</span>` : arr.mainTimeText);
        
        html += `
            <div class="eta-row">
                <div class="eta-row-left">
                    <span>To ${arr.destName}</span>
                    <div class="eta-row-sub">
                        <span>${arr.platText}</span>
                        ${vesselBadge}
                        ${displayFare}
                        ${crowdHtml}
                        ${seaComfortHtml}
                    </div>
                </div>
                <div class="eta-row-time" style="display:flex; flex-direction:column; align-items:flex-end; line-height:1.1;">
                    <div style="color:${color}; font-size:1.5rem;">${timeLabel}</div>
                    <div style="font-size:0.75rem; font-weight:700; color:var(--text-sub); margin-top:4px;">Arr. ${arr.etaDestTime}</div>
                </div>
            </div>
        `;
    }
    
    html += `
        <div style="text-align:center; padding:12px; border-top:1px dashed var(--border-color);">
            <a href="mailto:mtrtimehk@gmail.com?subject=Ferry%20Timetable%20Update%20Needed" style="color:var(--text-sub); font-size:0.75rem; text-decoration:none;">📝 Report wrong timetable</a>
        </div>
    `;
    
    return html;
}

    if(!query) { listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">🔍</div><div class="text-center">Type route name</div>'; return; }

    const matches = ALL_ROUTES.filter(g => g.routeNo.toLowerCase().includes(query) || (g.company && g.company.toLowerCase().includes(query)));
    if(matches.length === 0) { listEl.innerHTML = '<div class="text-center" style="padding-top:40px; font-size:3rem; opacity:0.2;">⛴️</div><div class="text-center">No routes found</div>'; return; }
    
    let html = '';
    matches.forEach(g => {
        const isSaved = favRoutes.includes(g.key);
        html += `
          <div class="route-list-item" style="opacity: ${isSaved ? '0.5' : '1'}; pointer-events: ${isSaved ? 'none' : 'auto'};" onclick="addFavFromModal('${g.key}')">
              <div class="route-no-col" style="background-color:${g.colorHex}; font-size:0.9rem; line-height:1.2;"><div>${g.network.substring(0,3).toUpperCase()}</div></div>
              <div class="route-info-col"><div class="route-dest">${g.dest_e}</div><div class="route-sub">${g.company} ${isSaved ? '(Saved)' : ''}</div></div>
          </div>
        `;
    });
    listEl.innerHTML = html;
}

function addFavFromModal(key) {
    if(!favRoutes.includes(key)) { favRoutes.push(key); localStorage.setItem('ferry_fav_routes_v1', JSON.stringify(favRoutes)); }
    closeFavModal(); renderFavList();
}

function renderStopList() {
    const listEl = document.getElementById('stop-list-container');
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    let html = '';
    stops.forEach((s, idx) => {
        html += `
            <div class="stop-item" id="stop-item-${idx}" onclick="expandStop(${idx})">
                <div class="stop-line" style="background-color: ${detailRouteGroup.colorHex};"></div>
                <div class="stop-dot" id="stop-dot-${idx}"></div>
                <div class="stop-name">${idx + 1}. ${s.stopName_e}</div>
                <div class="eta-expanded-container" id="detail-eta-expanded-${idx}" style="margin-top: 20px; border-radius:12px;"></div>
            </div>
        `;
    });
    listEl.innerHTML = html;
}

async function expandStop(idx, forceOpen = false) {
    if (detailExpandedStopIdx === idx && !forceOpen) {
        document.getElementById(`detail-eta-expanded-${idx}`).classList.remove('active');
        document.getElementById(`stop-item-${idx}`).classList.remove('active-stop');
        const normalIcon = L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] });
        if (mapMarkers[idx]) mapMarkers[idx].setIcon(normalIcon);
        detailExpandedStopIdx = -1;
        return;
    }
    
    if(detailExpandedStopIdx !== -1) {
        const prevExp = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
        const prevItem = document.getElementById(`stop-item-${detailExpandedStopIdx}`);
        if (prevExp) prevExp.classList.remove('active');
        if (prevItem) prevItem.classList.remove('active-stop');
        if(mapMarkers[detailExpandedStopIdx]) mapMarkers[detailExpandedStopIdx].setIcon(L.divIcon({ className: 'custom-stop-icon', html: '<div style="width:14px;height:14px;background:white;border:3px solid #333;border-radius:50%;"></div>', iconSize: [14, 14] }));
    }
    
    detailExpandedStopIdx = idx;
    const item = document.getElementById(`stop-item-${idx}`);
    const expandContainer = document.getElementById(`detail-eta-expanded-${idx}`);
    if (!item || !expandContainer) return;
    
    item.classList.add('active-stop');
    expandContainer.classList.add('active');
    expandContainer.innerHTML = '<div style="color:var(--text-sub); padding:20px; text-align:center;">Loading times...</div>';
    
    const activeIcon = L.divIcon({ className: 'custom-active-stop-icon', html: `<div style="width:20px;height:20px;background:white;border:6px solid ${detailRouteGroup.colorHex};border-radius:50%;"></div>`, iconSize: [20, 20] });
    if(mapMarkers[idx]) mapMarkers[idx].setIcon(activeIcon);
    
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (mapInstance && mapMarkers[idx]) {
        mapInstance.setView(mapMarkers[idx].getLatLng(), 15, { animate: true });
    }
    
    const stops = routeStopsCache[detailRouteGroup.key] || [];
    const targetStop = stops[idx];
    
    try {
        const arrs = await fetchFerryEtaRaw(detailRouteGroup, targetStop.stopKey);
        if (detailExpandedStopIdx !== idx) return; 
        expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup.key);
        updateDetailTimestamp();
    } catch (e) {
        expandContainer.innerHTML = '<div style="color:#ef4444; text-align:center; padding: 20px;">Network Failed</div>';
    }
}

function startTimer() {
  clearInterval(timerInterval);
  countdown = REFRESH_INTERVAL;
  document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
  
  timerInterval = setInterval(() => {
    if (isSyncing) return;
    countdown--;
    if (countdown <= 0) {
      isSyncing = true;
      countdown = REFRESH_INTERVAL;
      document.getElementById('refreshTimerMain').innerText = '...';
      
      if (currentView === 'main') {
          renderMainNearby(true).then(() => { isSyncing = false; });
      } else if (currentView === 'detail' && detailExpandedStopIdx !== -1) {
          const stops = routeStopsCache[detailRouteGroup.key] || [];
          const targetStop = stops[detailExpandedStopIdx];
          fetchFerryEtaRaw(detailRouteGroup, targetStop.stopKey).then(arrs => {
              const expandContainer = document.getElementById(`detail-eta-expanded-${detailExpandedStopIdx}`);
              if(expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, detailRouteGroup.key);
              updateDetailTimestamp();
              isSyncing = false;
          }).catch(() => { isSyncing = false; });
      } else if (currentView === 'map' && sheetExpandedGroupKey) {
          const group = ALL_ROUTES.find(g => g.key === sheetExpandedGroupKey);
          const stopObj = ALL_PIERS.find(s => s.stopName_e === document.getElementById('sheet-title').innerText);
          if(group && stopObj) {
              fetchFerryEtaRaw(group, stopObj.stopKey).then(arrs => {
                 const expandContainer = document.getElementById(`sheet-eta-expanded-${sheetExpandedGroupKey}`);
                 if (expandContainer) expandContainer.innerHTML = generateExpandedETAsHtml(arrs, sheetExpandedGroupKey);
                 isSyncing = false;
              }).catch(() => { isSyncing = false; });
          } else { isSyncing = false; }
      } else { isSyncing = false; }
    } else {
      document.getElementById('refreshTimerMain').innerText = `${countdown}s`;
    }
  }, 1000);
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        clearInterval(timerInterval);
        if (gpsWatcherId) { navigator.geolocation.clearWatch(gpsWatcherId); gpsWatcherId = null; }
    } else if (ALL_ROUTES.length > 0) {
        startTimer();
        startGPSTracking();
    }
});

window.onload = initApp;
</script>
</body>
</html>
